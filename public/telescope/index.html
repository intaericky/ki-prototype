  $('toggle').onclick = () => { $('panel').classList.toggle('on'); $('toggle').classList.toggle('on'); };
}
function panelSync() {
  if (ROLE !== 'studio' || !$('fov')) return;
  $('panel').querySelectorAll('.seg[data-k]').forEach((g) => g.querySelectorAll('button').forEach((b) => b.classList.toggle('on', S[g.dataset.k] === b.dataset.v)));
  for (const [k, , , , f] of SL) { const i = $('panel').querySelector(`input[data-k="${k}"]`); i.value = S[k]; $('panel').querySelector(`output[data-o="${k}"]`).textContent = f(); }
  $('panel').querySelectorAll('input[data-c]').forEach((i) => { i.value = '#' + S[i.dataset.c]; });
  $('fov').value = Math.log(aim.fov / 0.5) / Math.log(280) * 100; $('fovo').textContent = (aim.fov < 10 ? aim.fov.toFixed(1) : Math.round(aim.fov)) + '°';
  $('pnote').innerHTML = `Standing in ${SITE.name} (${SITE.lat.toFixed(4)}° N, ${SITE.lon.toFixed(4)}° E), looking up. Every object is a real tracked object from CelesTrak (US Space Force public catalogue), placed from its latest orbital elements (Kepler + J2, about 15 km near the element epoch). No stars, Sun or Moon.<br><br>Drag the view to aim (or roll the ball in 360 / Sphere), wheel or pinch to zoom, click or Space to Zap whatever is inside the small circle at the cross.<br><br>Relay: ${Q.has('solo') ? 'off (solo)' : relayOk ? 'connected' : 'connecting…'}${ROOM ? ', room ' + ROOM : ''}. Tablet: /telescope-tablet${ROOM ? '?room=' + ROOM : ''}.`;
}

// ---------- size ----------
const PR = ROLE === 'display' ? 1 : Math.min(devicePixelRatio || 1, 2);
function resize() {
  // the real visible size (phones: the address bar and rotation change it), and both canvases styled to exactly that,
  // so nothing is stretched
  const vv = window.visualViewport, w = Math.round(vv ? vv.width : innerWidth), h = Math.round(vv ? vv.height : innerHeight);
  VW = w; VH = h;
  renderer.setPixelRatio(PR); renderer.setSize(w, h, true);
  over.width = Math.round(w * PR); over.height = Math.round(h * PR); over.style.width = w + 'px'; over.style.height = h + 'px';
  ballCam.aspect = cam3.aspect = w / h; ballCam.updateProjectionMatrix(); cam3.updateProjectionMatrix();
  LY = layout();
  if (ROLE === 'tablet') { const z = $('zap'); z.style.left = (LY.zb.cx - LY.zb.r) + 'px'; z.style.top = (LY.zb.cy - LY.zb.r) + 'px'; z.style.width = z.style.height = LY.zb.r * 2 + 'px'; }
}
addEventListener('resize', resize); window.visualViewport?.addEventListener('resize', resize);
addEventListener('orientationchange', () => { setTimeout(resize, 150); setTimeout(resize, 600); });

// ---------- tablet: the trackball, in lines ----------
function drawBall(ctx, b) {
  ctx.save();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, TAU); ctx.stroke();
  // the ball's seams, turned by the aim like the sphere's body (orthographic, front half only)
  const ca = Math.cos(aim.az * D2R), sa = Math.sin(aim.az * D2R), ce = Math.cos(aim.el * D2R), se = Math.sin(aim.el * D2R);
  const proj = (blat, blon) => { // ball frame → view
    let q = [Math.cos(blat) * Math.sin(blon), Math.sin(blat), Math.cos(blat) * Math.cos(blon)];
    q = [q[0], ce * q[1] + se * q[2], -se * q[1] + ce * q[2]]; // undo the tilt
    q = [ca * q[0] - sa * q[2], q[1], sa * q[0] + ca * q[2]]; // undo the turn
    return q;
  };
  ctx.strokeStyle = '#ffffff70'; ctx.lineWidth = 1;
  const line = (f) => { let on = false; ctx.beginPath(); for (let i = 0; i <= 72; i++) { const p = f(i / 72); if (p[2] > 0) { const x = b.cx + p[0] * b.r, y = b.cy - p[1] * b.r; on ? ctx.lineTo(x, y) : ctx.moveTo(x, y); on = true; } else on = false; } ctx.stroke(); };
  for (let la = -60; la <= 60; la += 30) line((t) => proj(la * D2R, t * TAU));
  for (let lo = 0; lo < 360; lo += 30) line((t) => proj((t - 0.5) * Math.PI, lo * D2R));
  ctx.restore();
}

// ---------- frame ----------
let lastWall = performance.now();
function frame() {
  const now = performance.now(), dtw = Math.min(0.25, (now - lastWall) / 1000); lastWall = now;
  if (clock) simT = ORB.clockNow(clock); else simT += dtw * 1000 * SPEED();
  step(); flushAim(); render();
  requestAnimationFrame(frame);
}
function render() {
  const w = VW, h = VH;
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, over.width, over.height);
  EU.uLens.value = S.lens; EU.uAz.value = aim.az; EU.uEl.value = aim.el; EU.uBody.value = S.body; EU.uMode.value = S.look === 'sky' ? 1 : 0;
  let inView = 0;
  const needFrame = S.view === '360' || S.view === 'ball';
  if (needFrame) {
    if (S.look === 'sky') { drawSky360(skyX, 1920, 1080); skyT.needsUpdate = true; }
    else { inView = drawScope(lensX, 1024, 1024, 'color', true); lensT.needsUpdate = true; }
  }
  if (ROLE === 'tablet') {
    renderer.clear();
    octx.setTransform(PR, 0, 0, PR, 0, 0);
    octx.fillStyle = '#000'; octx.fillRect(0, 0, w, h);
    const sc = LY.scope;
    octx.save(); octx.translate(sc.x, sc.y); inView = drawScope(octx, sc.w, sc.h, 'lines', true); octx.restore();
    drawBall(octx, LY.ball);
  } else if (S.view === 'scope') {
    renderer.clear();
    octx.setTransform(1, 0, 0, 1, 0, 0);
    inView = drawScope(octx, over.width, over.height, 'color', false);
  } else if (S.view === '360') {
    renderer.render(frameScene, flatCam);
  } else if (S.view === 'ball') {
    ballCam.position.set(Math.cos(ballView.pitch) * Math.sin(ballView.yaw), Math.sin(ballView.pitch), Math.cos(ballView.pitch) * Math.cos(ballView.yaw)).multiplyScalar(ballView.dist);
    ballCam.lookAt(0, 0, 0); renderer.render(ballScene, ballCam);
  } else if (S.view === '3d') {
    update3d();
    cam3.position.set(Math.cos(view3.pitch) * Math.sin(view3.yaw), Math.sin(view3.pitch), Math.cos(view3.pitch) * Math.cos(view3.yaw)).multiplyScalar(view3.dist);
    cam3.lookAt(0, 0, 0); renderer.render(scene3, cam3);
  }
  info(inView);
}
function info(inView) {
  if (ROLE === 'display') return;
  if (!loaded) { $('info').textContent = meta?.errors?.length ? 'Could not load the catalogue (' + meta.errors.join(', ') + '). Retrying in 10 minutes.' : 'Loading every tracked object…'; return; }
  const d = new Date(simT), t = d.toLocaleString('en-GB', { timeZone: 'Asia/Seoul', hour12: false, year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const z = zapped.size ? `\nZapped ${zapped.size}` + (log[0] ? `, last: ${log[0].name || TYPE_NAME[log[0].type] + ' ' + log[0].norad}` : '') : '';
  if (ROLE === 'tablet') { $('info').textContent = `${above.toLocaleString()} above ${SITE.name} now · ${inView.toLocaleString()} in view` + z; return; }
  $('info').textContent = `Above ${SITE.name} now: ${above.toLocaleString()} of ${objs.length.toLocaleString()} tracked objects (payloads ${aboveBy[0].toLocaleString()}, rocket bodies ${aboveBy[1].toLocaleString()}, debris ${aboveBy[2].toLocaleString()})`
    + (S.view === 'scope' || S.view === '360' && S.look === 'eye' || S.view === 'ball' && S.look === 'eye' ? `\nIn the view: ${inView.toLocaleString()}` : '')
    + `\n${t} KST${SPEED() > 1 ? ' · ' + SPEED().toLocaleString() + '×' : ''}` + z;
}

panelBuild(); resize(); panelSync();
if (TEST) window.__tel = { ingest, render, step, S, aim, zap, target, objs: () => objs, cand: () => cand, zapped, setSim: (t) => { simT = t; lastFull = -1e9; }, resize, above: () => above };
else load();
requestAnimationFrame(frame);
</script>
</body>
