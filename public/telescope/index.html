<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --fg: #fff; --dim: #ffffff73; --faint: #ffffff2e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 13px/1.45 Pretendard, -apple-system, sans-serif; font-weight: 400; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
  #o { pointer-events: none; }
  #info { position: fixed; left: 20px; bottom: 16px; color: var(--dim); font-variant-numeric: tabular-nums; pointer-events: none; white-space: pre; }
  #toggle { position: fixed; top: 16px; right: 16px; background: none; border: 1px solid var(--faint); color: var(--dim); font: inherit; padding: 6px 12px; border-radius: 0; cursor: pointer; }

  input[type=range]::-moz-range-track { height: 1px; background: var(--dim); }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #000; border: 1px solid var(--fg); }
  .note { color: var(--dim); font-size: 12px; margin-top: 12px; line-height: 1.5; }
  #card { position: fixed; left: 20px; top: 16px; max-width: 320px; color: var(--fg); font-variant-numeric: tabular-nums; pointer-events: none; opacity: 0; transition: opacity .25s; line-height: 1.6; font-size: 12px; }

<script type="module">
import * as THREE from 'three';
import * as ORB from '/entangled/orbit.js';
const { RE, D2R, TAU } = ORB;
THREE.ColorManagement.enabled = false;

// Telescope: the LED sphere as an observatory standing in Daejeon. The lower half is a fixed pedestal with a round screen
// facing the audience; the upper half is a dome that turns around the vertical axis, with a slit in which a telescope
// tilts around the horizontal axis. A camera rides in the telescope and looks at the real sky over Daejeon, which holds
// only what people put there: every tracked payload, rocket body and piece of debris (CelesTrak, the US Space Force
// public catalogue), at its real position now. The audience screen shows what that camera sees.
//
// The scene is built the way it will be built in Unreal (see /mnt/project-files/.../telescope/UNREAL.md):
//   Observatory: Pedestal (fixed) + Screen (fixed at the centre of the front, shows the eye camera) + Dome (yaw = azimuth) + Telescope (pitch =
//   elevation) carrying the Eye camera. Sky: a black world around the eye with one emissive mesh per object, placed by
//   its direction from Daejeon. LED frame: a 360 capture of the observatory from its centre, keeping the outermost
//   surface in each direction (reversed depth), so the frame is the outside of the apparatus wrapped on the sphere.
const Q = new URLSearchParams(location.search);
const ROLE = location.pathname.includes('display') || Q.has('display') ? 'display' : location.pathname.includes('tablet') || Q.has('tablet') ? 'tablet' : 'studio';
document.body.classList.add(ROLE);
const TEST = location.hash.includes('test');
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let VW = innerWidth, VH = innerHeight; // visible size, set in resize()

// ---------- where the observatory stands ----------
// Daejeon, KAIST main campus (WGS84)
const SITE = { name: 'Daejeon', lat: 36.3721, lon: 127.3604, h: 0.07 };
const WGS_F = 1 / 298.257223563, WGS_E2 = WGS_F * (2 - WGS_F);

const EAST = [-sλ, cλ, 0], NORTH = [-sφ * cλ, -sφ * sλ, cφ], UP = [cφ * cλ, cφ * sλ, sφ];

// ---------- settings ----------
// front: the compass direction the audience side of the sphere faces in the room (calibration). seams: vertical seams of
// the pedestal; the slit is as wide as one pedestal panel. screen: the audience screen's diameter, % of the sphere's.
const DEF = { view: 'app', dot: 5, show: 'all', shadow: '0', spd: 0, cross: '1', front: 180, seams: 8, screen: 33, tone: 82, c0: 'ffffff', c1: 'ffffff', c2: 'ffffff', c3: 'ffffff' };
let S = { ...DEF };
const KEY = 'telescope-v2';
if (ROLE === 'studio' && !TEST) try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
for (const k of Object.keys(DEF)) if (Q.has(k)) S[k] = typeof DEF[k] === 'number' ? +Q.get(k) : Q.get(k);
if (ROLE === 'display') S.view = '360';
if (ROLE === 'tablet') S.view = 'tablet';
const save = () => { if (ROLE === 'studio' && !TEST) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} sendSettings(); } };
const SPEED = () => Math.round(Math.pow(10, S.spd / 25)); // 1× .. 10,000×
const TYPES = [['Payloads', 'c0'], ['Rocket bodies', 'c1'], ['Debris', 'c2'], ['Unknown', 'c3']];

// ---------- the mount: what the controls ask for (tgt) and where the machine actually is (mnt) ----------
// Azimuth is 0 = north, clockwise, and never wrapped (the dome turns freely; 370 is 10 past north, one turn on).
// Elevation is held between the horizon and the zenith: the telescope cannot look into the ground or at the audience.
const LIM = { elMin: 0, elMax: 90, vAz: 80, vEl: 55, acc: 220, fovMin: 0.5, fovMax: 100 };
const tgt = { az: 180, el: 35, fov: 50 };
const mnt = { az: 180, el: 35, fov: 50, vAz: 0, vEl: 0 };
const clampTgt = () => { if (!Number.isFinite(tgt.az)) tgt.az = mnt.az; tgt.el = clamp(tgt.el, LIM.elMin, LIM.elMax); tgt.fov = clamp(tgt.fov, LIM.fovMin, LIM.fovMax); };
// each axis is driven like a motor: it accelerates, cruises at its top speed and settles on the target without a jump
function slew(dt) {
  for (const [k, v, vmax] of [['az', 'vAz', LIM.vAz], ['el', 'vEl', LIM.vEl]]) {
    const err = tgt[k] - mnt[k];
    const want = clamp(err * 6, -vmax, vmax);
    mnt[v] += clamp(want - mnt[v], -LIM.acc * dt, LIM.acc * dt);
    mnt[k] += mnt[v] * dt;
    if (Math.abs(err) < 0.002 && Math.abs(mnt[v]) < 0.05) { mnt[k] = tgt[k]; mnt[v] = 0; }
  }
  mnt.el = clamp(mnt.el, LIM.elMin, LIM.elMax);
  mnt.fov += (tgt.fov - mnt.fov) * (1 - Math.exp(-dt * 12)); // the zoom is optical and quick
}
const azN = () => ((mnt.az % 360) + 360) % 360;

// ---------- catalogue ----------
let objs = [], catQ = [], T0 = Date.now(), simT = Date.now(), loaded = false, meta = null;
// per object: unit direction from Daejeon in east/north/up, range km, height km; only filled for objects near the sky
let dirE, dirN, dirU, rng, alt, cand = [], above = 0, aboveBy = [0, 0, 0, 0], lastFull = -1e9;
function ingest(parts) {
  objs = ORB.parseCatalogue(parts);
  catQ = objs.map((o) => ORB.prep(o, simT)); T0 = simT;
  const n = objs.length; dirE = new Float32Array(n); dirN = new Float32Array(n); dirU = new Float32Array(n); rng = new Float32Array(n); alt = new Float32Array(n);
  lastFull = -1e9; loaded = true; build3d(); buildSky(); panelSync();
}
// CelesTrak updates its element sets about every 2 hours and asks not to be fetched more often; the site's API keeps
// one copy for 2 hours, so the page reloads the catalogue every 2 hours too.
const good = {};
async function load() {
  const names = ['active', 'rocket', 'debris', 'satcat'];
  const res = await Promise.all(names.map((p) => fetch('/api/space-objects?part=' + p).then((r) => r.json()).catch((e) => ({ rows: [], errors: [String(e)] }))));
  const failed = [];
  names.forEach((p, i) => { if (res[i].rows?.length) good[p] = res[i]; else failed.push(p); });
  meta = { fetched: Object.values(good).map((r) => r.fetched).filter(Boolean).sort()[0] ?? null, errors: failed };
  if (good.active || good.debris) ingest(good);

const tmpP = [0, 0, 0];
function locate(j, dt, c, s) {
  ORB.posEci(catQ[j], dt, tmpP);
  const x = c * tmpP[0] + s * tmpP[1], y = -s * tmpP[0] + c * tmpP[1], z = tmpP[2]; // Earth-fixed
  const rx = x - OBS[0], ry = y - OBS[1], rz = z - OBS[2], r = Math.hypot(rx, ry, rz);
  dirE[j] = (EAST[0] * rx + EAST[1] * ry) / r; dirN[j] = (NORTH[0] * rx + NORTH[1] * ry + NORTH[2] * rz) / r; dirU[j] = (UP[0] * rx + UP[1] * ry + UP[2] * rz) / r;
  rng[j] = r; alt[j] = Math.hypot(x, y, z) - RE;
}
// Every object is placed at least once a second (once per frame at high speed); between those passes only the ones near
// or above the horizon are moved, which is what the telescope can see.
function step() {
  if (!loaded) return;
  const dt = (simT - T0) / 1000, th = ORB.gmst(simT), c = Math.cos(th), s = Math.sin(th);
  const now = performance.now();
  if (now - lastFull > Math.max(16, 1000 / SPEED())) {
    lastFull = now; cand = [];
    for (let j = 0; j < objs.length; j++) { locate(j, dt, c, s); if (dirU[j] > -0.12) cand.push(j); }
  } else for (const j of cand) locate(j, dt, c, s);
  above = 0; aboveBy = [0, 0, 0, 0];
  for (const j of cand) if (dirU[j] > 0) { above++; aboveBy[objs[j].type]++; }

// sunlit or in the Earth's shadow (cylindrical shadow), for the optional Earth shadow dimming
function sunEci(ms) {
  const n = ms / 864e5 + 2440587.5 - 2451545, L = (280.46 + 0.9856474 * n) * D2R, g = (357.528 + 0.9856003 * n) * D2R;
  const lam = L + (1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * D2R, eps = 23.439 * D2R;
  return [Math.cos(lam), Math.cos(eps) * Math.sin(lam), Math.sin(eps) * Math.sin(lam)];
}
function lit(j, sun) {
  ORB.posEci(catQ[j], (simT - T0) / 1000, tmpP);
  const d = tmpP[0] * sun[0] + tmpP[1] * sun[1] + tmpP[2] * sun[2];
  if (d > 0) return true;
  return Math.hypot(tmpP[0] - d * sun[0], tmpP[1] - d * sun[1], tmpP[2] - d * sun[2]) > RE;
}

// ---------- the view through the telescope ----------
function basis() {
  const a = mnt.az * D2R, e = mnt.el * D2R;
  const f = [Math.cos(e) * Math.sin(a), Math.cos(e) * Math.cos(a), Math.sin(e)]; // east, north, up
  const r = [Math.cos(a), -Math.sin(a), 0];
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]]; // r × f: up in the view
  return { f, r, u };
}
const hexRgb = (h) => [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
const dirName = (az) => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round((((az % 360) + 360) % 360) / 45) % 8];
// the object under the cross: within 2.5% of the field (at least 0.15°)
const NEAR_DEG = () => Math.max(0.15, mnt.fov * 0.025);
function target() {
  const B = basis(), lim = Math.cos(NEAR_DEG() * D2R);
  let best = -1, bc = lim;
  for (const j of cand) {
    if (dirU[j] <= 0 || !showType(objs[j].type)) continue;
    const c = dirE[j] * B.f[0] + dirN[j] * B.f[1] + dirU[j] * B.f[2];
    if (c > bc) { bc = c; best = j; }
  }
  return best;
}

// The sky the eye camera sees (three.js axes: x east, y up, z south). Each object is one small emissive mesh at its
// direction from Daejeon; its size is a fixed share of the field, so it stays a dot when zooming.
const SKY_R = 1000;
const skyScene = new THREE.Scene(); skyScene.background = new THREE.Color(0x000000);
const ground = new THREE.Mesh(new THREE.SphereGeometry(SKY_R * 0.9, 96, 24, 0, TAU, Math.PI / 2, Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x080808, side: THREE.BackSide }));
skyScene.add(ground);
{ const p = []; for (let i = 0; i <= 360; i++) p.push(Math.sin(i * D2R) * SKY_R * 0.899, 0, -Math.cos(i * D2R) * SKY_R * 0.899);
  skyScene.add(new THREE.Line(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(p, 3)), new THREE.LineBasicMaterial({ color: 0x5a5a5a }))); }
let skyMesh = null;
function buildSky() {
  if (skyMesh) { skyScene.remove(skyMesh); skyMesh.dispose(); }
  skyMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 2), new THREE.MeshBasicMaterial({ color: 0xffffff }), Math.max(1, objs.length));
  skyMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(Math.max(1, objs.length) * 3), 3);
  skyMesh.count = 0; skyMesh.frustumCulled = false; skyScene.add(skyMesh);
}
function updateSky(frac = S.dot * 0.004) { // frac: the dot's radius as a share of the half field
  if (!skyMesh || !loaded) return;
  const M = skyMesh.instanceMatrix.array, C = skyMesh.instanceColor.array;
  const s = SKY_R * Math.tan(mnt.fov * D2R / 2) * frac;
  const cols = TYPES.map(([, k]) => hexRgb(S[k]).map((v) => v / 255));
  const sun = S.shadow === '1' ? sunEci(simT) : null;
  let n = 0;
  for (const j of cand) {
    if (dirU[j] <= -0.01 || !showType(objs[j].type)) continue;
    const o = n * 16, c = cols[objs[j].type], k = sun && !lit(j, sun) ? 0.25 : 1;
    M[o] = s; M[o + 5] = s; M[o + 10] = s; M[o + 12] = dirE[j] * SKY_R; M[o + 13] = dirU[j] * SKY_R; M[o + 14] = -dirN[j] * SKY_R;
    C[n * 3] = c[0] * k; C[n * 3 + 1] = c[1] * k; C[n * 3 + 2] = c[2] * k;
    n++;
  }
  skyMesh.count = n; skyMesh.instanceMatrix.needsUpdate = true; skyMesh.instanceColor.needsUpdate = true;
}
// the eye camera rides in the telescope: yaw by azimuth, then pitch by elevation (no roll)
const EYE_PX = ROLE === 'display' ? 768 : 1024;
const eyeCam = new THREE.PerspectiveCamera(50, 1, 1, SKY_R * 2), scopeCam = new THREE.PerspectiveCamera(50, 1, 1, SKY_R * 2);
const eyeRT = new THREE.WebGLRenderTarget(EYE_PX, EYE_PX, { samples: 4 });
function aimCam(cam) { cam.rotation.set(mnt.el * D2R, -mnt.az * D2R, 0, 'YXZ'); cam.fov = mnt.fov; cam.updateProjectionMatrix(); }

// ---------- the observatory (radius 1; y up; the audience at +z) ----------
const obsScene = new THREE.Scene();
const PU = { uCap: { value: 0 }, uL: { value: new THREE.Vector3(-0.42, 0.78, 0.46).normalize() }, uTone: { value: 0.82 } };
const PAINT_V = /* glsl */`
  varying vec3 vW, vN, vL;
  void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); vL = position; gl_Position = projectionMatrix * viewMatrix * w; }`;
// Plain painted metal under one soft key light and sky fill. uCap = 1 during the 360 capture from the centre: the
// outside is what counts there, so faces are shaded as seen from outside along the radius.
const PAINT_F = /* glsl */`
  uniform vec3 uC, uL; uniform float uCap, uTone, uToned, uSpec, uIn, uSlit, uHalf, uExt;
  varying vec3 vW, vN, vL;
  void main() {
    if (uSlit > 0.5 && abs(vL.x) < uHalf && vL.z > -uExt) discard; // the dome's slit, in the dome's own frame
    vec3 n = normalize(vN);
    vec3 V = uCap > 0.5 ? normalize(vW) : normalize(cameraPosition - vW);
    float shade = uIn;
    if (uCap < 0.5 && !gl_FrontFacing) { n = -n; shade *= 0.22; } // inside the dome: in its own shadow
    shade *= mix(0.2, 1.0, smoothstep(0.72, 0.97, length(vW))); // the mechanism deep inside gets little light

    float sp = pow(max(dot(n, normalize(uL + V)), 0.0), 48.0) * uSpec;
    float rim = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 4.0) * 0.05;

const SLIT = { uHalf: { value: 0.38 }, uExt: { value: Math.sin(14 * D2R) } };
const mats = [];
function paint(hex, o = {}) {

    uniforms: { ...PU, ...SLIT, uC: { value: new THREE.Color(hex) }, uToned: { value: o.toned ? 1 : 0 }, uSpec: { value: o.spec ?? 0.1 }, uIn: { value: o.inside ?? 1 }, uSlit: { value: o.slit ? 1 : 0 } } });

const obs = new THREE.Group(), dome = new THREE.Group(), tel = new THREE.Group();
obsScene.add(obs);
// the screen: shows the eye camera, round, fixed on the pedestal facing the audience
const SCREEN_V = /* glsl */`varying vec3 vL; void main() { vL = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const SCREEN_F = /* glsl */`
  uniform sampler2D tV; uniform float uA, uCross;
  varying vec3 vL;
  void main() {
    vec3 p = normalize(vL);
    float r = acos(clamp(p.y, -1.0, 1.0)) / uA;
    vec2 d = length(p.xz) > 1e-6 ? normalize(vec2(p.x, -p.z)) : vec2(0.0);
    vec2 uv = 0.5 + 0.5 * d * min(r, 1.0);

      float l = step(abs(q.y), w) * step(g, abs(q.x)) * step(abs(q.x), L) + step(abs(q.x), w) * step(g, abs(q.y)) * step(abs(q.y), L);

const SU = { tV: { value: eyeRT.texture }, uA: { value: 0.34 }, uCross: { value: 1 } };
let builtKey = '';
function disposeGroup(g) { for (const c of [...g.children]) { g.remove(c); c.traverse?.((x) => { x.geometry?.dispose(); }); } }
function buildObs() {
  const key = [S.seams, S.screen].join();
  if (key === builtKey) return; builtKey = key;
  disposeGroup(obs); disposeGroup(dome); disposeGroup(tel); mats.length = 0;
  const white = paint(0xffffff, { toned: true, spec: 0.12 }), dark = paint(0x2a2b2d, { spec: 0.25 }), core = paint(0x0b0b0c, { spec: 0 });
  const panelW = TAU / Math.max(3, S.seams), half = Math.sin(panelW / 2); // the slit is as wide as one pedestal panel
  SLIT.uHalf.value = half;
  // pedestal: panels with real gaps between them (the dark core shows through), centred so one panel faces the audience
  const gap = 0.8 * D2R;
  for (let k = 0; k < S.seams; k++) {
    const lon0 = -panelW / 2 + k * panelW + gap / 2;
    const g = new THREE.SphereGeometry(1, Math.max(8, Math.round(160 / S.seams)), 48, lon0 + Math.PI / 2, panelW - gap, Math.PI / 2 + 0.6 * D2R, Math.PI / 2 - 0.6 * D2R);
    obs.add(new THREE.Mesh(g, white));

}
function zoomBy(f) {
  if (ROLE !== 'tablet' && (S.view === '3d' || S.view === 'app')) { const v = S.view === '3d' ? view3 : orbit; v.dist = clamp(v.dist * f, 1.3, 20); return; }
  tgt.fov *= f; clampTgt(); aimChanged();
}
if (ROLE !== 'display') {
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) gesture = { kind: where(e.clientX, e.clientY) };
    else pinch0 = null;
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch0) zoomBy(pinch0 / d); pinch0 = d; return;
    }
    if (gesture) dragBy(gesture.kind, dx, dy);
  });
  const up = (e) => { if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); pinch0 = null; if (!ptrs.size) gesture = null; };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoomBy(Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0015))); }, { passive: false });
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
    if (k) { e.preventDefault(); tgt.az += k[0] * Math.max(2, tgt.fov * 0.1); tgt.el += k[1] * Math.max(2, tgt.fov * 0.1); clampTgt(); aimChanged(); }
  });
}
addEventListener('keydown', (e) => { if (e.key === 'f' && ROLE === 'display') document.documentElement.requestFullscreen?.(); });

// ---------- panel (studio) ----------
const SL = [['dot', 'Dot size', 1, 20, () => S.dot], ['tone', 'Paint', 20, 100, () => S.tone + '%'], ['seams', 'Seams', 4, 16, () => S.seams], ['screen', 'Screen', 15, 50, () => S.screen + '%'],
  ['front', 'Front faces', 0, 359, () => dirName(S.front) + ' ' + S.front + '°'], ['spd', 'Speed', 0, 100, () => SPEED().toLocaleString() + '×']];
const SEG = [['view', 'View', [['app', 'Apparatus'], ['scope', 'Telescope'], ['360', '360'], ['ball', 'Sphere'], ['3d', 'Earth']]],
  ['show', 'Objects', [['all', 'All'], ['pay', 'Payloads'], ['deb', 'Debris'], ['junk', 'Not payloads']]], ['shadow', 'Earth shadow', [['0', 'Ignore'], ['1', 'Dim']]], ['cross', 'Cross', [['1', 'On'], ['0', 'Off']]]];
function panelBuild() {
  if (ROLE !== 'studio') return;
  $('panel').innerHTML = SEG.map(([k, l, o]) => `<div class="row"><label>${l}</label><div class="seg" data-k="${k}">${o.map(([v, t]) => `<button data-v="${v}">${t}</button>`).join('')}</div></div>`).join('')
    + SL.map(([k, l, a, b]) => `<div class="row"><label>${l}</label><input type="range" data-k="${k}" min="${a}" max="${b}" step="1"><output data-o="${k}"></output></div>`).join('')
    + `<div class="row"><label>Field</label><input type="range" id="fov" min="0" max="100" step="0.5"><output id="fovo"></output></div>`
    + TYPES.map(([n, k]) => `<div class="row"><label>${n}</label><input type="color" data-c="${k}" style="grid-column:2/4;width:100%;height:22px;padding:0;border:1px solid var(--faint);background:none"></div>`).join('')
    + `<div class="row"><label></label><div class="seg"><button id="copy">Copy display URL</button><button id="reset">Defaults</button></div></div>
    <div class="note" id="pnote"></div>`;
  $('panel').querySelectorAll('.seg[data-k]').forEach((g) => g.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S[g.dataset.k] = b.dataset.v; save(); panelSync(); resize(); }));
  $('panel').querySelectorAll('input[data-k]').forEach((i) => i.addEventListener('input', () => { S[i.dataset.k] = +i.value; if (i.dataset.k === 'spd') { sendClock(); } save(); panelSync(); }));
  $('panel').querySelectorAll('input[data-c]').forEach((i) => i.addEventListener('input', () => { S[i.dataset.c] = i.value.slice(1); save(); }));
  $('fov').addEventListener('input', (e) => { tgt.fov = 0.5 * Math.pow(200, +e.target.value / 100); clampTgt(); aimChanged(); panelSync(); });
  $('copy').onclick = () => { const q = new URLSearchParams(); if (ROOM) q.set('room', ROOM); const u = location.origin + '/telescope-display' + (q.toString() ? '?' + q : ''); navigator.clipboard?.writeText(u).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => { $('copy').textContent = 'Copy display URL'; }, 1500); }, () => { $('copy').textContent = u; }); };
  $('reset').onclick = () => { S = { ...DEF }; save(); panelSync(); resize(); };
  $('toggle').onclick = () => { $('panel').classList.toggle('on'); $('toggle').classList.toggle('on'); };
}
function panelSync() {
  if (ROLE !== 'studio' || !$('fov')) return;
  $('panel').querySelectorAll('.seg[data-k]').forEach((g) => g.querySelectorAll('button').forEach((b) => b.classList.toggle('on', S[g.dataset.k] === b.dataset.v)));
  for (const [k, , , , f] of SL) { const i = $('panel').querySelector(`input[data-k="${k}"]`); i.value = S[k]; $('panel').querySelector(`output[data-o="${k}"]`).textContent = f(); }
  $('panel').querySelectorAll('input[data-c]').forEach((i) => { i.value = '#' + S[i.dataset.c]; });
  $('fov').value = Math.log(tgt.fov / 0.5) / Math.log(200) * 100; $('fovo').textContent = (tgt.fov < 10 ? tgt.fov.toFixed(1) : Math.round(tgt.fov)) + '°';
  $('pnote').innerHTML = `An observatory standing in ${SITE.name} (${SITE.lat.toFixed(4)}° N, ${SITE.lon.toFixed(4)}° E). Every object is a real tracked object from CelesTrak (US Space Force public catalogue), placed from its latest orbital elements (Kepler + J2), reloaded every 2 hours. No stars, Sun or Moon.<br><br>Front faces: the compass direction the audience side of the sphere faces in the room.<br><br>Drag to aim (Telescope, 360, Sphere) or to look around (Apparatus, Earth); wheel or pinch to zoom; arrow keys move the telescope. Click once for the motor sound.<br><br>Relay: ${Q.has('solo') ? 'off (solo)' : relayOk ? 'connected' : 'connecting…'}${ROOM ? ', room ' + ROOM : ''}. Tablet: /telescope-tablet${ROOM ? '?room=' + ROOM : ''}.`;
}

// ---------- size ----------
const PR = ROLE === 'display' ? 1 : Math.min(devicePixelRatio || 1, 2);
function resize() {
  // the real visible size (phones: the address bar and rotation change it), and both canvases styled to exactly that
  const vv = window.visualViewport, w = Math.round(vv ? vv.width : innerWidth), h = Math.round(vv ? vv.height : innerHeight);
  VW = w; VH = h;
  renderer.setPixelRatio(PR); renderer.setSize(w, h, true);
  over.width = Math.round(w * PR); over.height = Math.round(h * PR); over.style.width = w + 'px'; over.style.height = h + 'px';
  ballCam.aspect = cam3.aspect = appCam.aspect = scopeCam.aspect = w / h;
  for (const c of [ballCam, cam3, appCam, scopeCam]) c.updateProjectionMatrix();
  LY = layout();
}
addEventListener('resize', resize); window.visualViewport?.addEventListener('resize', resize);
addEventListener('orientationchange', () => { setTimeout(resize, 150); setTimeout(resize, 600); });

// ---------- tablet: the eyepiece in lines (gnomonic: straight lines stay straight) ----------
function drawScope(ctx, w, h) {
  const B = basis(), cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2, F = R / Math.tan(mnt.fov * D2R / 2), px = Math.max(1, R / 400);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  const hy = cy + Math.tan(mnt.el * D2R) * F; // the horizon
  if (hy < h + 2) { ctx.strokeStyle = '#ffffff90'; ctx.lineWidth = px; ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(w, hy); ctx.stroke(); }
  let inView = 0;
  const rr = 2 * px;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = px; ctx.beginPath();
  for (const j of cand) {
    if (dirU[j] <= 0 || !showType(objs[j].type)) continue;
    const z = dirE[j] * B.f[0] + dirN[j] * B.f[1] + dirU[j] * B.f[2];
    if (z <= 0.01) continue;
    const x = cx + (dirE[j] * B.r[0] + dirN[j] * B.r[1] + dirU[j] * B.r[2]) / z * F;
    const y = cy - (dirE[j] * B.u[0] + dirN[j] * B.u[1] + dirU[j] * B.u[2]) / z * F;
    if (x < -rr || x > w + rr || y < -rr || y > h + rr) continue;
    inView++;
    if (j === near) continue;
    ctx.moveTo(x + rr, y); ctx.arc(x, y, rr, 0, TAU);
  }
  ctx.stroke();
  if (near >= 0) { // the one under the cross: filled
    const j = near, z = dirE[j] * B.f[0] + dirN[j] * B.f[1] + dirU[j] * B.f[2];
    if (z > 0.01) { const x = cx + (dirE[j] * B.r[0] + dirN[j] * B.r[1] + dirU[j] * B.r[2]) / z * F, y = cy - (dirE[j] * B.u[0] + dirN[j] * B.u[1] + dirU[j] * B.u[2]) / z * F; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, rr * 1.6, 0, TAU); ctx.fill(); }
  }
  if (S.cross === '1') {
    const g = R * 0.05, L = R * 0.16;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = px; ctx.beginPath();
    ctx.moveTo(cx - L, cy); ctx.lineTo(cx - g, cy); ctx.moveTo(cx + g, cy); ctx.lineTo(cx + L, cy);
    ctx.moveTo(cx, cy - L); ctx.lineTo(cx, cy - g); ctx.moveTo(cx, cy + g); ctx.lineTo(cx, cy + L); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = px; ctx.beginPath(); ctx.arc(cx, cy, R - px / 2, 0, TAU); ctx.stroke();
  // readout under the eyepiece
  ctx.fillStyle = '#ffffff90'; ctx.font = `${Math.round(11 * px)}px Pretendard, sans-serif`; ctx.textAlign = 'center';
  ctx.fillText(`${dirName(mnt.az)} ${azN().toFixed(1)}°   ${mnt.el.toFixed(1)}°   ${mnt.fov < 10 ? mnt.fov.toFixed(1) : Math.round(mnt.fov)}°`, cx, cy + R * 0.9);
  return inView;
}

// ---------- tablet: the apparatus in wireframe, see-through (far side faint), seen from the audience, a little above ----------
function drawRig(ctx, b) {
  const tilt = 18 * D2R, ct = Math.cos(tilt), st = Math.sin(tilt);
  const proj = (p) => [b.cx + p[0] * b.r, b.cy - (p[1] * ct - p[2] * st) * b.r, p[1] * st + p[2] * ct];
  const FRONT = '#ffffffe6', BACK = '#ffffff30';
  // a path, split into front and back parts
  const path = (f, n) => {
    for (const side of [1, -1]) {
      ctx.strokeStyle = side > 0 ? FRONT : BACK; ctx.beginPath(); let on = false;
      for (let i = 0; i <= n; i++) { const q = proj(f(i / n)); if (q[2] * side >= 0) { on ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); on = true; } else on = false; }
      ctx.stroke();
    }
  };
  const sph = (la, lo, r = 1) => [r * Math.cos(la) * Math.sin(lo), r * Math.sin(la), r * Math.cos(la) * Math.cos(lo)];
  ctx.save(); ctx.lineWidth = 1;
  ctx.strokeStyle = FRONT; ctx.beginPath(); ctx.ellipse(b.cx, b.cy, b.r, b.r, 0, 0, TAU); ctx.stroke(); // outline
  path((t) => sph(0, t * TAU), 160); // the bearing
  path((t) => sph(-3.6 * D2R, t * TAU), 160);
  const n = Math.max(3, S.seams), pw = TAU / n;
  for (let k = 0; k < n; k++) { const lo = -pw / 2 + k * pw; path((t) => sph(-t * Math.PI / 2, lo), 40); } // pedestal seams
  // audience screen
  const capA = Math.asin(clamp(S.screen / 100, 0.1, 0.6)), lat = 0;
  const ax = [0, Math.sin(lat), Math.cos(lat)], e1 = [1, 0, 0], e2 = [0, Math.cos(lat), -Math.sin(lat)];
  path((t) => { const a = t * TAU, s = Math.sin(capA), c = Math.cos(capA); return [ax[0] * c + (e1[0] * Math.cos(a) + e2[0] * Math.sin(a)) * s, ax[1] * c + (e1[1] * Math.cos(a) + e2[1] * Math.sin(a)) * s, ax[2] * c + (e1[2] * Math.cos(a) + e2[2] * Math.sin(a)) * s]; }, 96);
  // dome: slit edges and the telescope, turned by the mount
  const lo = (S.front - mnt.az) * D2R, cl = Math.cos(lo), sl = Math.sin(lo);
  const D = (p) => [cl * p[0] + sl * p[2], p[1], -sl * p[0] + cl * p[2]]; // dome frame → world
  const half = Math.sin(pw / 2), ext = Math.sin(14 * D2R);
  for (const sgn of [-1, 1]) { const x0 = sgn * half, R = Math.sqrt(1 - x0 * x0), T = Math.PI / 2 + Math.asin(ext / R); path((t) => D([x0, R * Math.sin(t * T), R * Math.cos(t * T)]), 64); }
  const el = mnt.el * D2R, ce = Math.cos(el), se = Math.sin(el);
  const T = (p) => D([p[0], p[1] * ce + p[2] * se, -p[1] * se + p[2] * ce]); // telescope frame → world
  const TR = half * 0.76, ringAt = (r, z) => path((t) => T([r * Math.cos(t * TAU), r * Math.sin(t * TAU), z]), 64);
  ringAt(TR, 0.9); ringAt(TR * 0.92, 0.5); ringAt(TR * 0.84, 0.22);
  for (let i = 0; i < 4; i++) { const a = i * TAU / 4 + TAU / 8; path((t) => T([TR * (0.92 - 0.08 * t) * Math.cos(a), TR * (0.92 - 0.08 * t) * Math.sin(a), 0.9 - 0.68 * t]), 4); }
  // where it looks: a thin line out of the lens
  path((t) => T([0, 0, 0.9 + t * 0.35]), 6);
  ctx.restore();
}

// ---------- frame ----------
let lastWall = performance.now();
function frame() {
  const now = performance.now(), dtw = Math.min(0.1, (now - lastWall) / 1000); lastWall = now;
  if (clock) simT = ORB.clockNow(clock); else simT += dtw * 1000 * SPEED();
  slew(dtw); step(); flushAim(); updateAudio(); render();
  requestAnimationFrame(frame);
}
function renderEye() {
  updateSky(); aimCam(eyeCam);
  renderer.setRenderTarget(eyeRT); renderer.render(skyScene, eyeCam); renderer.setRenderTarget(null);
}
function renderFrame(target) {
  buildObs(); poseObs(); renderEye(); capture();
  renderer.setRenderTarget(target); renderer.render(frameScene, flatCam); renderer.setRenderTarget(null);
}
function render() {
  const w = VW, h = VH;
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, over.width, over.height);
  if (loaded) updateCard();
  let inView = 0;
  if (ROLE === 'tablet') {
    renderer.clear();
    octx.setTransform(PR, 0, 0, PR, 0, 0);
    octx.fillStyle = '#000'; octx.fillRect(0, 0, w, h);
    const sc = LY.scope;
    octx.save(); octx.translate(sc.x, sc.y); inView = drawScope(octx, sc.w, sc.h); octx.restore();
    drawRig(octx, LY.rig);
  } else if (S.view === 'scope') {
    updateSky(S.dot * 0.45 / (h / 2)); aimCam(scopeCam); scopeCam.aspect = w / h; scopeCam.updateProjectionMatrix();
    renderer.render(skyScene, scopeCam);
    if (S.cross === '1') {
      const s = Math.min(w, h) / 2 * PR, cx = over.width / 2, cy = over.height / 2, g = s * 0.05, L = s * 0.16;
      octx.strokeStyle = '#ffffffd9'; octx.lineWidth = PR; octx.beginPath();
      octx.moveTo(cx - L, cy); octx.lineTo(cx - g, cy); octx.moveTo(cx + g, cy); octx.lineTo(cx + L, cy);
      octx.moveTo(cx, cy - L); octx.lineTo(cx, cy - g); octx.moveTo(cx, cy + g); octx.lineTo(cx, cy + L); octx.stroke();
    }
  } else if (S.view === '360') {
    renderFrame(null);
  } else if (S.view === 'ball') {
    renderFrame(frameRT);
    ballCam.position.set(Math.cos(orbit.pitch) * Math.sin(orbit.yaw), Math.sin(orbit.pitch), Math.cos(orbit.pitch) * Math.cos(orbit.yaw)).multiplyScalar(orbit.dist);
    ballCam.lookAt(0, 0, 0); renderer.render(ballScene, ballCam);
  } else if (S.view === 'app') {
    buildObs(); poseObs(); renderEye();
    appCam.position.set(Math.cos(orbit.pitch) * Math.sin(orbit.yaw), Math.sin(orbit.pitch), Math.cos(orbit.pitch) * Math.cos(orbit.yaw)).multiplyScalar(orbit.dist);
    appCam.lookAt(0, 0, 0); renderer.render(obsScene, appCam);
  } else if (S.view === '3d') {
    update3d();
    cam3.position.set(Math.cos(view3.pitch) * Math.sin(view3.yaw), Math.sin(view3.pitch), Math.cos(view3.pitch) * Math.cos(view3.yaw)).multiplyScalar(view3.dist);
    cam3.lookAt(0, 0, 0); renderer.render(scene3, cam3);
  }
  info(inView);
}
function info(inView) {
  if (ROLE === 'display') return;
  if (!loaded) { $('info').textContent = meta?.errors?.length ? 'Could not load the catalogue (' + meta.errors.join(', ') + '). Retrying in 10 minutes.' : 'Loading every tracked object…'; return; }
  const d = new Date(simT), t = d.toLocaleString('en-GB', { timeZone: 'Asia/Seoul', hour12: false, year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  if (ROLE === 'tablet') { $('info').textContent = `${above.toLocaleString()} above ${SITE.name} now · ${inView.toLocaleString()} in view`; return; }
  $('info').textContent = `Above ${SITE.name} now: ${above.toLocaleString()} of ${objs.length.toLocaleString()} tracked objects (payloads ${aboveBy[0].toLocaleString()}, rocket bodies ${aboveBy[1].toLocaleString()}, debris ${aboveBy[2].toLocaleString()})`
    + `\nLooking ${dirName(mnt.az)} ${azN().toFixed(1)}°, ${mnt.el.toFixed(1)}° up, ${mnt.fov < 10 ? mnt.fov.toFixed(1) : Math.round(mnt.fov)}° field`
    + `\n${t} KST${SPEED() > 1 ? ' · ' + SPEED().toLocaleString() + '×' : ''}`;
}

panelBuild(); resize(); panelSync();
if (TEST) window.__tel = { scopeCam, eyeCam, ingest, render, step, S, tgt, mnt, target, objs: () => objs, cand: () => cand, setSim: (t) => { simT = t; lastFull = -1e9; }, resize, above: () => above, snap: () => { Object.assign(mnt, { az: tgt.az, el: tgt.el, fov: tgt.fov, vAz: 0, vEl: 0 }); } };
load();
requestAnimationFrame(frame);
</script>
</body>
