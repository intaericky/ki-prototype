<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Refraction</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --fg: #fff; --dim: #ffffff73; --faint: #ffffff2e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 13px/1.45 Pretendard, -apple-system, sans-serif; font-weight: 400; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #info { position: fixed; left: 20px; bottom: 16px; color: var(--dim); font-variant-numeric: tabular-nums; pointer-events: none; white-space: pre; }
  #toggle { position: fixed; top: 16px; right: 16px; background: none; border: 1px solid var(--faint); color: var(--dim); font: inherit; padding: 6px 12px; border-radius: 0; cursor: pointer; }
  #toggle.on { color: var(--fg); border-color: var(--fg); }
  #panel { position: fixed; top: 56px; right: 16px; width: 300px; max-height: calc(100vh - 80px); overflow: auto; background: #000000d9; border: 1px solid var(--faint); padding: 14px 16px; display: none; }
  #panel.on { display: block; }
  .row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { color: var(--dim); }
  .row output { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .seg { grid-column: 2 / 4; display: flex; gap: 0; }
  .seg button { flex: 1; background: none; color: var(--dim); border: 1px solid var(--faint); margin-left: -1px; padding: 4px 0; font: inherit; cursor: pointer; }
  .seg button.on { color: #000; background: var(--fg); border-color: var(--fg); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; background: none; height: 18px; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--dim); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #000; border: 1px solid var(--fg); margin-top: -5px; }
  input[type=range]::-moz-range-track { height: 1px; background: var(--dim); }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #000; border: 1px solid var(--fg); }
  .checks { grid-column: 2 / 4; display: grid; gap: 4px; }
  .checks label { color: var(--fg); display: flex; gap: 8px; align-items: center; }
  .checks span { color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }
  .checks input { accent-color: #fff; margin: 0; }
  .note { color: var(--dim); font-size: 12px; margin-top: 12px; line-height: 1.5; }
  .err { color: #fff; }
  body.display #toggle, body.display #panel, body.display #info { display: none; }
  body.tablet #toggle { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"></div>
<button id="toggle">Settings</button>
<div id="panel"></div>
<script type="importmap">{ "imports": { "three": "/sphere-assets/vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import * as ORB from '/entangled/orbit.js';
import { matchSwath } from '/coverage/swaths.js';
const { RE, D2R, TAU } = ORB;
THREE.ColorManagement.enabled = false;

const Q = new URLSearchParams(location.search);
const ROLE = location.pathname.includes('display') || Q.has('display') ? 'display' : location.pathname.includes('tablet') || Q.has('tablet') ? 'tablet' : 'studio';
document.body.classList.add(ROLE);
// /coverage: only Earth-observation satellites, each ball as wide as the ground it actually images (published swath)
const EO = location.pathname.includes('coverage') || Q.has('eo');
if (EO) document.title = 'Coverage';
const TEST = location.hash.includes('test');
const $ = (id) => document.getElementById(id);

// ---------- settings ----------
const DEF = { view: 'glass', size: 50, rcs: '1', ior: 50, disp: 0, rim: 25, gain: 100, lift: 100, q360: 100, bounces: 2, light: 'day', range: 'all', types: '1111', revive: 30, spd: 0 };
let S = { ...DEF };
const KEY = EO ? 'coverage-v1' : 'refraction-v1';
if (ROLE === 'studio' && !TEST) try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
for (const k of Object.keys(DEF)) if (Q.has(k)) S[k] = typeof DEF[k] === 'number' ? +Q.get(k) : Q.get(k);
if (ROLE === 'display') S.view = '360';
if (ROLE === 'tablet' && !Q.has('view')) S.view = 'lines';
const save = () => { if (ROLE === 'studio' && !TEST) try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const fmtX = (x) => '×' + (x >= 1e4 ? Math.round(x / 1e3) + 'k' : Math.round(x));
const SIZE_KM = () => EO ? Math.pow(10, (S.size - 50) / 50) : 5 * Math.pow(100, S.size / 100); // ball radius: 5 .. 500 km (50 → 50 km); coverage: ×0.1 .. ×10 of the real swath (50 → ×1)
const IOR = () => 1 + S.ior / 100;                      // 1.0 .. 2.0 (glass ≈ 1.5)
const SPEED = () => Math.round(Math.pow(10, S.spd / 25)); // 1× .. 10,000×
const REVIVE = () => Math.max(3, S.revive);             // seconds until a popped object returns

// ---------- renderer ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: TEST });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 10, 500000);
const view = { yaw: 0.4, pitch: 0.3, dist: 30000 };
const rot360 = new THREE.Quaternion(); // the LED frame's orientation (frame centre = scene direction rot360·(1,0,0))
const rot360M = new THREE.Matrix3(), rot360T = new THREE.Matrix3();
const ball = { yaw: Math.PI / 2, pitch: 0.12, dist: 4.8 };

// ---------- the Earth image (only ever seen through the glass) ----------
const tl = new THREE.TextureLoader();
const tex = (u) => { const t = tl.load(u); t.wrapS = THREE.RepeatWrapping; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 4; return t; };
const tDay = tex('/sphere-assets/bluemarble-4k.jpg'), tNight = tex('/sphere-assets/blackmarble-4k.jpg'); // NASA Blue Marble / Black Marble, 4096 × 2048

// ---------- shared GLSL ----------
// Every frame the CPU moves each object on its real orbit (Kepler + J2 from its latest TLE, the same model as /entangled)
// and writes position + ball radius into a texture. It also bins the balls into a spatial hash grid, so a ray that leaves
// one ball can find the next ball on its way by visiting only the grid cells along its path (a few balls per cell).
const NOBJ_W = 1024, NITEM_W = 4096, HB = 65536, HB_W = 256; // texture widths, hash buckets
const U = {
  tObj: { value: null }, tItem: { value: null }, tBucket: { value: null }, uCell: { value: 250 }, uShell: { value: 9000 }, uBounces: { value: 3 },
  tDepth: { value: null }, tDay: { value: tDay }, tNight: { value: tNight }, uSun: { value: new THREE.Vector3(1, 0, 0) }, uLight: { value: 1 },
  uIor: { value: 1.5 }, uDisp: { value: 0 }, uRim: { value: 0.25 }, uGain: { value: 1 }, uLift: { value: 1 }, uPxK: { value: 0.001 },
  uViewProj: { value: new THREE.Matrix4() }, uRotM: { value: rot360M }, uRotT: { value: rot360T }, uRes: { value: new THREE.Vector2(1920, 1080) },
};
const OBJ = /* glsl */`
  uniform highp sampler2D tObj;
  vec4 obj(int j) { return texelFetch(tObj, ivec2(j & ${NOBJ_W - 1}, j >> ${Math.log2(NOBJ_W)}), 0); } // xyz km (scene), w = radius (<0 popped, 0 hidden)`;

const OPTICS = /* glsl */`${OBJ}
  uniform highp sampler2D tItem, tBucket; uniform float uCell, uShell; uniform int uBounces;
  uniform sampler2D tDay, tNight; uniform highp sampler2D tDepth; uniform vec3 uSun; uniform float uLight, uIor, uDisp, uRim, uGain, uLift;
  const float RE = 6378.137;
  vec3 surface(vec3 n, float lod) {
    vec3 e = vec3(n.x, -n.z, n.y);
    vec2 uv = vec2(atan(e.y, e.x) / 6.2831853 + 0.5, asin(clamp(e.z, -1.0, 1.0)) / 3.1415927 + 0.5);
    vec3 day = textureLod(tDay, uv, lod).rgb;
    if (uLight < 0.5) return day;
    vec3 night = textureLod(tNight, uv, lod).rgb;
    return mix(night * 0.7, day, smoothstep(-0.08, 0.12, dot(n, uSun)));
  }
  float earthT(vec3 ro, vec3 rd) {
    float b = dot(ro, rd), c = dot(ro, ro) - RE * RE, h = b * b - c;
    if (h < 0.0) return 1e9;
    float t = -b - sqrt(h);
    return t > 0.0 ? t : 1e9;
  }
  int cellHash(ivec3 c) {
    uvec3 u = uvec3(c + 4096);
    return int(((u.x * 73856093u) ^ (u.y * 19349663u) ^ (u.z * 83492791u)) & ${HB - 1}u);
  }
  // nearest ball along the ray within tMax (skipping the ball the ray just left): walk the grid cells the ray crosses
  int traceBall(vec3 ro, vec3 rd, float tMax, int skip, out float tHit) {
    tHit = tMax; int hit = -1;
    vec3 p = ro / uCell; ivec3 c = ivec3(floor(p));
    vec3 sg = vec3(rd.x >= 0.0 ? 1.0 : -1.0, rd.y >= 0.0 ? 1.0 : -1.0, rd.z >= 0.0 ? 1.0 : -1.0);
    vec3 ard = max(abs(rd), vec3(1e-9));
    vec3 tDelta = uCell / ard;
    vec3 tNext = (vec3(c) + max(sg, 0.0) - p) * sg * uCell / ard;
    ivec3 st = ivec3(sg);
    for (int s = 0; s < 64; s++) {
      int h = cellHash(c);
      vec2 b = texelFetch(tBucket, ivec2(h & ${HB_W - 1}, h >> ${Math.log2(HB_W)}), 0).xy;
      int i0 = int(b.x), n = min(int(b.y), 48);
      for (int k = 0; k < 48; k++) {
        if (k >= n) break;
        int ii = i0 + k;
        int j = int(texelFetch(tItem, ivec2(ii & ${NITEM_W - 1}, ii >> ${Math.log2(NITEM_W)}), 0).r);
        if (j == skip) continue;
        vec4 o = obj(j);
        vec3 oc = ro - o.xyz; float bb = dot(oc, rd), hh = bb * bb - dot(oc, oc) + o.w * o.w;
        if (hh < 0.0) continue;
        float t = -bb - sqrt(hh);
        if (t > 0.01 && t < tHit) { tHit = t; hit = j; }
      }
      float tExit = min(tNext.x, min(tNext.y, tNext.z));
      if (hit >= 0 && tHit <= tExit) return hit;
      if (tExit > tMax) break;
      vec3 q = ro + rd * tExit;
      if (dot(q, rd) > 0.0 && dot(q, q) > uShell * uShell) break; // heading out past every ball
      if (tNext.x <= tNext.y && tNext.x <= tNext.z) { c.x += st.x; tNext.x += tDelta.x; }
      else if (tNext.y <= tNext.z) { c.y += st.y; tNext.y += tDelta.y; }
      else { c.z += st.z; tNext.z += tDelta.z; }
    }
    return hit;
  }
  // light path through the balls: refract into a ball, cross it, refract out, and if another ball lies ahead, into that
  // one too (up to uBounces more), until the ray reaches the Earth (its image) or leaves into black space
  vec3 through(vec3 P, vec3 N, vec3 rd, int id, vec3 C, float R, float ior, float lod) {
    float thr = 1.0;
    for (int b = 0; b < 8; b++) {
      vec3 t1 = refract(rd, N, 1.0 / ior);
      float chord = -2.0 * dot(P - C, t1), tIn = earthT(P, t1);
      if (tIn < chord) return thr * surface(normalize(P + t1 * tIn), lod); // the ball reaches into the Earth: the ray meets the ground inside it
      vec3 P2 = P + t1 * chord;
      vec3 N2 = normalize(P2 - C);
      vec3 t2 = refract(t1, -N2, ior);
      if (dot(t2, t2) < 0.5) t2 = reflect(t1, -N2);
      P = P2 + t2 * 0.01; rd = t2;
      float tE = earthT(P, rd);
      if (b < uBounces) {
        float tH; int h = traceBall(P, rd, min(tE, 2.0e5), id, tH);
        if (h >= 0) {
          vec4 o = obj(h); P += rd * tH; C = o.xyz; R = o.w; N = normalize(P - C); id = h;
          float ci = clamp(-dot(rd, N), 0.0, 1.0); thr *= 1.0 - (0.04 + 0.96 * pow(1.0 - ci, 5.0));
          continue;
        }
      }
      return tE < 1e8 ? thr * surface(normalize(P + rd * tE), lod) : vec3(0.0);
    }
    return vec3(0.0);
  }
  vec3 glass(vec3 P, vec3 N, vec3 rd, int id, vec3 C, float R, float lod) {
    float ci = clamp(-dot(rd, N), 0.0, 1.0);
    float F = 0.04 + 0.96 * pow(1.0 - ci, 5.0);
    vec3 refr;
    if (uDisp > 0.0) refr = vec3(through(P, N, rd, id, C, R, uIor - uDisp, lod).r, through(P, N, rd, id, C, R, uIor, lod).g, through(P, N, rd, id, C, R, uIor + uDisp, lod).b);
    else refr = through(P, N, rd, id, C, R, uIor, lod);
    vec3 rr = reflect(rd, N), Pr = P + N * 0.01;
    float tE = earthT(Pr, rr);
    vec3 refl = tE < 1e8 ? surface(normalize(Pr + rr * tE), lod) : vec3(0.0);
    return pow(clamp(uGain * ((1.0 - F) * refr + F * refl), 0.0, 1.0), vec3(1.0 / uLift)) + uRim * pow(1.0 - ci, 3.0);
  }`;

// --- glass balls seen by a perspective camera: one camera-facing quad per object, the ball itself is ray-traced ---
const glassVert = /* glsl */`${OBJ}
  uniform float uPxK;
  varying vec3 vC, vW; varying float vR, vLod; flat varying int vId;
  void main() {
    vec4 o = obj(gl_InstanceID); vec3 C = o.xyz; float r = o.w;
    vec3 toC = C - cameraPosition; float d = length(toC);
    if (r <= 0.0 || d < r * 1.02) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    vec3 f = toC / d, s = normalize(cross(f, abs(f.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0))), u = cross(s, f);
    float k = r * d / sqrt(d * d - r * r) + 2.0 * uPxK * d; // exact silhouette cone at the ball's centre, plus a pixel for the soft edge
    vW = C + (s * position.x + u * position.y) * k;
    vC = C; vR = r; vId = gl_InstanceID;
    float rpx = r / (uPxK * d);
    vLod = max(0.0, log2(1.5 * (length(C) - 6378.0) / 9.8 / max(rpx * 2.0, 1.0)) - 0.75); // ground the ball shows (≈1.5 × its height, 9.8 km per texel) over its size on screen
    gl_Position = projectionMatrix * viewMatrix * vec4(vW, 1.0);
  }`;
const glassFrag = /* glsl */`${OPTICS}
  uniform float uPxK; uniform mat4 uViewProj;
  varying vec3 vC, vW; varying float vR, vLod; flat varying int vId;
  void main() {
    vec3 ro = cameraPosition, rd = normalize(vW - cameraPosition), oc = ro - vC;
    float b = dot(oc, rd), dm = length(cross(oc, rd)), px = uPxK * max(-b, 1.0);
    float cov = clamp((vR - dm) / px + 0.5, 0.0, 1.0);
    if (cov <= 0.0) discard;
    float t = -b - sqrt(max(vR * vR - dm * dm, 0.0));
    vec3 P = ro + rd * t;
    vec4 cp = uViewProj * vec4(P, 1.0);
    float depth = cp.z / cp.w * 0.5 + 0.5;
  #ifdef PREPASS
    if (cov < 0.5) discard;
    gl_FragDepth = depth; gl_FragColor = vec4(0.0); return;
  #else
    if (depth > texelFetch(tDepth, ivec2(gl_FragCoord.xy), 0).r + 1e-6) discard; // hidden behind a nearer ball: skip the tracing
    vec3 N = normalize(P - vC);
    gl_FragColor = vec4(glass(P, N, rd, vId, vC, vR, vLod), cov);
  #endif
  }`;

// --- the minimal tablet: each object a small circle, a popped one an x ---
const linesVert = /* glsl */`${OBJ}
  uniform float uPxK;
  varying vec2 vQ; varying float vRpx, vPop;
  void main() {
    vec4 o = obj(gl_InstanceID); vec3 C = o.xyz;
    vec3 toC = C - cameraPosition; float d = length(toC);
    if (o.w == 0.0 || d < 1.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    vPop = o.w < 0.0 ? 1.0 : 0.0;
    float rpx = clamp(abs(o.w) / (uPxK * d), 2.5, 40.0);
    vRpx = rpx;
    float half_ = max(rpx, 5.0) + 2.0;
    vQ = position.xy * half_;
    vec3 f = toC / d, s = normalize(cross(f, abs(f.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0))), u = cross(s, f);
    gl_Position = projectionMatrix * viewMatrix * vec4(C + (s * position.x + u * position.y) * half_ * uPxK * d, 1.0);
  }`;
const linesFrag = /* glsl */`
  varying vec2 vQ; varying float vRpx, vPop;
  void main() {
    float a;
    if (vPop > 0.5) {
      float R = max(vRpx * 1.1, 5.0), q = length(vQ);
      float x = min(abs(vQ.x - vQ.y), abs(vQ.x + vQ.y)) * 0.7071;
      a = clamp(1.1 - x, 0.0, 1.0) * clamp(R - q + 0.5, 0.0, 1.0);
    } else {
      a = clamp(0.9 - abs(length(vQ) - vRpx), 0.0, 1.0);
    }
    if (a <= 0.01) discard;
    gl_FragColor = vec4(vec3(1.0), a);
  }`;

// --- the LED sphere's 360 frame: each ball drawn straight into the equirect image, seen from directly above ---
// Every pixel of the frame is a point on the sphere; the viewer standing outside looks straight down through it.
// So each pixel casts a ray inward (towards Earth's centre); if it meets a ball, the ball bends it on through the others.
const eqVert = /* glsl */`${OBJ}
  uniform mat3 uRotT; uniform vec2 uRes; uniform float uShift;
  varying vec3 vC; varying float vR, vLod; flat varying int vId;
  void main() {
    vec4 o = obj(gl_InstanceID); vec3 C = o.xyz; float r = o.w, L = length(C);
    if (r <= 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    vec3 d0 = uRotT * (C / L);
    float lo = atan(-d0.z, d0.x), la = asin(clamp(d0.y, -1.0, 1.0));
    float a = asin(min(1.0, r / L)) + 3.0 * 3.1415927 / uRes.y;
    float hw = abs(la) + a >= 1.5707 ? 3.1415927 : asin(min(1.0, sin(a) / cos(la)));
    vec2 p = vec2(lo + position.x * hw, la + position.y * a);
    vC = C; vR = r; vId = gl_InstanceID;
    vLod = max(0.0, log2(1.5 * (L - 6378.0) / 9.8 / max(2.0 * r / L * uRes.y / 3.1415927, 1.0)) - 0.75);
    gl_Position = vec4(p.x / 3.1415927 + uShift * 2.0, p.y / 1.5707963, 0.0, 1.0);
  }`;
const eqFrag = /* glsl */`${OPTICS}
  uniform mat3 uRotM; uniform vec2 uRes;
  varying vec3 vC; varying float vR, vLod; flat varying int vId;
  void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    float lo = (uv.x - 0.5) * 6.2831853, la = (uv.y - 0.5) * 3.1415927;
    vec3 d = uRotM * vec3(cos(la) * cos(lo), sin(la), -cos(la) * sin(lo));
    vec3 ro = d * (length(vC) + 2.0 * vR), rd = -d, oc = ro - vC;
    float b = dot(oc, rd), dm = length(cross(oc, rd)), px = 3.1415927 / uRes.y * length(vC);
    float cov = clamp((vR - dm) / px + 0.5, 0.0, 1.0);
    if (cov <= 0.0) discard;
    float t = -b - sqrt(max(vR * vR - dm * dm, 0.0));
    vec3 P = ro + rd * t;
    float depth = 1.0 - length(P) / 2.0e5; // the highest surface (nearest the viewer outside) wins
  #ifdef PREPASS
    if (cov < 0.5) discard;
    gl_FragDepth = depth; gl_FragColor = vec4(0.0); return;
  #else
    if (depth > texelFetch(tDepth, ivec2(gl_FragCoord.xy), 0).r + 1e-6) discard;
    vec3 N = normalize(P - vC);
    gl_FragColor = vec4(glass(P, N, rd, vId, vC, vR, vLod), cov);
  #endif
  }`;

// Two passes: a cheap pass finds the nearest ball surface per pixel (depth only); the full pass then traces light only
// for that front surface and drops every hidden fragment at once (otherwise overlapping balls all get traced).
const mk = (v, f, extra = {}, pre = false) => new THREE.ShaderMaterial({ uniforms: { ...U, ...extra }, vertexShader: v, fragmentShader: f, defines: pre ? { PREPASS: 1 } : {},
  transparent: !pre, depthTest: pre, depthWrite: pre, colorWrite: !pre });
const glassMat = mk(glassVert, glassFrag), glassPre = mk(glassVert, glassFrag, {}, true);
const linesMat = mk(linesVert, linesFrag); linesMat.depthTest = true;
const eqMats = [-1, 0, 1].map((k) => mk(eqVert, eqFrag, { uShift: { value: k } }));
const eqPres = [-1, 0, 1].map((k) => mk(eqVert, eqFrag, { uShift: { value: k } }, true));
const preRT = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: true, depthTexture: new THREE.DepthTexture(1, 1, THREE.FloatType) });
const eqPreRT = new THREE.WebGLRenderTarget(1920, 1080, { depthBuffer: true, depthTexture: new THREE.DepthTexture(1920, 1080, THREE.FloatType) });
const preScene = new THREE.Scene(), eqPreScene = new THREE.Scene();

// Earth: always black. In the lines view it gets a single outline.
const earthBlack = new THREE.Mesh(new THREE.SphereGeometry(RE, 96, 48), new THREE.MeshBasicMaterial({ color: 0x000000 }));
const earthLine = new THREE.Mesh(new THREE.SphereGeometry(RE, 128, 64), new THREE.ShaderMaterial({
  vertexShader: `varying vec3 vN, vV; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vN = normalize(position); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `varying vec3 vN, vV; void main(){ float f = dot(normalize(vN), normalize(vV)), w = fwidth(f); float a = 1.0 - smoothstep(0.0, 1.6 * w, f); gl_FragColor = vec4(vec3(a), 1.0); }`,

    if (pinch0) zoom(pinch0 / Math.max(d, 1));
    pinch0 = d; return;
  }
  turn(dx, dy);
});
const up = (e) => {
  ptrs.delete(e.pointerId); pinch0 = null;
  if (ptrs.size === 0 && gesture) { if (!gesture.multi && gesture.moved < 10 && performance.now() - gesture.t0 < 500) tap(e.clientX, e.clientY); gesture = null; }
};
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', (e) => { zoom(Math.exp(e.deltaY * 0.0012)); e.preventDefault(); }, { passive: false });
function turn(dx, dy) {
  if (S.view === 'ball') { ball.yaw -= dx * 0.006; ball.pitch = Math.max(-1.45, Math.min(1.45, ball.pitch + dy * 0.006)); return; }
  if (S.view === '360') {
    const k = Math.PI / innerHeight;
    rot360.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -dx * k * 2)).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), dy * k)).normalize();
    sendLook(true); return;
  }
  const k = 0.005 * Math.min(1, (view.dist - RE) / 20000 + 0.15);
  view.yaw -= dx * k; view.pitch = Math.max(-1.5, Math.min(1.5, view.pitch + dy * k));
}
function zoom(f) {
  if (S.view === 'ball') { ball.dist = Math.max(1.4, Math.min(12, ball.dist * f)); return; }
  if (S.view === '360') return;
  view.dist = Math.max(RE + 900, Math.min(260000, RE + (view.dist - RE) * f));
}

// ---------- room: pops and the sphere's turn are shared with the LED display (public relay, room code) ----------
const ROOM = ORB.cleanRoom(Q.get('room'));
const TOPIC = 'sampling-sphere/v1/' + (EO ? 'coverage' : 'refraction') + (ROOM ? '/' + ROOM : ''), ME = Math.random().toString(36).slice(2, 10);
let mq = null, relayOk = false, lookT = 0;
const publish = (t, obj, retain = false) => { if (mq && relayOk) mq.publish(TOPIC + t, JSON.stringify(obj), { retain, qos: retain ? 1 : 0 }); };
let snapT = null;
function sendPop(n, t) {
  publish('/pop', { n, t, ev: Date.now(), by: ME });
  clearTimeout(snapT); snapT = setTimeout(sendSnapshot, 400);
}
function sendSnapshot() { const now = wallS(), list = []; for (const [n, p] of popped) if (p.t > 0 && now - p.t < REVIVE() + 2) list.push([n, p.t, p.ev]); publish('/pops', { list, by: ME }, true); }
function sendLook(force) {
  if (ROLE === 'display') return;
  const n = performance.now(); if (!force && n - lookT < 50) return; lookT = n;
  publish('/look', { q: rot360.toArray(), by: ME }, true);
}
function sendClock() { clock = { wall0: Date.now(), sim0: simT, speed: SPEED(), by: ME }; publish('/clock', clock, true); }
if (!Q.has('solo') && !TEST) import('/sphere-assets/vendor/mqtt.esm.js').then((m) => {
  const mqtt = m.default || m;
  mq = mqtt.connect(Q.get('broker') || 'wss://broker.emqx.io:8084/mqtt', { connectTimeout: 30000, keepalive: 30 });
  mq.on('close', () => { relayOk = false; }); mq.on('offline', () => { relayOk = false; });
  mq.on('connect', () => { relayOk = true; mq.subscribe([TOPIC + '/pop', TOPIC + '/pops', TOPIC + '/look', TOPIC + '/clock']); });
  mq.on('message', (t, msg) => {
    let d; try { d = JSON.parse(msg.toString()); } catch { return; }
    if (!d || d.by === ME) return;
    const k = t.slice(TOPIC.length);
    if (k === '/pop' && Number.isFinite(d.n) && Number.isFinite(d.t)) setPop(d.n, d.t, d.ev || Date.now());
    else if (k === '/pops' && Array.isArray(d.list)) { for (const e of d.list) { if (Array.isArray(e) && e.every(Number.isFinite)) setPop(e[0], e[1], e[2]); } } // braces: a dangling else here once swallowed every /look and /clock
    else if (k === '/look' && Array.isArray(d.q) && d.q.length === 4 && d.q.every(Number.isFinite) && !ptrs.size) rot360.fromArray(d.q).normalize();
    else if (k === '/clock' && [d.wall0, d.sim0, d.speed].every(Number.isFinite)) { clock = d; S.spd = Math.log10(Math.max(1, d.speed)) * 25; panelSync(); }
  });
}).catch(() => {});

// glass / lines: the tablet's view sets the LED frame (the point facing the viewer becomes the frame centre)
function lookFromCamera() {
  const v = camera.position.clone().normalize(), up = camera.up.clone().applyQuaternion(camera.quaternion).normalize(), z = new THREE.Vector3().crossVectors(v, up);
  const m = new THREE.Matrix4().makeBasis(v, up, z);
  const q = new THREE.Quaternion().setFromRotationMatrix(m);
  // publish only when THIS page's view moved (a page left open elsewhere must not keep overriding the tablet)
  if (!camQ) { camQ = q.clone(); return; } // opening a page doesn't move the sphere
  if (q.angleTo(camQ) > 1e-4) { camQ = (camQ || new THREE.Quaternion()).copy(q); rot360.copy(q); lookDirty = true; }
  if (lookDirty && performance.now() - lookT >= 50) { lookDirty = false; sendLook(true); } // throttled, and the final position always goes out
}
let camQ = null, lookDirty = false;

// ---------- panel (studio) ----------
const TYPES = ['Payloads', 'Rocket bodies', 'Debris', 'Unknown'];
const SL = [['size', 'Size', 0, 100, () => EO ? '×' + (SIZE_KM() < 1 ? SIZE_KM().toFixed(2) : SIZE_KM().toFixed(1)) + ' real swath' : fmtX(SIZE_KM() / 0.00079)], ['ior', 'Refraction', 0, 100, () => IOR().toFixed(2)], ['disp', 'Dispersion', 0, 100, () => S.disp + ''],
  ['rim', 'Edge', 0, 100, () => S.rim + ''], ['gain', 'Brightness', 50, 400, () => (S.gain / 100).toFixed(1) + '×'], ['lift', 'Lift darks', 100, 300, () => (S.lift / 100).toFixed(1)], ['bounces', 'Through', 0, 6, () => S.bounces ? '+' + S.bounces + ' balls' : '1 ball'], ['revive', 'Revive', 3, 300, () => REVIVE() + ' s'], ['spd', 'Speed', 0, 100, () => SPEED().toLocaleString() + '×'], ['q360', '360 detail', 50, 200, () => Math.round(1920 * S.q360 / 100) + ' px']];
const SEG = [['view', 'View', [['glass', 'Glass'], ['lines', 'Lines'], ['360', '360'], ['ball', 'Sphere']]], 
  ['light', 'Light', [['sun', 'Sun now'], ['day', 'All day']]], ['rcs', 'Size by', [['1', 'Radar size'], ['0', 'Same']]], ['range', 'Objects', [['all', 'All'], ['leo', 'Below 2,000 km']]]].filter(([k]) => !(EO && k === 'rcs'));
function panelBuild() {
  $('panel').innerHTML = SEG.map(([k, l, o]) => `<div class="row"><label>${l}</label><div class="seg" data-k="${k}">${o.map(([v, t]) => `<button data-v="${v}">${t}</button>`).join('')}</div></div>`).join('')
    + SL.map(([k, l, a, b]) => `<div class="row"><label>${l}</label><input type="range" data-k="${k}" min="${a}" max="${b}" step="1"><output data-o="${k}"></output></div>`).join('')
    + (EO ? '' : `<div class="row"><label>Show</label><div class="checks">${TYPES.map((t, i) => `<label><input type="checkbox" data-ty="${i}"> ${t} <span data-cnt="${i}"></span></label>`).join('')}</div></div>`)
    + `<div class="row"><label></label><div class="seg"><button id="now">Back to now</button><button id="reset">Reset</button></div></div>
    <div class="row"><label></label><div class="seg"><button id="copy">Copy display URL</button></div></div>
    <div class="note">Earth is black. Its surface appears only inside the glass: each ball bends the line of sight onto the Earth below it (Blue Marble by day, Black Marble at night). Pop a ball and only black remains. Objects: every tracked payload, rocket body and debris in CelesTrak (US Space Force catalogue), at their real positions now. Ball size is ×N of each object's real size from its radar cross-section (kept between 0.3× and 2.5× of a typical object so debris stays visible).</div>`;
  if (EO) $('panel').querySelector('.note').innerHTML = `Only Earth-observation and weather satellites (CelesTrak groups weather, Earth resources, Planet), at their real positions now. Each ball is as wide as the strip of ground its widest imager records at once: ball diameter = published nadir swath width (×1 = real). Geostationary full-disk imagers see the whole visible disc, so their width is the horizon-to-horizon distance from their altitude. Earth is black; its surface appears only through the balls.<div id="eolist"></div>`;
  $('panel').querySelectorAll('.seg[data-k] button').forEach((b) => b.onclick = () => { const k = b.parentNode.dataset.k; S[k] = b.dataset.v; if (k === 'rcs') reweight(); save(); panelSync(); resize(); });
  $('panel').querySelectorAll('input[data-k]').forEach((r) => r.oninput = () => { const k = r.dataset.k, was = SPEED(); S[k] = +r.value; if (k === 'spd' && SPEED() !== was) { simT = simNow(); clock = null; sendClock(); } save(); panelSync(); });
  $('panel').querySelectorAll('input[data-ty]').forEach((c) => c.onchange = () => { const a = S.types.split(''); a[+c.dataset.ty] = c.checked ? '1' : '0'; S.types = a.join(''); save(); });
  $('now').onclick = () => { simT = Date.now(); S.spd = 0; clock = null; sendClock(); save(); panelSync(); };
  $('copy').onclick = () => {
    const q = new URLSearchParams(); for (const k of Object.keys(DEF)) if (k !== 'view' && String(S[k]) !== String(DEF[k])) q.set(k, S[k]);
    if (ROOM) q.set('room', ROOM);
    const url = location.origin + (EO ? '/coverage-display' : '/refraction-display') + (q.toString() ? '?' + q : '');
    navigator.clipboard?.writeText(url).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => { $('copy').textContent = 'Copy display URL'; }, 1500); }, () => { $('copy').textContent = url; });
  };
  $('reset').onclick = () => { S = { ...DEF }; reweight(); save(); panelSync(); resize(); };
}
function panelSync() {
  document.querySelectorAll('.seg[data-k]').forEach((s) => s.querySelectorAll('button').forEach((b) => b.classList.toggle('on', String(S[s.dataset.k]) === b.dataset.v)));
  document.querySelectorAll('input[data-ty]').forEach((c) => { c.checked = S.types[+c.dataset.ty] !== '0'; });
  document.querySelectorAll('span[data-cnt]').forEach((e) => { e.textContent = counts[+e.dataset.cnt] ? counts[+e.dataset.cnt].toLocaleString() : ''; });
  if (EO && $('eolist') && loaded) {
    const by = new Map(); for (const o of objs) { const k = o.inst + '|' + Math.round(o.swath) + '|' + o.src; by.set(k, (by.get(k) || 0) + 1); }
    const rows = [...by].map(([k, n]) => k.split('|').concat(n)).sort((a, b) => b[1] - a[1]);
    $('eolist').innerHTML = `<br>${objs.length} satellites with a published swath:<br>` + rows.map(([i, km, src, n]) => `${n} × ${i}: ${(+km).toLocaleString()} km <span style="opacity:.5">(${src})</span>`).join('<br>')
      + `<br><br>${noSwath.length} more in those groups have no swath in the table and are not drawn:<br><span style="opacity:.5">${noSwath.join(', ')}</span>`;
  }
  for (const [k, , , , f] of SL) { const r = document.querySelector(`input[data-k="${k}"]`); if (r) r.value = S[k]; const o = document.querySelector(`output[data-o="${k}"]`); if (o) o.textContent = f(); }
}
$('toggle').onclick = () => { $('panel').classList.toggle('on'); $('toggle').classList.toggle('on'); };
panelBuild(); panelSync();

// ---------- sizing ----------
// adaptive resolution: drop the render scale when frames run slow, raise it again when there is room
const dbs = new THREE.Vector2();
const PR_MAX = ROLE === 'display' ? 1 : Math.min(devicePixelRatio || 1, 2);
let pr = Math.min(PR_MAX, 1), eqScale = 1, slowT = 0, fastT = 0, loadedAt = 0;
function adapt(dtMs) {
  if (dtMs > 250) return; // a hiccup (tab switch, load), not the render
  if (TEST || Q.has('fixed') || !loaded || performance.now() - loadedAt < 2500) { slowT = fastT = 0; return; }
  if (dtMs > 22) { slowT += dtMs; fastT = 0; } else if (dtMs < 17.5) { fastT += dtMs; slowT = 0; } else { slowT = fastT = 0; }
  const v = S.view, eqMode = v === '360' || v === 'ball';
  if (slowT > 500) { slowT = 0; if (eqMode) { /* 360: resolution stays as set */ } else if (pr > 0.5) { pr = Math.max(0.5, pr - 0.15); resize(); } }
  if (fastT > 3000) { fastT = 0; if (eqMode) eqScale = Math.min(ROLE === 'display' ? 1 : 1, eqScale + 0.125); else if (pr < PR_MAX) { pr = Math.min(PR_MAX, pr + 0.1); resize(); } }
}
function resize() {
  const dpr = ROLE === 'display' ? 1 : pr;
  renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  ballCam.aspect = innerWidth / innerHeight; ballCam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- frame ----------
let last = performance.now(), fps = 60, lastSnap = 0, cpuMs = 0;
const simNow = () => clock ? clock.sim0 + (Date.now() - clock.wall0) * clock.speed : simT;
function frame(now) {
  if (!TEST) requestAnimationFrame(frame);
  const dtMs = now - last, dt = Math.min(0.1, dtMs / 1000); last = now; adapt(dtMs); fps = fps * 0.95 + 0.05 / Math.max(dt, 1e-3);
  simT = clock ? simNow() : simT + dt * 1000 * SPEED();
  render();
}
function render() {
  if (loaded && Math.abs(simT - T0) > 432e5) { T0 = simT; build(); }
  const rot = -ORB.gmst(simT);
  if (loaded) { const c0 = performance.now(); update(); cpuMs = cpuMs * 0.9 + (performance.now() - c0) * 0.1; }
  U.uIor.value = IOR(); U.uDisp.value = S.disp / 1000; U.uRim.value = S.rim / 100; U.uGain.value = S.gain / 100; U.uLift.value = S.lift / 100; U.uBounces.value = S.bounces;
  U.uLight.value = S.light === 'sun' ? 1 : 0;
  const se = sunEci(simT), cr = Math.cos(rot), sr = Math.sin(rot);
  U.uSun.value.set(cr * se[0] - sr * se[1], se[2], -(sr * se[0] + cr * se[1]));

  const v = S.view;
  if (v === 'glass' || v === 'lines') {
    camera.position.set(Math.cos(view.pitch) * Math.sin(view.yaw), Math.sin(view.pitch), Math.cos(view.pitch) * Math.cos(view.yaw)).multiplyScalar(view.dist);
    camera.lookAt(0, 0, 0);
    camera.near = Math.max(5, (view.dist - RE - 2500) * 0.3); camera.far = view.dist + 60000; camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    U.uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    U.uPxK.value = 2 * Math.tan(camera.fov / 2 * D2R) / (innerHeight * renderer.getPixelRatio());
    earthLine.visible = v === 'lines'; earthBlack.visible = v === 'lines';
    if (meshes.glass) { meshes.glass.visible = v === 'glass'; meshes.lines.visible = v === 'lines'; }
    lookFromCamera();
    if (v === 'glass') {
      renderer.getDrawingBufferSize(dbs);
      if (preRT.width !== dbs.x || preRT.height !== dbs.y) preRT.setSize(dbs.x, dbs.y);
      renderer.setRenderTarget(preRT); renderer.clear(); renderer.render(preScene, camera);
      U.tDepth.value = preRT.depthTexture;
    }
    renderer.setRenderTarget(null); renderer.render(scene, camera);
  } else {
    rot360M.setFromMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(rot360)); rot360T.copy(rot360M).transpose();
    const qs = S.q360 / 100 * (ROLE === 'display' ? 1 : eqScale), ew = Math.round(1920 * qs), eh = Math.round(1080 * qs);
    if (eqRT.width !== ew) { eqRT.setSize(ew, eh); eqPreRT.setSize(ew, eh); }
    U.uRes.value.set(ew, eh);
    renderer.setRenderTarget(eqPreRT); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(eqPreScene, eqCam);
    U.tDepth.value = eqPreRT.depthTexture;
    renderer.setRenderTarget(eqRT); renderer.clear();
    renderer.render(eqScene, eqCam);
    renderer.setRenderTarget(null);
    if (v === '360') renderer.render(blitScene, eqCam);
    else {
      ballCam.position.set(Math.cos(ball.pitch) * Math.sin(ball.yaw), Math.sin(ball.pitch), Math.cos(ball.pitch) * Math.cos(ball.yaw)).multiplyScalar(ball.dist);
      ballCam.lookAt(0, 0, 0); renderer.setClearColor(0x050505, 1); renderer.clear(); renderer.render(ballScene, ballCam); renderer.setClearColor(0x000000, 1);
    }
  }
  if (ROLE === 'display' && performance.now() - lastSnap > 5000) { lastSnap = performance.now(); }
  info();
}
function info() {
  const el = $('info');
  if (!loaded) { el.innerHTML = meta.errors.length ? '<span class="err">Could not load the catalogue. Nothing is shown (no stand-in data).</span>' : 'Loading the catalogue…'; return; }
  const now = wallS(); let np = 0; for (const p of popped.values()) if (p.t > 0 && now - p.t < REVIVE()) np++;
  const d = new Date(simT), live = Math.abs(simT - Date.now()) < 5000;
  el.textContent = ROLE === 'tablet' ? `${objs.length.toLocaleString()}   ${np ? '× ' + np : ''}`
    : `${objs.length.toLocaleString()} ${EO ? 'observation satellites' : 'objects'} · ${np} popped\n${live ? 'now' : d.toISOString().slice(0, 16).replace('T', ' ') + ' UTC'} · ${SPEED().toLocaleString()}× · ${fps.toFixed(0)} fps · cpu ${cpuMs.toFixed(1)} ms · res ${Math.round(100 * (S.view === '360' || S.view === 'ball' ? eqScale : pr))}%${ROOM ? ' · room ' + ROOM : ''}`;
}

if (TEST) window.__ref = { grid: () => ({ cell: U.uCell.value, shell: U.uShell.value, rtt: gridRtt, items: U.tItem.value?.image.width * U.tItem.value?.image.height }), ingest, render, tap, S, view, rot360, setSim: (t) => { simT = t; }, pick, objs: () => objs, setView: (k) => { S.view = k; resize(); } };
window.__refr = { rot360, S, ptrs: () => ptrs.size, relay: () => relayOk };
load();
requestAnimationFrame(frame);
</script>
