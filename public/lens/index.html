<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lens</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --fg: #fff; --dim: #ffffff73; --faint: #ffffff2e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 13px/1.45 Pretendard, -apple-system, sans-serif; font-weight: 400; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #info { position: fixed; left: 20px; bottom: 16px; color: var(--dim); font-variant-numeric: tabular-nums; pointer-events: none; white-space: pre-wrap; max-width: min(560px, calc(100vw - 40px)); }
  #toggle { position: fixed; top: 16px; right: 16px; background: none; border: 1px solid var(--faint); color: var(--dim); font: inherit; padding: 6px 12px; border-radius: 0; cursor: pointer; }
  #toggle.on { color: var(--fg); border-color: var(--fg); }
  #panel { position: fixed; top: 56px; right: 16px; width: 320px; max-height: calc(100vh - 80px); overflow: auto; background: #000000d9; border: 1px solid var(--faint); padding: 14px 16px; display: none; user-select: text; -webkit-user-select: text; }
  #panel.on { display: block; }
  .row { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { color: var(--dim); }
  .row output { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .seg { grid-column: 2 / 4; display: flex; gap: 0; }
  .seg button { flex: 1; background: none; color: var(--dim); border: 1px solid var(--faint); margin-left: -1px; padding: 4px 0; font: inherit; cursor: pointer; }
  .seg button.on { color: #000; background: var(--fg); border-color: var(--fg); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; background: none; height: 18px; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--dim); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #000; border: 1px solid var(--fg); margin-top: -5px; }
  input[type=range]::-moz-range-track { height: 1px; background: var(--dim); }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #000; border: 1px solid var(--fg); }
  .note { color: var(--dim); font-size: 12px; margin-top: 12px; line-height: 1.5; }
  .note b { color: var(--fg); font-weight: 400; }
  .list { color: var(--dim); font-size: 11.5px; line-height: 1.5; margin-top: 10px; }
  .list .k { color: var(--fg); }
  .err { color: #fff; }
  body.display #toggle, body.display #panel, body.display #info { display: none; }
  body.tablet #toggle { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas><canvas id="ov" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
<div id="info"></div>
<button id="toggle">Settings</button>
<div id="panel"></div>
<script type="importmap">{ "imports": { "three": "/sphere-assets/vendor/three.module.min.js" } }</script>
<script type="module">
// Lens: every Earth-observation satellite as a glass dome lying on the Earth at the point right under it, moving along
// its real ground track. Each dome is as wide as the strip of ground the satellite images (published swath). Earth is
// black: its surface shows only through the domes, magnified, like a reading glass laid on a map.
import * as THREE from 'three';
import * as ORB from '/entangled/orbit.js';
import { matchSwath } from '/coverage/swaths.js';
import { RoomEnvironment } from '/sphere-assets/vendor/jsm/environments/RoomEnvironment.js';
const { RE, D2R, TAU } = ORB;
THREE.ColorManagement.enabled = false;

const Q = new URLSearchParams(location.search);
const ROLE = location.pathname.includes('display') || Q.has('display') ? 'display' : location.pathname.includes('tablet') || Q.has('tablet') ? 'tablet' : 'studio';
document.body.classList.add(ROLE);
const TEST = location.hash.includes('test');
const $ = (id) => document.getElementById(id);

// ---------- settings ----------
const CROWN = { ior: 152, iorfar: 152, disp: 4, refl: 100, rim: 0, tint: '#ffffff', abs: 0, frost: 0, fill: 90 }; // the glass sliders' starting point
const DEF = { view: 'glass', shape: 'sphere', place: 'orbit', sizing: 'swath', scale: 'true', one: 717, size: 50, min: 738, fit: 'lift', res: 100, q360: 100, light: 'day', unk: 'est', unkmat: 'same', geo: '1', spd: 25 * Math.log10(120),  ...CROWN, gain: 150, lift: 150, iorfar: 101, disp: 10, refl: 300, rim: 50, revive: 30, glow: 0, glowc: '#ffffff', trail: 'ball', trlen: 100 * Math.log(10) / Math.log(300), trgain: 50, tapdo: 'pop', circ: 6, earthc: '#000000', idle: 30 }; // Intae's look (2026-11-24)
let S = { ...DEF };
const KEY = 'lens-v5';
if (ROLE === 'studio' && !TEST) try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
for (const k of Object.keys(DEF)) if (Q.has(k)) S[k] = typeof DEF[k] === 'number' ? +Q.get(k) : Q.get(k);
if (ROLE === 'display') S.view = '360';
if (ROLE === 'tablet' && !Q.has('view')) S.view = 'lines';
const save = () => { if (ROLE === 'studio' && !TEST) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} sendSettings(); } };
const SCALE = () => Math.pow(10, (S.size - 50) / 50); // ×0.1 .. ×10 of the real swath (50 → ×1)
// the glass: clear crown glass (Schott N-BK7). Refractive index at 550 nm 1.5185; red (620 nm) 1.5157, blue (460 nm) 1.5245
// (Schott datasheet, Sellmeier fit). The bending and reflection follow from these by Snell's law and Fresnel; nothing else is set.
// render pixels per screen point (each one is ray traced): 1 by default, up to the screen's own density
const PR = () => ROLE === 'display' ? 1 : Math.min(S.res / 100, devicePixelRatio || 1, 2);
// Minimum slider: 0 = none, then logarithmic from 1 km to 3,000 km (fine steps near the smallest real swaths)
const MINKM = () => S.min <= 0 ? 0 : Math.pow(3000, S.min / 1000);
const ONEKM = () => Math.pow(3000, S.one / 1000); // One size slider: 1 .. 3,000 km, logarithmic
const minSlider = (km) => Math.max(1, Math.round(1000 * Math.log(Math.max(1, km)) / Math.log(3000)));
const SPEED = () => Math.round(Math.pow(10, S.spd / 25));

// ---------- renderer ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: TEST });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 10, 500000);
const view = { yaw: 0.4, pitch: 0.3, dist: 24000 };
let lookTarget = null;
let lastInput = 0, idling = false, idleSim0 = 0; // idle (see idleTick): the last turn anywhere in the room, wall ms
const rot360 = new THREE.Quaternion(); // LED frame orientation (frame centre = scene direction rot360·(1,0,0))
const rot360M = new THREE.Matrix3(), rot360T = new THREE.Matrix3();
const ball = { yaw: Math.PI / 2, pitch: 0.12, dist: 4.8 };

const tl = new THREE.TextureLoader();
const tex = (u) => { const t = tl.load(u); t.wrapS = THREE.RepeatWrapping; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 8; return t; };
const tDay = tex('/sphere-assets/bluemarble-4k.jpg'), tNight = tex('/sphere-assets/blackmarble-4k.jpg'); // NASA Blue Marble / Black Marble

// ---------- optics (shared GLSL) ----------
// A dome = the part of a glass sphere (centre on the ground, radius = half the swath) that stands above the ground.
// A ray refracts into the glass, runs down to the ground under it (the Earth image) or out through the far side.
const U = { tDay: { value: tDay }, tNight: { value: tNight }, uSun: { value: new THREE.Vector3(1, 0, 0) }, uLight: { value: 0 }, uIor: { value: 1.5 }, uIorFar: { value: 1.5 }, uFill: { value: 0.9 }, uDisp: { value: 0 },
  uPxK: { value: 0.001 }, uTop: { value: 8000 }, uRotM: { value: rot360M }, uRotT: { value: rot360T }, uRes: { value: new THREE.Vector2(1920, 1080) }, uShift: { value: 0 },
  tDome: { value: null }, tCell: { value: null }, tItem: { value: null }, tEnv: { value: null }, uEnv: { value: 0.5 }, uLsize: { value: 1 }, uLshape: { value: 0 }, uGain: { value: 1 }, uLift: { value: 1 }, uUnkMat: { value: 0 }, uTint: { value: new THREE.Color(1, 1, 1) }, uGlow: { value: 0 }, uGlowC: { value: new THREE.Color(1, 1, 1) }, uAbs: { value: 0 }, uFrost: { value: 0 }, uRefl: { value: 1 }, uRim: { value: 0 }, uBg: { value: new THREE.Color(0, 0, 0) }, uBgOn: { value: 1 } };
{ // bake the soft-box room once into a cube map (HDR, so the boxes' reflections stay bright)
  const rt = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
  new THREE.CubeCamera(0.1, 100, rt).update(renderer, new RoomEnvironment());
  U.tEnv.value = rt.texture;
}
// Light through the glass, traced per pixel (three.js's own transmission only bends what is already on screen, and
// here the Earth is never drawn). Every satellite is one piece of glass: a full sphere, or a dome (half a sphere, its
// flat face towards the Earth). All pieces are one material, so where they overlap they fuse into a single body with
// no surface inside. A ray refracts in, crosses the glass (absorbed and tinted along the way), and either reaches the
// ground (the Earth image) or refracts out again and may enter the next piece. Ground no glass-bent light reaches stays black.
// Pieces near a ray are found through a 1° grid on the sky (each piece listed in every cell its outline covers).
const DOME_W = 1024, ITEM_W = 4096, CELL_W = 360, CELL_H = 180, MAXC = 40;
// one piece of glass: where a ray enters and leaves it (shared by the id pass and the tracer)
const PIECE = /* glsl */`
  uniform highp sampler2D tDome; const float RE = 6378.137;
  ivec2 tx(int i) { return ivec2(i & ${DOME_W - 1}, i >> ${Math.log2(DOME_W)}); }
  vec4 pc(int k) { return texelFetch(tDome, tx(2 * k), 0); }      // centre (km), radius
  vec4 pn(int k) { return texelFetch(tDome, tx(2 * k + 1), 0); }  // outward axis, 1 = dome (half), 0 = sphere
  // the span [t0, t1] of the ray inside piece k, with the outward normals where it enters and leaves
  bool span(vec3 ro, vec3 rd, int k, out float t0, out float t1, out vec3 n0, out vec3 n1) {
    vec4 a = pc(k); if (a.w <= 0.0) return false;
    vec3 oc = ro - a.xyz; float b = dot(oc, rd), dm = length(cross(oc, rd));
    if (dm >= a.w) return false;
    float h = sqrt(a.w * a.w - dm * dm); t0 = -b - h; t1 = -b + h;
    n0 = (oc + rd * t0) / a.w; n1 = (oc + rd * t1) / a.w;
    vec4 c = pn(k);
    if (mod(c.w, 2.0) > 0.5) { // dome: only the side of the flat face away from the Earth
      float s0 = dot(oc, c.xyz), sd = dot(rd, c.xyz);
      if (abs(sd) < 1e-7) { if (s0 < 0.0) return false; }
      else { float tp = -s0 / sd; if (sd > 0.0) { if (tp > t0) { t0 = tp; n0 = -c.xyz; } } else { if (tp < t1) { t1 = tp; n1 = -c.xyz; } } }
    }
    return t1 > t0;
  }
  // edges: a ray that misses the ball by less than a pixel is bent onto its rim, and the ball covers only part of that
  // pixel (cov), so every outline is smooth however small or far the ball is
  bool rimRay(vec3 ro, inout vec3 rd, int k, float px, out float cov) {
    vec4 a = pc(k); vec3 oc = a.xyz - ro; float dm = length(cross(oc, rd));
    cov = clamp((a.w - dm) / px + 1.0, 0.0, 1.0); // the soft pixel lies just outside the ball, so it never darkens a ball behind
    if (a.w <= 0.0 || dm > a.w + px) return false;
    if (dm < a.w * 0.998) return true;
    vec3 q = ro + rd * dot(oc, rd) - a.xyz; rd = normalize(a.xyz + q / max(length(q), 1e-6) * a.w * 0.997 - ro);
    return true;
  }
  // how blurred the Earth seen through a ball must be (else it sparkles): one screen pixel spans px km at the ball, and
  // the ball squeezes a stretch of ground about twice its height wide (at most the Earth's radius) into its own width
  // what lies behind a soft edge pixel: the same ray past ball k (another ball, or nothing); see edgeMix in OPTICS
  float earthLod(float px, vec4 a) { float L = length(a.xyz); return max(0.0, log2(px * clamp(min(2.0 * (L - RE), RE) / a.w, 1.0, 512.0) / 9.8)); }
  vec4 idColor(int k) { int i = k + 1; return vec4(float(i & 255), float((i >> 8) & 255), float((i >> 16) & 255), 255.0) / 255.0; }
  int idOf(vec4 e) { return int(e.r * 255.0 + 0.5) + int(e.g * 255.0 + 0.5) * 256 + int(e.b * 255.0 + 0.5) * 65536 - 1; }`;
const OPTICS = /* glsl */`${PIECE}
  uniform sampler2D tDay, tNight; uniform vec3 uSun; uniform int uUnkMat; uniform float uGlow; uniform vec3 uGlowC; uniform float uLight, uIor, uIorFar, uFill, uDisp, uGain, uLift, uAbs, uFrost, uRefl, uRim; uniform vec3 uTint;
  // studio light: a soft-box room (as in Entangled) that stays fixed to the viewer, so every ball carries the same
  // highlights wherever it is on the display; there is no direction in the world. It is what the glass reflects, and
  // what it shows where light passes through into space.
  uniform samplerCube tEnv; uniform float uEnv, uLsize; uniform int uLshape; mat3 gEnvM = mat3(1.0);
  // soft lights around the viewer (v: +z towards the viewer, +y up); each a smooth falloff, no hard edge
  float lamp(vec3 v, vec3 c, float r) { float a = acos(clamp(dot(v, normalize(c)), -1.0, 1.0)) / r; return exp(-a * a); }
  vec3 env(vec3 d) {
    vec3 v = gEnvM * d; float r = uLsize * (1.0 + uFrost * 0.3);
    if (uLshape == 2) return uEnv * textureLod(tEnv, v, 3.0 + uFrost).rgb;                      // room (soft boxes)
    float L;
    if (uLshape == 1) { float a = (acos(clamp(v.z, -1.0, 1.0)) - 0.6) / (0.12 * r); L = 0.6 * exp(-a * a); } // ring light around the viewer
    else L = lamp(v, vec3(-0.55, 0.6, 1.0), 0.32 * r) + 0.6 * lamp(v, vec3(0.7, 0.15, 1.0), 0.42 * r) + 0.35 * lamp(v, vec3(0.0, -0.7, 0.7), 0.6 * r); // key, fill, low bounce
    return uEnv * (40.0 * L + 0.04 * (0.5 + 0.5 * v.y)) * vec3(1.0, 0.99, 0.97);
  }
  uniform highp sampler2D tCell, tItem;
  vec3 surface(vec3 n, float lod) {
    vec3 e = vec3(n.x, -n.z, n.y);
    vec2 uv = vec2(atan(e.y, e.x) / 6.2831853 + 0.5, asin(clamp(e.z, -1.0, 1.0)) / 3.1415927 + 0.5);
    lod += uFrost;
    vec3 c = textureLod(tDay, uv, lod).rgb;
    if (uLight > 0.5) c = mix(textureLod(tNight, uv, lod).rgb * 0.7, c, smoothstep(-0.08, 0.12, dot(n, uSun)));
    return pow(clamp(uGain * c, 0.0, 1.0), vec3(1.0 / uLift)); // map brightness and lifted darks (the image only, not the glass)
  }
  float earthT(vec3 ro, vec3 rd) {
    float b = dot(ro, rd), c = dot(ro, ro) - RE * RE, h = b * b - c;
    if (h < 0.0) return 1e9;
    float s = sqrt(h), t = -b - s;
    if (t > 0.0) return t;
    t = -b + s; return (c < 0.0 && t > 0.0) ? 0.0 : 1e9;
  }
  int cand[${MAXC}]; int nc = 0;
  void addCand(int k) { if (nc >= ${MAXC}) return; for (int i = 0; i < ${MAXC}; i++) { if (i >= nc) break; if (cand[i] == k) return; } cand[nc++] = k; }
  void addCell(vec3 p) {
    vec3 n = normalize(p);
    int x = int(floor((atan(-n.z, n.x) / 6.2831853 + 0.5) * ${CELL_W}.0)), y = int(floor((asin(clamp(n.y, -1.0, 1.0)) / 3.1415927 + 0.5) * ${CELL_H}.0));
    x = (x + ${CELL_W}) % ${CELL_W}; y = clamp(y, 0, ${CELL_H - 1});
    vec2 c = texelFetch(tCell, ivec2(x, y), 0).xy;
    int i0 = int(c.x), n0 = int(c.y);
    for (int i = 0; i < ${MAXC}; i++) { if (i >= n0) break; int ii = i0 + i; addCand(int(texelFetch(tItem, ivec2(ii & ${ITEM_W - 1}, ii >> ${Math.log2(ITEM_W)}), 0).r)); }
  }
  bool inside(vec3 q, int k) {
    vec4 a = pc(k); if (a.w <= 0.0 || distance(q, a.xyz) >= a.w - 0.01) return false;
    vec4 c = pn(k); return mod(c.w, 2.0) < 0.5 || dot(q - a.xyz, c.xyz) > 0.01;
  }
  bool insideOther(vec3 q, int skip) { for (int i = 0; i < ${MAXC}; i++) { if (i >= nc) break; if (cand[i] != skip && inside(q, cand[i])) return true; } return false; }
  float fres(float c) { return 0.04 + 0.96 * pow(1.0 - clamp(c, 0.0, 1.0), 5.0); }
  // light entering the glass at P (outward normal N) along rd; returns what it ends up showing
  vec3 path(vec3 P, vec3 N, vec3 rd, float ior, float lod) {
    vec3 thr = vec3(1.0 - fres(-dot(rd, N)));
    vec3 dir = refract(rd, N, 1.0 / ior), pos = P;
    for (int bounce = 0; bounce < 4; bounce++) {
      // inside: where the ray leaves the fused glass, or the ground
      float tG = earthT(pos, dir), tq = 1e9; vec3 nq = vec3(0.0); int kq = -1;
      for (int i = 0; i < ${MAXC}; i++) {
        if (i >= nc) break;
        float t0, t1; vec3 n0, n1;
        if (!span(pos, dir, cand[i], t0, t1, n0, n1) || t1 <= 0.02 || t1 >= tq) continue;
        if (insideOther(pos + dir * t1, cand[i])) continue;
        tq = t1; nq = n1; kq = cand[i];
      }
      float len = min(tG, tq);
      if (len < 1e8) thr *= pow(uTint, vec3(len / 1000.0)) * exp(-uAbs * len / 1000.0);
      if (tG <= tq || kq < 0) return tG < 1e8 ? thr * surface(normalize(pos + dir * tG), lod) : thr * env(dir);
      vec3 Q = pos + dir * tq, o = refract(dir, -nq, ior);
      if (dot(o, o) < 0.5) { dir = reflect(dir, -nq); pos = Q - nq * 0.02; continue; } // total internal reflection
      thr *= 1.0 - fres(dot(dir, nq));
      // out of the glass: it shows the ground it lands on, or space (black)
      float tE = earthT(Q, o);
      return tE < 1e8 ? thr * surface(normalize(Q + o * tE), lod) : thr * env(o);
    }
    return vec3(0.0);
  }
  // ro: the eye; P: a point of this fragment's own piece on the ray. The nearest glass along the ray wins, so every
  // overlapping fragment of a pixel computes the same colour. a = 0: no glass on this ray.
  int gSkip = -1; // a piece to look past (the ball whose soft edge this pixel is)
  bool gFast = false; // one colour channel only (no dispersion): for the extra look behind soft edges
  vec4 shade(vec3 ro, vec3 P, vec3 rd, int k0, float lod) {
    nc = 0; if (k0 != gSkip) addCand(k0); addCell(P); float tE = earthT(P, rd); addCell(P + rd * min(tE, 600.0)); addCell(P + rd * min(tE, 3000.0));
    float tn = 1e9; vec3 N = vec3(0.0); int kE = -1;
    for (int i = 0; i < ${MAXC}; i++) {
      if (i >= nc) break;
      float t0, t1; vec3 n0, n1;
      if (cand[i] == gSkip || !span(ro, rd, cand[i], t0, t1, n0, n1) || t0 <= 0.0 || t0 >= tn) continue;
      tn = t0; N = n0; kE = cand[i];
    }
    if (tn >= 1e8 || earthT(ro, rd) < tn) return vec4(0.0);
    vec3 Pin = ro + rd * tn;
    // satellites without a published swath can wear a different glass (No-swath glass): frosted, smoky or milky
    bool unk = kE >= 0 && pn(kE).w > 1.5;
    if (unk && uUnkMat == 1) lod += 4.0;
    // Refraction blends from low orbit (uIor) to geostationary distance (uIorFar) by the ball's distance from the Earth's centre
    float tf = clamp(log(length(pc(kE).xyz) / 7378.0) / log(42164.0 / 7378.0), 0.0, 1.0), ior = mix(uIor, uIorFar, tf);
    // Fill with Earth: seen from above, light through the ball at a fraction f of its radius bends by 2(i - asin(sin i / n));
    // it lands on the Earth while that bend stays within the Earth's angular radius a seen from the ball. So the index
    // that fills the ball out to f is n = sin i / sin(i - a/2), i = asin f; a ball with a lower index already fills.
    if (uFill > 0.0) {
      float a = asin(min(RE / length(pc(kE).xyz), 1.0)), i = asin(min(uFill, 0.999)), nf = sin(i) / max(sin(i - 0.5 * a), 1e-3);
      ior = max(min(ior, nf), 1.0005);
    }
    // dispersion follows the glass: the spread between colours grows with how strongly it bends (n - 1, fixed Abbe number),
    // so the Dispersion slider is the value for crown glass (n 1.52) and weaker glass spreads proportionally less
    float dsp = uDisp * (ior - 1.0) / 0.52;
    vec3 c = dsp > 0.0 && !gFast ? vec3(path(Pin, N, rd, max(ior - dsp, 1.0002), lod).r, path(Pin, N, rd, ior, lod).g, path(Pin, N, rd, ior + dsp, lod).b) : path(Pin, N, rd, ior, lod);
    if (unk && uUnkMat == 2) c *= 0.3;
    if (unk && uUnkMat == 3) c = mix(c, vec3(0.75), 0.55);
    float ci = clamp(-dot(rd, N), 0.0, 1.0);
    vec3 rr = reflect(rd, N); float tR = earthT(Pin + N * 0.02, rr);
    vec3 refl = tR < 1e8 ? surface(normalize(Pin + N * 0.02 + rr * tR), lod) : env(rr);
    c += uRefl * fres(ci) * refl;
    return vec4(clamp(c, 0.0, 1.0) + uRim * pow(1.0 - ci, 3.0), 1.0);
  }
  // a soft edge pixel: this ball over whatever the unbent ray meets past it (another ball, or black), by coverage
  vec4 edgeMix(vec4 c, float cov, vec3 ro, vec3 rd0, int k, float px, vec4 a) {

}

function render() {

}
function info() {

  const tn = wallS(); let np = 0; for (const p of popped.values()) if (p.t > 0 && tn - p.t < REVIVE()) np++;

  const card = p ? [
    `${p.name}${p.gname && p.gname.toUpperCase() !== p.name.toUpperCase() ? ' (' + p.gname + ')' : ''}`,
    [p.cat, p.alt != null ? Math.round(p.alt).toLocaleString() + ' km up' : '', 'NORAD ' + p.norad].filter(Boolean).join(' · '),
    p.swath != null ? `${p.inst} · ${Math.round(p.swath).toLocaleString()} km swath${p.src ? ' (' + p.src + ')' : ''}`

    isPopped(p, tn) ? `taken away · back in ${Math.ceil(REVIVE() - (tn - popped.get(p.norad).t))} s` : '',
  ].filter(Boolean).join('\n') + '\n\n' : '';

  el.textContent = card
    + `${sats.length.toLocaleString()} Earth-observation satellites · ${(sats.length - unk).toLocaleString()} real swath · ${unk.toLocaleString()} ${S.unk === 'est' ? 'estimated' : S.unk === 'typ' ? 'typical' : S.unk === 'hide' ? 'hidden' : 'at minimum'} · ${np} taken away\n`
    + `${live ? 'now' : d.toISOString().slice(0, 16).replace('T', ' ') + ' UTC'} · ${SPEED().toLocaleString()}× · ${fps.toFixed(0)} fps${ROOM ? ' · room ' + ROOM : ''}`;
}
