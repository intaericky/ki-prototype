<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lens</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --fg: #fff; --dim: #ffffff73; --faint: #ffffff2e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 13px/1.45 Pretendard, -apple-system, sans-serif; font-weight: 400; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #info { position: fixed; left: 20px; bottom: 16px; color: var(--dim); font-variant-numeric: tabular-nums; pointer-events: none; white-space: pre; }
  #toggle { position: fixed; top: 16px; right: 16px; background: none; border: 1px solid var(--faint); color: var(--dim); font: inherit; padding: 6px 12px; border-radius: 0; cursor: pointer; }
  #toggle.on { color: var(--fg); border-color: var(--fg); }
  #panel { position: fixed; top: 56px; right: 16px; width: 320px; max-height: calc(100vh - 80px); overflow: auto; background: #000000d9; border: 1px solid var(--faint); padding: 14px 16px; display: none; user-select: text; -webkit-user-select: text; }
  #panel.on { display: block; }
  .row { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { color: var(--dim); }
  .row output { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .seg { grid-column: 2 / 4; display: flex; gap: 0; }
  .seg button { flex: 1; background: none; color: var(--dim); border: 1px solid var(--faint); margin-left: -1px; padding: 4px 0; font: inherit; cursor: pointer; }
  .seg button.on { color: #000; background: var(--fg); border-color: var(--fg); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; background: none; height: 18px; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--dim); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #000; border: 1px solid var(--fg); margin-top: -5px; }
  input[type=range]::-moz-range-track { height: 1px; background: var(--dim); }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #000; border: 1px solid var(--fg); }
  .note { color: var(--dim); font-size: 12px; margin-top: 12px; line-height: 1.5; }
  .note b { color: var(--fg); font-weight: 400; }
  .list { color: var(--dim); font-size: 11.5px; line-height: 1.5; margin-top: 10px; }
  .list .k { color: var(--fg); }
  .err { color: #fff; }
  body.display #toggle, body.display #panel, body.display #info { display: none; }
  body.tablet #toggle { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"></div>
<button id="toggle">Settings</button>
<div id="panel"></div>
<script type="importmap">{ "imports": { "three": "/sphere-assets/vendor/three.module.min.js" } }</script>
<script type="module">
// Lens: every Earth-observation satellite as a glass dome lying on the Earth at the point right under it, moving along
// its real ground track. Each dome is as wide as the strip of ground the satellite images (published swath). Earth is
// black: its surface shows only through the domes, magnified, like a reading glass laid on a map.
import * as THREE from 'three';
import * as ORB from '/entangled/orbit.js';
import { matchSwath } from '/coverage/swaths.js';
import { RoomEnvironment } from '/sphere-assets/vendor/jsm/environments/RoomEnvironment.js';
const { RE, D2R, TAU } = ORB;
THREE.ColorManagement.enabled = false;

const Q = new URLSearchParams(location.search);
const ROLE = location.pathname.includes('display') || Q.has('display') ? 'display' : location.pathname.includes('tablet') || Q.has('tablet') ? 'tablet' : 'studio';
document.body.classList.add(ROLE);
const TEST = location.hash.includes('test');
const $ = (id) => document.getElementById(id);

// ---------- settings ----------
const CROWN = { ior: 152, disp: 4, refl: 100, rim: 0, tint: '#ffffff', abs: 0, frost: 0 }; // the glass sliders' starting point
const DEF = { view: 'glass', shape: 'sphere', place: 'ground', sizing: 'swath', one: 717, size: 50, min: 662, fit: 'add', res: 100, q360: 100, light: 'day', unk: 'est', geo: 'clamp', spd: 52,  ...CROWN, gain: 100, lift: 100 };
let S = { ...DEF };
const KEY = 'lens-v5';
if (ROLE === 'studio' && !TEST) try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
for (const k of Object.keys(DEF)) if (Q.has(k)) S[k] = typeof DEF[k] === 'number' ? +Q.get(k) : Q.get(k);
if (ROLE === 'display') S.view = '360';
if (ROLE === 'tablet' && !Q.has('view')) S.view = 'lines';
const save = () => { if (ROLE === 'studio' && !TEST) try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const SCALE = () => Math.pow(10, (S.size - 50) / 50); // ×0.1 .. ×10 of the real swath (50 → ×1)
// the glass: clear crown glass (Schott N-BK7). Refractive index at 550 nm 1.5185; red (620 nm) 1.5157, blue (460 nm) 1.5245
// (Schott datasheet, Sellmeier fit). The bending and reflection follow from these by Snell's law and Fresnel; nothing else is set.
// render pixels per screen point (each one is ray traced): 1 by default, up to the screen's own density
const PR = () => ROLE === 'display' ? 1 : Math.min(S.res / 100, devicePixelRatio || 1, 2);
// Minimum slider: 0 = none, then logarithmic from 1 km to 3,000 km (fine steps near the smallest real swaths)
const MINKM = () => S.min <= 0 ? 0 : Math.pow(3000, S.min / 1000);
const ONEKM = () => Math.pow(3000, S.one / 1000); // One size slider: 1 .. 3,000 km, logarithmic
const minSlider = (km) => Math.max(1, Math.round(1000 * Math.log(Math.max(1, km)) / Math.log(3000)));
const SPEED = () => Math.round(Math.pow(10, S.spd / 25));

// ---------- renderer ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: TEST });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 10, 500000);
const view = { yaw: 0.4, pitch: 0.3, dist: 24000 };
const rot360 = new THREE.Quaternion(); // LED frame orientation (frame centre = scene direction rot360·(1,0,0))
const rot360M = new THREE.Matrix3(), rot360T = new THREE.Matrix3();
const ball = { yaw: Math.PI / 2, pitch: 0.12, dist: 4.8 };

const tl = new THREE.TextureLoader();
const tex = (u) => { const t = tl.load(u); t.wrapS = THREE.RepeatWrapping; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 8; return t; };
const tDay = tex('/sphere-assets/bluemarble-4k.jpg'), tNight = tex('/sphere-assets/blackmarble-4k.jpg'); // NASA Blue Marble / Black Marble

// ---------- optics (shared GLSL) ----------
// A dome = the part of a glass sphere (centre on the ground, radius = half the swath) that stands above the ground.
// A ray refracts into the glass, runs down to the ground under it (the Earth image) or out through the far side.
const U = { tDay: { value: tDay }, tNight: { value: tNight }, uSun: { value: new THREE.Vector3(1, 0, 0) }, uLight: { value: 0 }, uIor: { value: 1.5 }, uDisp: { value: 0 },
  uPxK: { value: 0.001 }, uTop: { value: 8000 }, uRotM: { value: rot360M }, uRotT: { value: rot360T }, uRes: { value: new THREE.Vector2(1920, 1080) }, uShift: { value: 0 },
  tDome: { value: null }, tCell: { value: null }, tItem: { value: null }, tEnv: { value: null }, uEnv: { value: 0.5 }, uLsize: { value: 1 }, uLshape: { value: 0 }, uGain: { value: 1 }, uLift: { value: 1 }, uTint: { value: new THREE.Color(1, 1, 1) }, uAbs: { value: 0 }, uFrost: { value: 0 }, uRefl: { value: 1 }, uRim: { value: 0 } };
{ // bake the soft-box room once into a cube map (HDR, so the boxes' reflections stay bright)
  const rt = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
  new THREE.CubeCamera(0.1, 100, rt).update(renderer, new RoomEnvironment());
  U.tEnv.value = rt.texture;
}
// Light through the glass, traced per pixel (three.js's own transmission only bends what is already on screen, and
// here the Earth is never drawn). Every satellite is one piece of glass: a full sphere, or a dome (half a sphere, its
// flat face towards the Earth). All pieces are one material, so where they overlap they fuse into a single body with
// no surface inside. A ray refracts in, crosses the glass (absorbed and tinted along the way), and either reaches the
// ground (the Earth image) or refracts out again and may enter the next piece. Ground no glass-bent light reaches stays black.
// Pieces near a ray are found through a 1° grid on the sky (each piece listed in every cell its outline covers).
const DOME_W = 1024, ITEM_W = 4096, CELL_W = 360, CELL_H = 180, MAXC = 40;
// one piece of glass: where a ray enters and leaves it (shared by the id pass and the tracer)
const PIECE = /* glsl */`
  uniform highp sampler2D tDome;
  ivec2 tx(int i) { return ivec2(i & ${DOME_W - 1}, i >> ${Math.log2(DOME_W)}); }
  vec4 pc(int k) { return texelFetch(tDome, tx(2 * k), 0); }      // centre (km), radius
  vec4 pn(int k) { return texelFetch(tDome, tx(2 * k + 1), 0); }  // outward axis, 1 = dome (half), 0 = sphere
  // the span [t0, t1] of the ray inside piece k, with the outward normals where it enters and leaves
  bool span(vec3 ro, vec3 rd, int k, out float t0, out float t1, out vec3 n0, out vec3 n1) {
    vec4 a = pc(k); if (a.w <= 0.0) return false;
    vec3 oc = ro - a.xyz; float b = dot(oc, rd), dm = length(cross(oc, rd));
    if (dm >= a.w) return false;
    float h = sqrt(a.w * a.w - dm * dm); t0 = -b - h; t1 = -b + h;
    n0 = (oc + rd * t0) / a.w; n1 = (oc + rd * t1) / a.w;
    vec4 c = pn(k);
    if (c.w > 0.5) { // dome: only the side of the flat face away from the Earth
      float s0 = dot(oc, c.xyz), sd = dot(rd, c.xyz);
      if (abs(sd) < 1e-7) { if (s0 < 0.0) return false; }
      else { float tp = -s0 / sd; if (sd > 0.0) { if (tp > t0) { t0 = tp; n0 = -c.xyz; } } else { if (tp < t1) { t1 = tp; n1 = -c.xyz; } } }
    }
    return t1 > t0;
  }
  vec4 idColor(int k) { int i = k + 1; return vec4(float(i & 255), float((i >> 8) & 255), float((i >> 16) & 255), 255.0) / 255.0; }
  int idOf(vec4 e) { return int(e.r * 255.0 + 0.5) + int(e.g * 255.0 + 0.5) * 256 + int(e.b * 255.0 + 0.5) * 65536 - 1; }`;
const OPTICS = /* glsl */`${PIECE}
  uniform sampler2D tDay, tNight; uniform vec3 uSun; uniform float uLight, uIor, uDisp, uGain, uLift, uAbs, uFrost, uRefl, uRim; uniform vec3 uTint;
  // studio light: a soft-box room (as in Entangled) that stays fixed to the viewer, so every ball carries the same
  // highlights wherever it is on the display; there is no direction in the world. It is what the glass reflects, and
  // what it shows where light passes through into space.
  uniform samplerCube tEnv; uniform float uEnv, uLsize; uniform int uLshape; mat3 gEnvM = mat3(1.0);
  // soft lights around the viewer (v: +z towards the viewer, +y up); each a smooth falloff, no hard edge
  float lamp(vec3 v, vec3 c, float r) { float a = acos(clamp(dot(v, normalize(c)), -1.0, 1.0)) / r; return exp(-a * a); }
  vec3 env(vec3 d) {
    vec3 v = gEnvM * d; float r = uLsize * (1.0 + uFrost * 0.3);
    if (uLshape == 2) return uEnv * textureLod(tEnv, v, 3.0 + uFrost).rgb;                      // room (soft boxes)
    float L;
    if (uLshape == 1) { float a = (acos(clamp(v.z, -1.0, 1.0)) - 0.6) / (0.12 * r); L = 0.6 * exp(-a * a); } // ring light around the viewer
    else L = lamp(v, vec3(-0.55, 0.6, 1.0), 0.32 * r) + 0.6 * lamp(v, vec3(0.7, 0.15, 1.0), 0.42 * r) + 0.35 * lamp(v, vec3(0.0, -0.7, 0.7), 0.6 * r); // key, fill, low bounce
    return uEnv * (40.0 * L + 0.04 * (0.5 + 0.5 * v.y)) * vec3(1.0, 0.99, 0.97);
  }
  uniform highp sampler2D tCell, tItem;
  const float RE = 6378.137;
  vec3 surface(vec3 n, float lod) {
    vec3 e = vec3(n.x, -n.z, n.y);
    vec2 uv = vec2(atan(e.y, e.x) / 6.2831853 + 0.5, asin(clamp(e.z, -1.0, 1.0)) / 3.1415927 + 0.5);
    lod += uFrost;
    vec3 c = textureLod(tDay, uv, lod).rgb;
    if (uLight > 0.5) c = mix(textureLod(tNight, uv, lod).rgb * 0.7, c, smoothstep(-0.08, 0.12, dot(n, uSun)));
    return pow(clamp(uGain * c, 0.0, 1.0), vec3(1.0 / uLift)); // map brightness and lifted darks (the image only, not the glass)
  }
  float earthT(vec3 ro, vec3 rd) {
    float b = dot(ro, rd), c = dot(ro, ro) - RE * RE, h = b * b - c;
    if (h < 0.0) return 1e9;
    float s = sqrt(h), t = -b - s;
    if (t > 0.0) return t;
    t = -b + s; return (c < 0.0 && t > 0.0) ? 0.0 : 1e9;
  }
  int cand[${MAXC}]; int nc = 0;
  void addCand(int k) { if (nc >= ${MAXC}) return; for (int i = 0; i < ${MAXC}; i++) { if (i >= nc) break; if (cand[i] == k) return; } cand[nc++] = k; }
  void addCell(vec3 p) {
    vec3 n = normalize(p);
    int x = int(floor((atan(-n.z, n.x) / 6.2831853 + 0.5) * ${CELL_W}.0)), y = int(floor((asin(clamp(n.y, -1.0, 1.0)) / 3.1415927 + 0.5) * ${CELL_H}.0));
    x = (x + ${CELL_W}) % ${CELL_W}; y = clamp(y, 0, ${CELL_H - 1});
    vec2 c = texelFetch(tCell, ivec2(x, y), 0).xy;
    int i0 = int(c.x), n0 = int(c.y);
    for (int i = 0; i < ${MAXC}; i++) { if (i >= n0) break; int ii = i0 + i; addCand(int(texelFetch(tItem, ivec2(ii & ${ITEM_W - 1}, ii >> ${Math.log2(ITEM_W)}), 0).r)); }
  }
  bool inside(vec3 q, int k) {
    vec4 a = pc(k); if (a.w <= 0.0 || distance(q, a.xyz) >= a.w - 0.01) return false;
    vec4 c = pn(k); return c.w < 0.5 || dot(q - a.xyz, c.xyz) > 0.01;
  }
  bool insideOther(vec3 q, int skip) { for (int i = 0; i < ${MAXC}; i++) { if (i >= nc) break; if (cand[i] != skip && inside(q, cand[i])) return true; } return false; }
  float fres(float c) { return 0.04 + 0.96 * pow(1.0 - clamp(c, 0.0, 1.0), 5.0); }
  // light entering the glass at P (outward normal N) along rd; returns what it ends up showing
  vec3 path(vec3 P, vec3 N, vec3 rd, float ior, float lod) {
    vec3 thr = vec3(1.0 - fres(-dot(rd, N)));
    vec3 dir = refract(rd, N, 1.0 / ior), pos = P;
    for (int bounce = 0; bounce < 4; bounce++) {
      // inside: where the ray leaves the fused glass, or the ground
      float tG = earthT(pos, dir), tq = 1e9; vec3 nq = vec3(0.0); int kq = -1;
      for (int i = 0; i < ${MAXC}; i++) {
        if (i >= nc) break;
        float t0, t1; vec3 n0, n1;
        if (!span(pos, dir, cand[i], t0, t1, n0, n1) || t1 <= 0.02 || t1 >= tq) continue;
        if (insideOther(pos + dir * t1, cand[i])) continue;
        tq = t1; nq = n1; kq = cand[i];
      }
      float len = min(tG, tq);
      if (len < 1e8) thr *= pow(uTint, vec3(len / 1000.0)) * exp(-uAbs * len / 1000.0);
      if (tG <= tq || kq < 0) return tG < 1e8 ? thr * surface(normalize(pos + dir * tG), lod) : thr * env(dir);
      vec3 Q = pos + dir * tq, o = refract(dir, -nq, ior);
      if (dot(o, o) < 0.5) { dir = reflect(dir, -nq); pos = Q - nq * 0.02; continue; } // total internal reflection
      thr *= 1.0 - fres(dot(dir, nq));
      // out of the glass: it shows the ground it lands on, or space (black)
      float tE = earthT(Q, o);
      return tE < 1e8 ? thr * surface(normalize(Q + o * tE), lod) : thr * env(o);
    }
    return vec3(0.0);
  }
  // ro: the eye; P: a point of this fragment's own piece on the ray. The nearest glass along the ray wins, so every
  // overlapping fragment of a pixel computes the same colour. a = 0: no glass on this ray.
  vec4 shade(vec3 ro, vec3 P, vec3 rd, int k0, float lod) {
    nc = 0; addCand(k0); addCell(P); float tE = earthT(P, rd); addCell(P + rd * min(tE, 600.0)); addCell(P + rd * min(tE, 3000.0));
    float tn = 1e9; vec3 N = vec3(0.0);
    for (int i = 0; i < ${MAXC}; i++) {
      if (i >= nc) break;
      float t0, t1; vec3 n0, n1;
      if (!span(ro, rd, cand[i], t0, t1, n0, n1) || t0 <= 0.0 || t0 >= tn) continue;
      tn = t0; N = n0;
    }
    if (tn >= 1e8 || earthT(ro, rd) < tn) return vec4(0.0);
    vec3 Pin = ro + rd * tn;
    vec3 c = uDisp > 0.0 ? vec3(path(Pin, N, rd, uIor - uDisp, lod).r, path(Pin, N, rd, uIor, lod).g, path(Pin, N, rd, uIor + uDisp, lod).b) : path(Pin, N, rd, uIor, lod);
    float ci = clamp(-dot(rd, N), 0.0, 1.0);
    vec3 rr = reflect(rd, N); float tR = earthT(Pin + N * 0.02, rr);
    vec3 refl = tR < 1e8 ? surface(normalize(Pin + N * 0.02 + rr * tR), lod) : env(rr);
    c += uRefl * fres(ci) * refl;
    return vec4(clamp(c, 0.0, 1.0) + uRim * pow(1.0 - ci, 3.0), 1.0);
  }`;

// --- 3D: one sphere mesh per piece (instanced); the exact glass is found per pixel
const domeVert = /* glsl */`
  attribute vec4 aC; varying vec3 vW, vC; varying float vR; flat varying int vK;
  void main() {
    vR = aC.w; vC = aC.xyz; vK = gl_InstanceID;
    if (vR <= 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    vW = vC + position * vR * 1.02;
    gl_Position = projectionMatrix * viewMatrix * vec4(vW, 1.0);
  }`;
// pass 1: which piece of glass each pixel sees first (exact entry point, written as depth); pass 2: trace that pixel once
const idFrag = /* glsl */`${PIECE}
  uniform mat4 uVP; varying vec3 vW, vC; varying float vR; flat varying int vK;
  void main() {
    vec3 ro = cameraPosition, rd = normalize(vW - ro);
    float t0, t1; vec3 n0, n1;
    if (!span(ro, rd, vK, t0, t1, n0, n1) || t1 <= 0.0) discard;
    vec4 cp = uVP * vec4(ro + rd * max(t0, 0.0), 1.0);
    gl_FragDepth = clamp(cp.z / cp.w * 0.5 + 0.5, 0.0, 1.0);
    gl_FragColor = idColor(vK);
  }`;
const quadVert = /* glsl */`void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const traceFrag = /* glsl */`${OPTICS}
  uniform sampler2D tId; uniform mat4 uInvVP; uniform mat3 uViewRot; uniform vec3 uCam; uniform vec2 uView; uniform float uPxK;
  void main() {
    int k = idOf(texelFetch(tId, ivec2(gl_FragCoord.xy), 0));
    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
    if (k < 0) return;
    vec4 w = uInvVP * vec4(gl_FragCoord.xy / uView * 2.0 - 1.0, 1.0, 1.0);
    vec3 ro = uCam, rd = normalize(w.xyz / w.w - ro);
    float t0, t1; vec3 n0, n1;
    if (!span(ro, rd, k, t0, t1, n0, n1)) return;
    vec4 a = pc(k); float dm = length(cross(ro - a.xyz, rd));
    float px = uPxK * max(t0, 1.0), cov = clamp((a.w - dm) / px + 0.5, 0.0, 1.0);
    gEnvM = uViewRot;
    vec4 c = shade(ro, ro + rd * max(t0, 0.0), rd, k, max(0.0, log2(px / uIor / 9.8)));
    gl_FragColor = vec4(c.rgb * c.a * cov, 1.0);
  }`;
// --- lines (tablet): one circle per piece, its outline as seen; dashed when the swath is not published
const ringVert = /* glsl */`
  attribute vec4 aC; attribute float aF; varying float vT, vF;
  void main() {
    float r = aC.w; vT = position.x; vF = aF;
    if (r <= 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    vec3 v = normalize(cameraPosition - aC.xyz), e1 = normalize(cross(v, abs(v.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0))), e2 = cross(v, e1);
    vec3 P = aC.xyz + r * (cos(vT) * e1 + sin(vT) * e2);
    gl_Position = projectionMatrix * viewMatrix * vec4(P, 1.0);
  }`;
const ringFrag = /* glsl */`
  varying float vT, vF;
  void main() { if (vF > 0.5 && mod(floor(vT * 12.0 / 3.1415927), 2.0) > 0.5) discard; gl_FragColor = vec4(1.0); }`;
// --- 360 frame for the LED sphere: each piece drawn straight into the equirect image, seen from directly above
const eqVert = /* glsl */`
  uniform mat3 uRotT; uniform vec2 uRes; uniform float uShift;
  attribute vec4 aC; varying vec3 vC; varying float vR; flat varying int vK;
  void main() {
    float r = aC.w, L = length(aC.xyz); vC = aC.xyz; vR = r; vK = gl_InstanceID;
    if (r <= 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    vec3 d0 = uRotT * (aC.xyz / L);

for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', (e) => { zoom(Math.exp(e.deltaY * 0.0012)); e.preventDefault(); }, { passive: false });
function turn(dx, dy) {

function zoom(f) {

  if (S.view === '360') return;
  view.dist = Math.max(RE + 300, Math.min(200000, RE + (view.dist - RE) * f));

// ---------- room: the sphere's turn and the clock are shared with the LED display (public relay) ----------
const ROOM = ORB.cleanRoom(Q.get('room'));
const TOPIC = 'sampling-sphere/v1/lens' + (ROOM ? '/' + ROOM : ''), ME = Math.random().toString(36).slice(2, 10);
let mq = null, relayOk = false, lookT = 0;
const publish = (t, obj, retain = false) => { if (mq && relayOk) mq.publish(TOPIC + t, JSON.stringify(obj), { retain, qos: retain ? 1 : 0 }); };
function sendLook(force) {

function sendClock() { clock = { wall0: Date.now(), sim0: simT, speed: SPEED(), by: ME }; publish('/clock', clock, true); }
if (!Q.has('solo') && !TEST) import('/sphere-assets/vendor/mqtt.esm.js').then((m) => {
  const mqtt = m.default || m;
  mq = mqtt.connect(Q.get('broker') || 'wss://broker.emqx.io:8084/mqtt', { connectTimeout: 30000, keepalive: 30 });
  mq.on('close', () => { relayOk = false; }); mq.on('offline', () => { relayOk = false; });

let camQ = null, lookDirty = false;

}

// ---------- panel (studio) ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SL = [['size', 'Size', 0, 100, () => '×' + (SCALE() < 1 ? SCALE().toFixed(2) : SCALE().toFixed(1)) + ' real'], ['one', 'One size', 0, 1000, () => (ONEKM() < 10 ? ONEKM().toFixed(1) : Math.round(ONEKM()).toLocaleString()) + ' km'], ['min', 'Minimum', 0, 1000, () => (MINKM() < 10 ? MINKM().toFixed(1) : Math.round(MINKM()).toLocaleString()) + ' km'],
  ['gain', 'Map brightness', 50, 400, () => (S.gain / 100).toFixed(1) + '×'], ['lift', 'Lift darks', 100, 300, () => (S.lift / 100).toFixed(1)], 
  ['ior', 'Refraction', 100, 250, () => (S.ior / 100).toFixed(2)], ['disp', 'Dispersion', 0, 100, () => (S.disp / 1000).toFixed(3)], ['refl', 'Reflection', 0, 300, () => (S.refl / 100).toFixed(1) + '×'],
  ['rim', 'Edge glow', 0, 100, () => S.rim + ''], ['abs', 'Absorption', 0, 100, () => S.abs + ''], ['frost', 'Frost', 0, 100, () => S.frost + ''], ['spd', 'Speed', 0, 100, () => SPEED().toLocaleString() + '×'], ['q360', '360 detail', 50, 200, () => Math.round(1920 * S.q360 / 100) + ' px'], ['res', 'Resolution', 25, 200, () => '×' + (PR() ).toFixed(2) + ' px']];
const SEG = [['view', 'View', [['glass', 'Glass'], ['lines', 'Lines'], ['360', '360'], ['ball', 'Sphere']]],
  ['sizing', 'Sizes', [['swath', 'By swath'], ['same', 'All the same']]], ['shape', 'Shape', [['dome', 'Dome'], ['sphere', 'Sphere']]], ['place', 'Where', [['ground', 'On the ground'], ['orbit', 'Real orbit']]], ['light', 'Light', [['sun', 'Sun now'], ['day', 'All day']]],
  ['unk', 'No swath', [['est', 'Estimate'], ['typ', 'Typical'], ['min', 'Minimum'], ['hide', 'Hide']]], ['fit', 'Minimum is', [['add', 'Added'], ['floor', 'A floor']]], ['geo', 'Full disk', [['clamp', 'Clamp'], ['1', 'Real'], ['0', 'Hide']]]];
function panelBuild() {
  $('panel').innerHTML = SEG.map(([k, l, o]) => `<div class="row"><label>${l}</label><div class="seg" data-k="${k}">${o.map(([v, t]) => `<button data-v="${v}">${t}</button>`).join('')}</div></div>`).join('')
    + SL.map(([k, l, a, b]) => `<div class="row"><label>${l}</label><input type="range" data-k="${k}" min="${a}" max="${b}" step="1"><output data-o="${k}"></output></div>`).join('')
    + `<div class="row"><label>Tint</label><input type="color" id="tint" style="grid-column:2/4;width:100%;height:22px;background:none;border:1px solid var(--faint);padding:0"></div>`
    + `<div class="row"><label></label><div class="seg"><button id="smallest">Min = smallest swath</button><button id="crown">Crown glass</button></div></div>
    <div class="row"><label></label><div class="seg"><button id="now">Back to now</button><button id="reset">Reset</button></div></div>
    <div class="row"><label></label><div class="seg"><button id="copy">Copy display URL</button></div></div>
    <div class="note">Every Earth-observation satellite with a public orbit, as a ball of clear glass (crown glass, N-BK7, refractive index 1.52) at its <b>real orbit</b> position, moving with it, or lying <b>on the ground</b> right under it; <b>Dome</b> cuts it to a half sphere with its flat face towards the Earth. Light bends and reflects by Snell's law and Fresnel; overlapping balls fuse into one body of glass. Earth is black: its surface shows only through the glass. <b>Width = the satellite's published swath</b> (the strip of ground its widest imager records at once; ×1 = real). <b>No swath</b>: <b>Estimate</b> gives each satellite without a published swath the typical viewing angle of its own kind (optical, radar, weather, Earth science) at its own altitude; <b>Typical</b> gives the median of its kind; radio occultation satellites take no images and stay at the minimum. <b>Minimum</b> is <b>added</b> to every width (all stay visible and keep their differences) or used as <b>a floor</b> (×1 widths stay real). <b>Full disk</b>: geostationary imagers see a whole hemisphere (about 18,000 km) and hide everything else, so they are off unless shown. <b>Resolution</b>: traced pixels per screen point; lower it if it lags. Tap a ball to name it.</div>
    <div class="list" id="lists"></div>`;
  $('panel').querySelectorAll('.seg[data-k] button').forEach((b) => b.onclick = () => { const k = b.parentNode.dataset.k; S[k] = b.dataset.v; if (k === 'unk' || k === 'geo' || k === 'fit' || k === 'sizing') reorder(); save(); panelSync(); });
  $('panel').querySelectorAll('input[data-k]').forEach((r) => r.oninput = () => { const k = r.dataset.k, was = SPEED(); S[k] = +r.value; if (k === 'spd' && SPEED() !== was) { simT = simNow(); clock = null; sendClock(); } if (k === 'size' || k === 'min' || k === 'one') reorder(); if (k === 'res') resize(); save(); panelSync(); });
  $('tint').oninput = (e) => { S.tint = e.target.value; save(); };
  $('smallest').onclick = () => { if (kindStats.all?.lo) { S.min = minSlider(kindStats.all.lo); reorder(); save(); panelSync(); } };
  $('crown').onclick = () => { Object.assign(S, CROWN); save(); panelSync(); };
  $('now').onclick = () => { simT = Date.now(); S.spd = 0; clock = null; sendClock(); save(); panelSync(); };
  $('copy').onclick = () => {
    const q = new URLSearchParams(); for (const k of Object.keys(DEF)) if (k !== 'view' && String(S[k]) !== String(DEF[k])) q.set(k, S[k]);
    if (ROOM) q.set('room', ROOM);

    navigator.clipboard?.writeText(url).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => { $('copy').textContent = 'Copy display URL'; }, 1500); }, () => { $('copy').textContent = url; });
  };

}
let listsFor = -1;
function panelSync() {
  document.querySelectorAll('.seg[data-k]').forEach((s) => s.querySelectorAll('button').forEach((b) => b.classList.toggle('on', String(S[s.dataset.k]) === b.dataset.v)));
  if ($('tint')) $('tint').value = S.tint;
  for (const [k, , , , f] of SL) { const r = document.querySelector(`input[data-k="${k}"]`); if (r) r.value = S[k]; const o = document.querySelector(`output[data-o="${k}"]`); if (o) o.textContent = f(); }
  if (loaded && $('lists') && listsFor !== sats.length) {
    listsFor = sats.length;
    const by = new Map(); for (const s of sats) if (s.swath != null) { const k = s.inst + '|' + Math.round(s.swath) + '|' + s.src; by.set(k, (by.get(k) || 0) + 1); }
    const rows = [...by].map(([k, n]) => k.split('|').concat(n)).sort((a, b) => b[1] - a[1]);
    const unk = sats.filter((s) => s.swath == null), grp = (w) => unk.filter((s) => s.why === w).map((s) => s.name);
    $('lists').innerHTML = `<span class="k">${sats.length} satellites</span> · ${sats.length - unk.length} with a published swath · ${unk.length} without<br>Sources: ${esc(meta.sources.join('; '))}${meta.errors.length ? '<br>Not loaded: ' + esc(meta.errors.join(', ')) : ''}<br><br>`
      + `<span class="k">Swaths</span><br>` + rows.map(([i, km, src, n]) => `${n} × ${esc(i)}: ${(+km).toLocaleString()} km <span style="opacity:.6">(${esc(src)})</span>`).join('<br>')
      + `<br><br><span class="k">Estimates</span> (No swath: Estimate): each satellite without a published swath gets the typical viewing angle of its kind (median of published swath ÷ altitude) at its own altitude, so higher satellites get wider strips; nothing is random. By kind: ${Object.entries(kindStats).filter(([k]) => KINDS[k] || k === 'all').map(([k, v]) => `${KINDS[k] || 'all'} ${v.n} known, ${Math.round(v.lo)}–${Math.round(v.hi).toLocaleString()} km, median ${Math.round(v.med)} km, typical angle ${v.ang.toFixed(1)}°`).join('; ')}. Typical = the median swath.`

      + `<br><br><span class="k">Military, not published (${grp('secret').length})</span>, drawn at the minimum:<br>${esc(grp('secret').join(', '))}`
      + `<br><br><span class="k">Swath not found (${grp('unknown').length})</span>, drawn at the minimum:<br>${esc(grp('unknown').join(', '))}`
      + (noOrbit.length ? `<br><br><span class="k">No public orbit (${noOrbit.length})</span>, not drawn:<br>${esc(noOrbit.join(', '))}` : '');

}
$('toggle').onclick = () => { $('panel').classList.toggle('on'); $('toggle').classList.toggle('on'); };
panelBuild(); panelSync();

// ---------- sizing ----------
function resize() {
  renderer.setPixelRatio(PR()); renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  ballCam.aspect = innerWidth / innerHeight; ballCam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- frame ----------
let last = performance.now(), fps = 60;
const simNow = () => clock ? clock.sim0 + (Date.now() - clock.wall0) * clock.speed : simT;
function frame(now) {
  if (!TEST) requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now; fps = fps * 0.95 + 0.05 / Math.max(dt, 1e-3);
  simT = clock ? simNow() : simT + dt * 1000 * SPEED();
  render();
}
function render() {
  if (loaded && Math.abs(simT - T0) > 432e5) { T0 = simT; catQ = sats.map((s) => ORB.prep(s, T0)); }
  if (loaded) update();
  U.uEnv.value = 0; U.uGain.value = S.gain / 100; U.uLift.value = S.lift / 100; U.uIor.value = S.ior / 100; U.uDisp.value = S.disp / 1000; U.uRefl.value = S.refl / 100; U.uRim.value = S.rim / 100; U.uAbs.value = S.abs / 25; U.uFrost.value = S.frost / 20; U.uTint.value.set(S.tint); U.uLight.value = S.light === 'sun' ? 1 : 0;
  const rot = -ORB.gmst(simT), se = sunEci(simT), cr = Math.cos(rot), sr = Math.sin(rot);
  U.uSun.value.set(cr * se[0] - sr * se[1], se[2], -(sr * se[0] + cr * se[1]));
  const v = S.view;
  if (v === 'glass' || v === 'lines') {
    camera.position.set(Math.cos(view.pitch) * Math.sin(view.yaw), Math.sin(view.pitch), Math.cos(view.pitch) * Math.cos(view.yaw)).multiplyScalar(view.dist);
    camera.lookAt(0, 0, 0);

    earthLine.visible = v === 'lines';
    if (meshes) meshes.ring.visible = v === 'lines';
    lookFromCamera();
    if (v === 'glass') {
      const sz = renderer.getDrawingBufferSize(new THREE.Vector2());
      if (idRT.width !== sz.x || idRT.height !== sz.y) idRT.setSize(sz.x, sz.y);
      idMat.uniforms.uVP.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      renderer.setRenderTarget(idRT); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(idScene, camera);
      const tu = traceMat.uniforms; tu.uInvVP.value.multiplyMatrices(camera.matrixWorld, camera.projectionMatrixInverse); tu.uCam.value.copy(camera.position); tu.uViewRot.value.setFromMatrix4(camera.matrixWorldInverse); tu.uView.value.copy(sz);
      renderer.setRenderTarget(null); renderer.render(traceScene, eqCam);
    } else { renderer.setRenderTarget(null); renderer.render(scene, camera); }
  } else {
    rot360M.setFromMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(rot360)); rot360T.copy(rot360M).transpose();
    const qs = S.q360 / 100, ew = Math.round(1920 * qs), eh = Math.round(1080 * qs);
    if (eqRT.width !== ew) { eqRT.setSize(ew, eh); eqIdRT.setSize(ew, eh); }
    U.uRes.value.set(ew, eh);
    renderer.setClearColor(0x000000, 1);
    renderer.setRenderTarget(eqIdRT); renderer.clear(); renderer.render(eqScene, eqCam);
    renderer.setRenderTarget(eqRT); renderer.render(eqTraceScene, eqCam);
    renderer.setRenderTarget(null);
    if (v === '360') renderer.render(blitScene, eqCam);
    else {
      ballCam.position.set(Math.cos(ball.pitch) * Math.sin(ball.yaw), Math.sin(ball.pitch), Math.cos(ball.pitch) * Math.cos(ball.yaw)).multiplyScalar(ball.dist);
      ballCam.lookAt(0, 0, 0); renderer.setClearColor(0x050505, 1); renderer.clear(); renderer.render(ballScene, ballCam); renderer.setClearColor(0x000000, 1);
    }
  }
  info();
}
function info() {
  const el = $('info');
  if (!loaded) { el.innerHTML = meta.errors.length ? '<span class="err">Could not load the catalogue. Nothing is shown (no stand-in data).</span>' : 'Loading the catalogue…'; return; }
  const d = new Date(simT), live = Math.abs(simT - Date.now()) < 5000, unk = sats.reduce((n, s) => n + (s.swath == null), 0);
  if (ROLE === 'tablet') { el.textContent = sats.length.toLocaleString(); return; }
  const p = picked >= 0 ? sats[picked] : null;
  el.textContent = (p ? `${p.name}${p.gname && p.gname.toUpperCase() !== p.name.toUpperCase() ? ' (' + p.gname + ')' : ''} · ${p.swath != null ? p.inst + ' · ' + Math.round(p.swath).toLocaleString() + ' km swath' : { ro: 'radio occultation, no imaging swath', secret: 'military, swath not published', unknown: 'swath not found' }[p.why] + (S.unk === 'est' && p.est != null ? ' · estimated ' + Math.round(p.est).toLocaleString() + ' km (' + p.from + ' angle at its altitude)' : S.unk === 'typ' && p.typ != null ? ' · typical ' + Math.round(p.typ).toLocaleString() + ' km (' + p.from + ')' : ' · shown at minimum')}${p.cat ? ' · ' + p.cat : ''}\n` : '')
    + `${sats.length.toLocaleString()} Earth-observation satellites · ${(sats.length - unk).toLocaleString()} real swath · ${unk.toLocaleString()} ${S.unk === 'est' ? 'estimated' : S.unk === 'typ' ? 'typical' : S.unk === 'hide' ? 'hidden' : 'at minimum'}\n`
    + `${live ? 'now' : d.toISOString().slice(0, 16).replace('T', ' ') + ' UTC'} · ${SPEED().toLocaleString()}× · ${fps.toFixed(0)} fps${ROOM ? ' · room ' + ROOM : ''}`;
}

if (TEST) window.__lens = { ingest, render, tap, S, view, rot360, sats: () => sats, setView: (k) => { S.view = k; } };
load();
requestAnimationFrame(frame);
</script>
