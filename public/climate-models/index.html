<style>

  #info { position: fixed; left: 16px; top: 14px; max-width: min(560px, calc(100vw - 32px)); white-space: pre-wrap; color: var(--fg); pointer-events: none; background: #000000c0; padding: 4px 6px; }
  #info .dim { color: var(--dim); }
  #legend { position: fixed; left: 16px; bottom: 16px; width: 260px; pointer-events: none; }
  #legend canvas { position: static; width: 260px; height: 10px; display: block; border: 1px solid var(--faint); }
  #legend .ends { display: flex; justify-content: space-between; color: var(--dim); margin-top: 3px; font-variant-numeric: tabular-nums; }
  #legend .t { color: var(--dim); margin-bottom: 4px; }

<script type="module">
import * as THREE from 'three';
// Climate models, drawn cell by cell from their own CMIP6 output.
// Every cell drawn is one cell of the model's native grid (grid_label "gn"), placed at the corner coordinates
// published in the same file, filled with the one value the model stored for it at that time step.
// Nothing is interpolated, smoothed, regridded or filled in: a cell with no value (NaN, e.g. land in an ocean file)
// is simply not drawn. Frames are the model's own monthly means, shown one after another.
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const TEST = location.hash.includes('test');
const ROLE = location.pathname.includes('display') || Q.has('display') ? 'display' : 'studio';
document.body.classList.add(ROLE);
const DATA = '/climate-models/data/';

const DEF = { model: 'MPI-ESM1-2-LR', organ: 'ocean', exp: 'abrupt-4xCO2', show: 'value', lines: 'on', cmap: 'viridis', view: '3d', fps: 4, relief: 0.1, play: 1, mat: 'lit', ao: 1.5, sun: 0, reach: 1, depth: 0, dir: 'out' };
let S = { ...DEF };
try { Object.assign(S, JSON.parse(localStorage.getItem('climate-models') || '{}')); } catch (e) {}
for (const k of Object.keys(DEF)) if (Q.has(k)) S[k] = typeof DEF[k] === 'number' ? +Q.get(k) : Q.get(k);
if (ROLE === 'display') S.view = '360';
const save = () => { try { localStorage.setItem('climate-models', JSON.stringify(S)); } catch (e) {} };

// ---------- colour maps (visual mapping only; the value → position on the bar is linear between the stated ends) ----------
// polynomial fits of matplotlib's viridis / magma (Matt Zucker, CC0) and Google's Turbo (Anton Mikhailov, Apache-2.0)
const CMAPS = {
  viridis: (t) => { const c0 = [0.2777, 0.0054, 0.334], c1 = [0.105, 1.4046, 1.3846], c2 = [-0.3309, 0.2148, 0.095], c3 = [-4.6342, -5.7991, -19.3324], c4 = [6.2283, 14.1799, 56.6906], c5 = [4.7764, -13.7451, -65.353], c6 = [-5.4355, 4.6459, 26.3124];
    return [0, 1, 2].map((i) => c0[i] + t * (c1[i] + t * (c2[i] + t * (c3[i] + t * (c4[i] + t * (c5[i] + t * c6[i])))))); },
  magma: (t) => { const c0 = [-0.0021, -0.0008, -0.0054], c1 = [0.2516, 0.6775, 2.4940], c2 = [8.3537, -3.5778, 0.3145], c3 = [-27.6687, 14.2647, -13.6492], c4 = [52.1761, -27.9436, 12.9442], c5 = [-50.7685, 29.0466, 4.2341], c6 = [18.6557, -11.4898, -5.6020];
    return [0, 1, 2].map((i) => c0[i] + t * (c1[i] + t * (c2[i] + t * (c3[i] + t * (c4[i] + t * (c5[i] + t * c6[i])))))); },
  turbo: (t) => [0.13572138 + t * (4.6153926 + t * (-42.66032258 + t * (132.13108234 + t * (-152.94239396 + t * 59.28637943)))),
    0.09140261 + t * (2.19418839 + t * (4.84296658 + t * (-14.18503333 + t * (4.27729857 + t * 2.82956604)))),
    0.1066733 + t * (12.64194608 + t * (-60.58204836 + t * (110.36276771 + t * (-89.90310912 + t * 27.34824973))))],
  greys: (t) => [t, t, t],
  white: () => [0.9, 0.9, 0.9], // one material for every value: the reading is left to height and shade
  // for differences: blue (cooler than control) – black (same) – red (warmer)
  diverging: (t) => { const u = t * 2 - 1, a = Math.abs(u); return u < 0 ? [0.25 * a, 0.55 * a, a] : [a, 0.3 * a, 0.15 * a]; },

const lutTex = new THREE.DataTexture(new Uint8Array(256 * 4), 256, 1, THREE.RGBAFormat);

function setLut() {

  for (let i = 0; i < 256; i++) { const c = f(i / 255).map((x) => Math.round(255 * Math.min(1, Math.max(0, x)))); d.set([...c, 255], i * 4); img.data.set([...c, 255], i * 4); }
  lutTex.needsUpdate = true; ctx.putImageData(img, 0, 0);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, preserveDrawingBuffer: TEST });

const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const view = { yaw: 0.6, pitch: 0.35, dist: 4.2 }, ball = { yaw: Math.PI / 2, pitch: 0.12, dist: 4.8 };
let rotLon = 0; // 360 frame: longitude at the centre of the frame

const VW = 2048; // values texture width
const U = { tVal: { value: null }, tLut: { value: lutTex }, uLo: { value: 0 }, uHi: { value: 1 }, uRelief: { value: 0 }, uMode: { value: 0 }, uRot: { value: 0 }, uShift: { value: 0 }, uCol: { value: new THREE.Color(1, 1, 1) }, uAlpha: { value: 1 } };
const COMMON = /* glsl */`
  uniform highp sampler2D tVal; uniform sampler2D tLut; uniform float uLo, uHi, uRelief, uMode, uRot, uShift;
  in vec3 aP;   // 3D: point on the unit sphere · 360: lon (deg, continuous within the cell), lat (deg), the cell's reference lon
  in float aCell;
  float cellValue() { int j = int(aCell + 0.5); return texelFetch(tVal, ivec2(j % ${VW}, j / ${VW}), 0).r; }
  vec4 place(float lift) {

    // 360 (equirectangular): the cell's reference longitude is wrapped into the frame and the rest of the cell
    // follows it; the mesh is drawn three times (shift −360°, 0, +360°) so cells crossing the frame edge stay whole
    float ref = mod(aP.z - uRot + 180.0, 360.0) - 180.0;

  vertexShader: COMMON + `flat out float vT;
    void main() { float v = cellValue(); vT = clamp((v - uLo) / (uHi - uLo), 0.0, 1.0); /* ends are the data's own min/max, so nothing is cut */
      gl_Position = place(uRelief * vT); }`,
  fragmentShader: `uniform sampler2D tLut; flat in float vT; out vec4 o; void main() { o = texture(tLut, vec2((vT * 255.0 + 0.5) / 256.0, 0.5)); }` });

  vertexShader: COMMON + `void main() { float v = uRelief > 0.0 ? cellValue() : uLo; gl_Position = place(uRelief * clamp((v - uLo) / (uHi - uLo), 0.0, 1.0) + 0.0008); }`,
  fragmentShader: `uniform vec3 uCol; uniform float uAlpha; out vec4 o; void main() { o = vec4(uCol, uAlpha); }` });

// Lit: the cells' values become heights in a separate image of the 360 frame (one value per pixel, the value of
// the cell that covers it, no anti-aliasing so no two cells are ever mixed). A second pass lights that height
// field the way an even, all-round sky would (no sun direction): a surface tilted away from straight up sees less
// sky, and a cell lower than its surroundings is shaded by them (ambient occlusion). Steps between neighbouring
// cells therefore read as seams, larger steps as deeper ones. Optional Sun adds one directional light.
const hMat = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, uniforms: U, side: THREE.DoubleSide,
  vertexShader: COMMON + `flat out float vT; void main() { float v = cellValue(); vT = clamp((v - uLo) / (uHi - uLo), 0.0, 1.0); gl_Position = place(0.0); }`,
  fragmentShader: `flat in float vT; out vec4 o; void main() { o = vec4(vT, 0.0, 0.0, 1.0); }`,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, depthTest: false, depthWrite: false }); // r = sum of colour positions, a = how many models cover the point
const hRT = new THREE.WebGLRenderTarget(1920, 1080, { type: renderer.extensions.has('EXT_float_blend') ? THREE.FloatType : THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, samples: 0, depthBuffer: false });

const SU = { tH: { value: hRT.texture }, tLut: { value: lutTex }, uRelief: { value: 0.03 }, uAO: { value: 1 }, uSun: { value: 0 }, uRes: { value: new THREE.Vector2(1920, 1080) }, uRot: U.uRot, uFlatShade: { value: 0 }, uReach: { value: 1 }, uDepth: { value: 0 }, uDir: { value: 1 } };
const SHADE = /* glsl */`
  uniform sampler2D tH, tLut; uniform float uRelief, uAO, uSun, uRot; uniform vec2 uRes; varying vec2 vUv;
  uniform float uFlatShade, uReach, uDepth, uDir;

  vec2 hAt(vec2 uv) { float t = tAt(uv); return t >= 0.0 ? vec2(uDir * t * uRelief, 1.0) : vec2(0.0); }
  void main() {
    vec2 c = hAt(vUv); if (c.y < 0.5) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
    float lat = (vUv.y - 0.5) * 3.14159265, cl = max(cos(lat), 0.02);
    vec2 px = 1.0 / uRes; float dx = 6.2831853 / uRes.x * cl, dy = 3.14159265 / uRes.y; // one pixel, in radians on the sphere
    vec2 hl = hAt(vUv - vec2(px.x, 0.0)), hr = hAt(vUv + vec2(px.x, 0.0)), hd = hAt(vUv - vec2(0.0, px.y)), hu = hAt(vUv + vec2(0.0, px.y));
    float l = hl.y > 0.5 ? hl.x : c.x, r = hr.y > 0.5 ? hr.x : c.x, d = hd.y > 0.5 ? hd.x : c.x, u = hu.y > 0.5 ? hu.x : c.x;
    vec3 n = normalize(vec3(-(r - l) / (2.0 * dx), -(u - d) / (2.0 * dy), 1.0)); // east, north, up
    float sky = 0.5 + 0.5 * n.z; // share of an even sky a surface with this tilt sees
    // ambient occlusion: how much the surroundings rise above this cell, in 12 directions × 4 distances
    float occ = 0.0, cnt = 0.0;
    for (int i = 0; i < 12; i++) { float a = float(i) * 0.5235988; vec2 dir = vec2(cos(a) / cl, sin(a));

        if (s.y > 0.5) { float dist = rpx * dy; occ += max(0.0, (s.x - c.x) / sqrt((s.x - c.x) * (s.x - c.x) + dist * dist)); cnt += 1.0; } } }
    float ao = clamp(1.0 - uAO * occ / max(cnt, 1.0) * 2.0, 0.0, 1.0);

    float lon = (vUv.x - 0.5) * 6.2831853 + radians(uRot);
    vec3 up = vec3(cos(lat) * sin(lon), sin(lat), cos(lat) * cos(lon)), east = vec3(cos(lon), 0.0, -sin(lon)), north = cross(up, east);
    vec3 nw = normalize(east * n.x + north * n.y + up * n.z);
    float sun = max(0.0, dot(nw, normalize(vec3(0.6, 0.5, 0.62))));
    float shade = mix(mix(sky * ao, sky * ao * 0.35 + sun * 0.9, uSun), 1.0, uFlatShade);
    float t = tAt(vUv); vec3 col = texture2D(tLut, vec2((t * 255.0 + 0.5) / 256.0, 0.5)).rgb;
    // depth shade: the lower a point sits (raised: lower value; carved: higher value), the darker, like the floor of a pit
    float hn = uDir > 0.0 ? t : 1.0 - t;
    shade *= mix(1.0, 0.04 + 0.96 * hn * hn, uDepth * (1.0 - uFlatShade));
    gl_FragColor = vec4(col * shade, 1.0);
  }`;
const shadeScene = new THREE.Scene();

// ---------- data ----------
let INDEX = null; const cache = {};
async function bin(url) {

  let b = new Uint8Array(await r.arrayBuffer());
  if (b[0] === 0x1f && b[1] === 0x8b) b = new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  return b;
}
const unshuffle = (b) => { const n = b.length / 4, o = new Uint8Array(b.length); for (let k = 0; k < 4; k++) { const off = k * n; for (let i = 0; i < n; i++) o[i * 4 + k] = b[off + i]; } return new Float32Array(o.buffer); };
async function loadMeta(m) { return cache[m + ':meta'] ||= fetch(DATA + m + '/meta.json').then((r) => r.json()); }
async function loadGrid(m, v) { return cache[m + ':' + v + ':grid'] ||= bin(DATA + m + '/' + v + '_grid.bin').then((b) => new Float32Array(b.buffer)); }
async function loadVals(m, v, e) { return cache[m + ':' + v + ':' + e] ||= bin(DATA + m + '/' + v + '_' + e + '.bin').then(unshuffle); }

// cells → triangles. A cell is the polygon through its published corners. Its edges are split into short
// steps along the sphere (between neighbouring corners) only so that long edges follow the globe's curve; the
// whole cell gets the cell's one value. A cell around a pole (its corners circle the pole) is drawn in the 360
// frame as the strip from its edge up to the pole, which is where it lies on the map.
const D2R = Math.PI / 180;
const xyz = (lon, lat) => [Math.cos(lat * D2R) * Math.sin(lon * D2R), Math.sin(lat * D2R), Math.cos(lat * D2R) * Math.cos(lon * D2R)];
const nrm = (v) => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };

const wrap = (d) => ((d % 360) + 540) % 360 - 180;

// a "layer" = one organ of one model: its mesh, its values, its outline
const layers = {}; let current = null, structure = null, loadMsg = '', loadErr = '';
function makeMeshes(geo, colour, withFill = true, L = null) {

  for (const sh of [-360, 0, 360]) { if (withFill) g360.add(mk(geo.fill2, fillMat, sh)); g360.add(mk(geo.line2, lineMat, sh, true)); }
  const all = [...g3.children, ...g360.children];

async function layer(m, organ) {

  const grid = await loadGrid(m, o.variable);

// All 4: every model's own cells are drawn over the same globe at once, with no regridding. In the height image

const ALL = 'ALL';
let agg = null; // layers drawn together (one, or all models)
const modelIds = () => INDEX.models.map((m) => m.source_id);
async function withValues(L) {

}
async function select() {

        a.smeshes ||= makeMeshes(a.geo, new THREE.Color(1, 1, 1), false); o.smeshes ||= makeMeshes(o.geo, new THREE.Color(0.35, 0.85, 1), false); out.push(a, o); }

}
const g3root = new THREE.Group(), g360root = new THREE.Group(); scene.add(g3root);
// 3D only: a black ball just under the cells, so the far side of the globe doesn't show through where no cell is drawn
scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.997, 128, 64), new THREE.MeshBasicMaterial({ color: 0x000000 })));
const eqScene = new THREE.Scene(); eqScene.add(g360root);
function mount() {

const frames = () => agg ? Math.min(...agg.map((L) => L.o.frames)) : 1;
let frame = 0, acc = 0;

// ---------- 360 frame and the LED-sphere preview ----------
const eqRT = new THREE.WebGLRenderTarget(1920, 1080, { samples: 4 });

// ---------- panel ----------
const SEGS = [['model', 'Model', () => [...INDEX.models.map((m) => [m.source_id, m.source_id]), [ALL, 'All 4 together']]], ['organ', 'Organ', () => [['atmosphere', 'Atmosphere'], ['ocean', 'Ocean'], ['structure', 'Both grids']]],
  ['exp', 'Experiment', () => [['piControl', 'piControl'], ['abrupt-4xCO2', 'abrupt-4xCO2']]], ['show', 'Show', () => [['value', 'Value'], ['change', '4×CO₂ − control']]],

    <div class="row"><label>Relief</label><input type="range" id="rel" min="0" max="4" step="0.01"><output id="relo"></output></div>
    <div class="row"><label>Occlusion</label><input type="range" id="ao" min="0" max="3" step="0.05"><output id="aoo"></output></div>

    <div class="row"><label></label><div class="seg"><button id="play" class="b">Pause</button><button id="copy" class="b">Copy display URL</button><button id="reset" class="b">Defaults</button></div></div>
    <div class="note">Each cell is one cell of the model's own grid, at the corners stored in its CMIP6 file, filled with the one value the model saved for it that month. Nothing is interpolated, smoothed, regridded or filled in. Cells without a value are not drawn (black).

  $('fr').oninput = (e) => { frame = +e.target.value; S.play = 0; upload(); panelSync(); };
  $('fps').oninput = (e) => { S.fps = +e.target.value; save(); panelSync(); };
  $('rel').oninput = (e) => { S.relief = +e.target.value; save(); panelSync(); };
  $('ao').oninput = (e) => { S.ao = +e.target.value; save(); panelSync(); };
  $('reach').oninput = (e) => { S.reach = +e.target.value; save(); panelSync(); };
  $('depth').oninput = (e) => { S.depth = +e.target.value; save(); panelSync(); };
  $('sun').oninput = (e) => { S.sun = +e.target.value; save(); panelSync(); };
  $('play').onclick = () => { S.play = S.play ? 0 : 1; save(); panelSync(); };
  $('reset').onclick = () => { S = { ...DEF }; save(); panelSync(); setLut(); select(); };

function panelSync() {

addEventListener('resize', resize); resize();

// ---------- frame loop ----------
let last = performance.now();
function tick(now) {

}
function render() {

}
const fmt = (x) => Math.abs(x) >= 100 ? x.toFixed(1) : x.toFixed(2);

if (TEST) window.__cm = { S, render, select, setFrame: (f) => { frame = f; upload(); }, setView: (v) => { S.view = v; resize(); }, view, state: () => ({ loadMsg, loadErr, frame, current: current && current.m + ':' + current.organ }) };
(async () => {
