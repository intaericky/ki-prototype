eqKey.position.set(-0.4, 0.5, 1); // in each piece's own frame: up-left of straight down

  vertexShader: `varying vec3 vN, vV; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vN = normalize(position); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix * viewMatrix * w; }`,

const SHAPES = {

      if (Number.isFinite(d.gen) && Array.isArray(d.list) && d.gen >= gen) {
        const mine = d.gen === gen && cleaned.size > 0; // same round: keep the union
        if (d.gen > gen) resetRound(d.gen);
        for (const e of d.list) if (Array.isArray(e) && e.length >= 2 && e.every(Number.isFinite)) markCleaned(e[0], e[1] - 1, e[2]); // no shrink animation for old ones
        if (mine && cleaned.size > d.list.length && ROLE !== 'display') { clearTimeout(snapT); snapT = setTimeout(sendSnapshot, 500); }
      }
    } else if (k === '/back') {

    } else if (k === '/look') {

}).catch(() => {});

// the tablet's view sets the LED frame (the point facing the viewer becomes the frame centre)
let camQ = null, lookDirty = false, adopt = false;
// another page turned the sphere: the 3D / lines camera turns to look at the same point (and doesn't send it back)
function followLook() { if (S.view !== '3d' && S.view !== 'lines') return; const v = new THREE.Vector3(1, 0, 0).applyQuaternion(rot360); view.yaw = Math.atan2(v.x, v.z); view.pitch = Math.asin(Math.max(-1, Math.min(1, v.y))); adopt = true; }

  const v = camera.position.clone().normalize(), up = camera.up.clone().applyQuaternion(camera.quaternion).normalize(), z = new THREE.Vector3().crossVectors(v, up);
  const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(v, up, z));
  if (!camQ || adopt) { camQ = q.clone(); adopt = false; if (ROLE === 'tablet' && !lookT) { rot360.copy(q); lookDirty = true; } else return; }
  if (q.angleTo(camQ) > 1e-4) { camQ.copy(q); rot360.copy(q); lookDirty = true; }
  if (lookDirty && performance.now() - lookT >= 50) { lookDirty = false; sendLook(true); }
}

// ---------- panel (studio) ----------
const SL = [['size', 'Size', 0, 100, () => fmtX(MULT())], ['seg', 'Detail', 3, 64, () => S.seg + ''], ['rough', 'Roughness', 0, 100, () => (S.rough / 100).toFixed(2)], ['metal', 'Metalness', 0, 100, () => (S.metal / 100).toFixed(2)], ['key', 'Key light', 0, 600, () => (S.key / 100).toFixed(1)], ['amb', 'Ambient', 0, 300, () => (S.amb / 100).toFixed(1)], ['tumble', 'Tumble', 0, 300, () => S.tumble + ''], ['ret', 'Comes back', 5, 600, () => RETURN() + ' s'], ['casc', 'Cascade', 0, 95, () => S.casc ? '×' + CASC().toFixed(2) : 'off'], ['reach', 'Reach', 100, 5000, () => S.reach.toLocaleString() + ' km'], ['spd', 'Speed', 0, 100, () => SPEED().toLocaleString() + '×'], ['q360', '360 detail', 50, 200, () => Math.round(1920 * S.q360 / 100) + ' px']];
const SHAPE_ROWS = [[['sphere', 'Sphere'], ['box', 'Box'], ['cylinder', 'Cylinder'], ['cone', 'Cone']], [['torus', 'Torus'], ['octahedron', 'Octa'], ['icosahedron', 'Icosa'], ['tetrahedron', 'Tetra']]];
const SEG = [['view', 'View', [['3d', '3D'], ['lines', 'Lines'], ['360', '360'], ['ball', 'Sphere']]], ...SHAPE_ROWS.map((o, i) => ['shape', i ? '' : 'Shape', o]), ['light', 'Earth', [['day', 'All day'], ['sun', 'Sun now'], ['solid', 'Solid'], ['lit', 'Solid lit']]],
  ['rcs', 'Size by', [['1', 'Radar (capped)'], ['exact', 'Radar (exact)'], ['0', 'Same']]], ['range', 'Debris', [['all', 'All'], ['leo', 'Below 2,000 km']]], ['flash', 'Return glow', [['1', 'On'], ['0', 'Off']]]];
function panelBuild() {
  $('panel').innerHTML = SEG.map(([k, l, o]) => `<div class="row"><label>${l}</label><div class="seg" data-k="${k}">${o.map(([v, t]) => `<button data-v="${v}">${t}</button>`).join('')}</div></div>`).join('')
    + `<div class="row"><label>Colour of</label><div class="seg" data-k="pick"><button data-v="deb">Debris</button><button data-v="earth">Earth</button></div></div>`
    + `<div class="row"><label>Colour</label><div class="cp">
      <div id="sv" class="sv"><div class="svw"></div><div class="svb"></div><i id="svk"></i></div>
      <div id="hu" class="hu"><i id="huk"></i></div>
      <div class="cprow"><span id="sw"></span><input type="text" id="hex" spellcheck="false"></div></div></div>`
    + SL.map(([k, l, a, b]) => `<div class="row"><label>${l}</label><input type="range" data-k="${k}" min="${a}" max="${b}" step="1"><output data-o="${k}"></output></div>`).join('')
    + `
    <div class="row"><label></label><div class="seg"><button id="again">Put all debris back</button></div></div>
    <div class="row"><label></label><div class="seg"><button id="now">Back to now</button><button id="reset">Reset settings</button></div></div>
    <div class="row"><label></label><div class="seg"><button id="copy">Copy display URL</button></div></div>
    <div class="note">Only debris: every object still in orbit that the US Space Force catalogue (via CelesTrak SATCAT) types as debris, at its real position now. Each piece is shown ×N bigger than it really is (its radius from its radar cross-section), so together they cover the Earth. Everything here (except View and Speed, which has its own shared clock) applies live to the tablet and the display in the same room. A tap cleans one piece. The catalogue still has it, so after a while (Comes back, ±30%) it returns. Each return is a small Kessler cascade: every cleaned piece within Reach of it has its time left multiplied by Cascade, so returns clump together and speed up. Cleaned pieces and returns are shared with everyone in the room. Size by: Radar (capped) keeps each piece between 0.5× and 2.5× of the median debris so a few big ones don't swallow the view; Radar (exact) keeps the true proportions; Same makes every piece the median size. Pieces with no published radar size get the median.</div>`;
  $('panel').querySelectorAll('.seg[data-k] button').forEach((b) => b.onclick = () => { const k = b.parentNode.dataset.k; S[k] = b.dataset.v; if (k === 'rcs') reweight();
    save(); panelSync(); resize(); });
  $('panel').querySelectorAll('input[data-k]').forEach((r) => r.oninput = () => { const k = r.dataset.k, was = SPEED(); S[k] = +r.value; if (k === 'spd' && SPEED() !== was) { simT = simNow(); clock = null; sendClock(); } save(); panelSync(); });
  $('hex').onchange = (e) => { const v = e.target.value.trim().replace('#', ''); if (/^[0-9a-f]{6}$/i.test(v)) { const c = parseInt(v, 16); { const [a, b, c2] = PK(); [S[a], S[b], S[c2]] = rgbHsv((c >> 16 & 255) / 255, (c >> 8 & 255) / 255, (c & 255) / 255); } save(); } panelSync(); };
  const drag = (el, fn) => { el.onpointerdown = (e) => { el.setPointerCapture(e.pointerId); fn(e); el.onpointermove = (ev) => fn(ev); }; el.onpointerup = el.onpointercancel = () => { el.onpointermove = null; save(); }; };
  const frac = (e, el) => { const b = el.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - b.left) / b.width)), Math.min(1, Math.max(0, (e.clientY - b.top) / b.height))]; };
  drag($('sv'), (e) => { const [x, y] = frac(e, $('sv')); const [, b, c] = PK(); S[b] = Math.round(x * 100); S[c] = Math.round((1 - y) * 100); panelSync(); });
  drag($('hu'), (e) => { S[PK()[0]] = Math.round(frac(e, $('hu'))[0] * 360); panelSync(); });
  $('again').onclick = startOver;
  $('now').onclick = () => { simT = Date.now(); S.spd = 0; clock = null; sendClock(); save(); panelSync(); };
  $('copy').onclick = () => {
    const q = new URLSearchParams(); for (const k of Object.keys(DEF)) if (k !== 'view' && String(S[k]) !== String(DEF[k])) q.set(k, S[k]);
    if (ROOM) q.set('room', ROOM);
    const url = location.origin + '/cleanup-display' + (q.toString() ? '?' + q : '');
    navigator.clipboard?.writeText(url).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => { $('copy').textContent = 'Copy display URL'; }, 1500); }, () => { $('copy').textContent = url; });
  };
  $('reset').onclick = () => { S = { ...DEF }; reweight(); save(); panelSync(); resize(); };
}
function panelSync() {
  document.querySelectorAll('.seg[data-k]').forEach((s) => s.querySelectorAll('button').forEach((b) => b.classList.toggle('on', String(S[s.dataset.k]) === b.dataset.v)));
  for (const [k, , , , f] of SL) { const r = document.querySelector(`input[data-k="${k}"]`); if (r) r.value = S[k]; const o = document.querySelector(`output[data-o="${k}"]`); if (o) o.textContent = f(); }
  const [kh, ks, kv] = PK(), hex = '#' + PCOL().getHexString(); if ($('hex') && document.activeElement !== $('hex')) $('hex').value = hex.toUpperCase();
  if ($('sw')) { $('sw').style.background = hex; $('sv').style.background = `hsl(${S[kh]}, 100%, 50%)`; $('svk').style.left = S[ks] + '%'; $('svk').style.top = (100 - S[kv]) + '%'; $('svk').style.background = hex; $('huk').style.left = S[kh] / 3.6 + '%'; }
}
$('toggle').onclick = () => { $('panel').classList.toggle('on'); $('toggle').classList.toggle('on'); };
panelBuild(); panelSync();

// ---------- sizing ----------
const PR_MAX = ROLE === 'display' ? 1 : Math.min(devicePixelRatio || 1, 2);
function resize() {
  renderer.setPixelRatio(PR_MAX); renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  ballCam.aspect = innerWidth / innerHeight; ballCam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- frame ----------
let last = performance.now(), fps = 60;
const simNow = () => clock ? clock.sim0 + (Date.now() - clock.wall0) * clock.speed : simT;
function frame(now) {
  if (!TEST) requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now; fps = fps * 0.95 + 0.05 / Math.max(dt, 1e-3);
  simT = clock ? simNow() : simT + dt * 1000 * SPEED();
  render();
}
function render() {
  if (loaded && Math.abs(simT - T0) > 432e5) { T0 = simT; build(); }
  tickReturns();
  if (loaded) update();
  const rot = -ORB.gmst(simT);
  U.uLight.value = S.light === 'sun' ? 1 : S.light === 'solid' || S.light === 'lit' ? 2 : 0; U.uEarthC.value.copy(EHSV()); earthMat.color.copy(EHSV()).convertSRGBToLinear();
  U.uTime.value = performance.now() / 1000; U.uWall.value = wallS() - P0; U.uFlash.value = S.flash === '0' ? 0 : 1; U.tSt.value = stTex; U.uTumble.value = S.tumble / 100; applyShape();
  for (const m of pieceMats) { m.color.copy(HSL()).convertSRGBToLinear(); /* picked colour is sRGB; the output is encoded back to sRGB, so it shows as picked */ m.roughness = S.rough / 100; m.metalness = S.metal / 100; }
  keyLight.intensity = eqKey.intensity = S.key / 100; ambLight.intensity = eqAmb.intensity = S.amb / 100;
  const se = sunEci(simT), cr = Math.cos(rot), sr = Math.sin(rot);
  U.uSun.value.set(cr * se[0] - sr * se[1], se[2], -(sr * se[0] + cr * se[1]));

  const v = S.view;
  if (v === '3d' || v === 'lines') {
    const ln = v === 'lines';
    earth.visible = !ln && S.light !== 'lit'; earthLit.visible = !ln && S.light === 'lit'; earthBlack.visible = earthLine.visible = ln;
    if (meshes.piece) { meshes.piece.visible = !ln; meshes.lines.visible = ln; }
    linesMat.uniforms.uPxK.value = 2 * Math.tan(camera.fov / 2 * D2R) / (innerHeight * renderer.getPixelRatio());
    camera.position.set(Math.cos(view.pitch) * Math.sin(view.yaw), Math.sin(view.pitch), Math.cos(view.pitch) * Math.cos(view.yaw)).multiplyScalar(view.dist);
    camera.lookAt(0, 0, 0);
    camera.near = Math.max(5, (view.dist - RE - 2500) * 0.3); camera.far = view.dist + 60000; camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    // light from over the viewer's shoulder
    keyLight.position.copy(camera.position).normalize().addScaledVector(new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion), 0.6).addScaledVector(new THREE.Vector3(-1, 0, 0).applyQuaternion(camera.quaternion), 0.4).normalize().multiplyScalar(1e5);
    lookFromCamera();
    renderer.setRenderTarget(null); renderer.render(scene, camera);
  } else {
    rot360M.setFromMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(rot360)); rot360T.copy(rot360M).transpose();
    const qs = S.q360 / 100, ew = Math.round(1920 * qs), eh = Math.round(1080 * qs);
    if (eqRT.width !== ew) eqRT.setSize(ew, eh);
    U.uRes.value.set(ew, eh);
    renderer.setRenderTarget(eqRT); renderer.clear(); renderer.render(eqScene, eqCam);
    renderer.setRenderTarget(null);
    if (v === '360') renderer.render(blitScene, eqCam);
    else {
      ballCam.position.set(Math.cos(ball.pitch) * Math.sin(ball.yaw), Math.sin(ball.pitch), Math.cos(ball.pitch) * Math.cos(ball.yaw)).multiplyScalar(ball.dist);
      ballCam.lookAt(0, 0, 0); renderer.setClearColor(0x050505, 1); renderer.clear(); renderer.render(ballScene, ballCam); renderer.setClearColor(0x000000, 1);
    }
  }

}
function info() {
  const el = $('info');
  if (!loaded) { el.innerHTML = meta.errors.length ? '<span class="err">Could not load the debris catalogue. Nothing is shown (no stand-in data).</span>' : 'Loading the debris catalogue…'; return; }
  const left = objs.length - cleaned.size, d = new Date(simT), live = Math.abs(simT - Date.now()) < 5000;
  el.textContent = ROLE === 'tablet' ? `${left.toLocaleString()}`
    : `${left.toLocaleString()} pieces of debris · ${cleaned.size.toLocaleString()} cleaned · ${nBack.toLocaleString()} came back\n${live ? 'now' : d.toISOString().slice(0, 16).replace('T', ' ') + ' UTC'} · ${SPEED().toLocaleString()}× · ${fps.toFixed(0)} fps${ROOM ? ' · room ' + ROOM : ''}`;
}

if (TEST) window.__cl = { ingest, render, tap, S, view, rot360, setSim: (t) => { simT = t; }, pick, objs: () => objs, cleaned, markCleaned, comeBack, tickReturns, setView: (k) => { S.view = k; resize(); }, startOver };
load();
requestAnimationFrame(frame);
</script>
