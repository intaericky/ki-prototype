<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cleanup</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --fg: #fff; --dim: #ffffff73; --faint: #ffffff2e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 13px/1.45 Pretendard, -apple-system, sans-serif; font-weight: 400; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #info { position: fixed; left: 20px; bottom: 16px; color: var(--dim); font-variant-numeric: tabular-nums; pointer-events: none; white-space: pre; }
  #toggle { position: fixed; top: 16px; right: 16px; background: none; border: 1px solid var(--faint); color: var(--dim); font: inherit; padding: 6px 12px; border-radius: 0; cursor: pointer; }
  #toggle.on { color: var(--fg); border-color: var(--fg); }
  #panel { position: fixed; top: 56px; right: 16px; width: 300px; max-height: calc(100vh - 80px); overflow: auto; background: #000000d9; border: 1px solid var(--faint); padding: 14px 16px; display: none; }
  #panel.on { display: block; }
  .row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { color: var(--dim); }
  .row output { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .seg { grid-column: 2 / 4; display: flex; gap: 0; }
  .seg button { flex: 1; background: none; color: var(--dim); border: 1px solid var(--faint); margin-left: -1px; padding: 4px 0; font: inherit; cursor: pointer; }
  .seg button.on { color: #000; background: var(--fg); border-color: var(--fg); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; background: none; height: 18px; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--dim); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #000; border: 1px solid var(--fg); margin-top: -5px; }
  input[type=range]::-moz-range-track { height: 1px; background: var(--dim); }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #000; border: 1px solid var(--fg); }
  input[type=color] { grid-column: 2 / 4; width: 100%; height: 22px; padding: 0; border: 1px solid var(--faint); background: none; }
  .note { color: var(--dim); font-size: 12px; margin-top: 12px; line-height: 1.5; }
  .err { color: #fff; }
  body.display #toggle, body.display #panel, body.display #info { display: none; }
  body.tablet #toggle { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"></div>
<button id="toggle">Settings</button>
<div id="panel"></div>
<script type="importmap">{ "imports": { "three": "/sphere-assets/vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import * as ORB from '/entangled/orbit.js';
const { RE, D2R, TAU } = ORB;
THREE.ColorManagement.enabled = false;

// Cleanup: the opposite of Refraction. Only real debris (SATCAT object type DEB), every piece still in orbit, at its
// real position now, made big enough that together they cover the Earth. A tap removes one piece for good.
const Q = new URLSearchParams(location.search);
const ROLE = location.pathname.includes('display') || Q.has('display') ? 'display' : location.pathname.includes('tablet') || Q.has('tablet') ? 'tablet' : 'studio';
document.body.classList.add(ROLE);
const TEST = location.hash.includes('test');
const $ = (id) => document.getElementById(id);

// ---------- settings ----------
const DEF = { view: '3d', size: 84, rcs: '1', tumble: 20, color: '#c8c8c8', light: 'day', range: 'all', spd: 0, q360: 100 };
let S = { ...DEF };
const KEY = 'cleanup-v1';
if (ROLE === 'studio' && !TEST) try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
for (const k of Object.keys(DEF)) if (Q.has(k)) S[k] = typeof DEF[k] === 'number' ? +Q.get(k) : Q.get(k);
if (ROLE === 'display') S.view = '360';
if (ROLE === 'tablet' && !Q.has('view')) S.view = '3d';
const save = () => { if (ROLE === 'studio' && !TEST) try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const SIZE_KM = () => 5 * Math.pow(100, S.size / 100); // piece size: 5 .. 500 km
const SPEED = () => Math.round(Math.pow(10, S.spd / 25)); // 1× .. 10,000×

// ---------- renderer ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: TEST });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 10, 500000);
const view = { yaw: 0.4, pitch: 0.3, dist: 30000 };
const rot360 = new THREE.Quaternion();
const rot360M = new THREE.Matrix3(), rot360T = new THREE.Matrix3();
const ball = { yaw: Math.PI / 2, pitch: 0.12, dist: 4.8 };

const tl = new THREE.TextureLoader();
const tex = (u) => { const t = tl.load(u); t.wrapS = THREE.RepeatWrapping; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 4; return t; };
const tDay = tex('/sphere-assets/bluemarble-4k.jpg'), tNight = tex('/sphere-assets/blackmarble-4k.jpg'); // NASA Blue Marble / Black Marble

// ---------- shared GLSL ----------
const NOBJ_W = 1024;
const U = {
  tObj: { value: null }, tDay: { value: tDay }, tNight: { value: tNight }, uSun: { value: new THREE.Vector3(1, 0, 0) }, uLight: { value: 0 },
  uTime: { value: 0 }, uTumble: { value: 0.2 }, uColor: { value: new THREE.Color(0xc8c8c8) }, uLightDir: { value: new THREE.Vector3(0, 1, 0) },
  uRotM: { value: rot360M }, uRotT: { value: rot360T }, uRes: { value: new THREE.Vector2(1920, 1080) },
};
const EARTH = /* glsl */`
  uniform sampler2D tDay, tNight; uniform vec3 uSun; uniform float uLight;
  vec3 surface(vec3 n) {
    vec3 e = vec3(n.x, -n.z, n.y);
    vec2 uv = vec2(atan(e.y, e.x) / 6.2831853 + 0.5, asin(clamp(e.z, -1.0, 1.0)) / 3.1415927 + 0.5);
    vec3 day = texture2D(tDay, uv).rgb;
    if (uLight < 0.5) return day;
    vec3 night = texture2D(tNight, uv).rgb;
    return mix(night * 0.7, day, smoothstep(-0.08, 0.12, dot(n, uSun)));
  }`;
// one piece of debris: an irregular shard at the object's position (xyz km, w = size; 0 = gone), turned and flattened
// differently for every object, slowly tumbling
const PIECE = /* glsl */`
  uniform highp sampler2D tObj; uniform float uTime, uTumble;
  vec4 obj(int j) { return texelFetch(tObj, ivec2(j & ${NOBJ_W - 1}, j >> ${Math.log2(NOBJ_W)}), 0); }
  float h1(uint x) { x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return float(x) / 4294967295.0; }
  mat3 axisRot(vec3 a, float t) { float c = cos(t), s = sin(t), k = 1.0 - c;
    return mat3(c + a.x*a.x*k, a.y*a.x*k + a.z*s, a.z*a.x*k - a.y*s, a.x*a.y*k - a.z*s, c + a.y*a.y*k, a.z*a.y*k + a.x*s, a.x*a.z*k + a.y*s, a.y*a.z*k - a.x*s, c + a.z*a.z*k); }
  bool piece(int id, out vec3 C, out vec3 W, out float shade) {
    vec4 o = obj(id); C = o.xyz; float r = o.w;
    if (r <= 0.0) return false;
    uint u = uint(id) * 2654435761u + 1013904223u;
    vec3 ax = normalize(vec3(h1(u), h1(u + 1u), h1(u + 2u)) * 2.0 - 1.0 + 1e-4);
    float sp = (h1(u + 3u) - 0.5) * 2.0 * uTumble;
    vec3 sc = vec3(1.0, 0.45 + 0.5 * h1(u + 4u), 0.18 + 0.35 * h1(u + 5u));
    W = C + axisRot(ax, h1(u + 6u) * 6.2831853 + uTime * sp) * (position * sc) * r;
    shade = 0.72 + 0.28 * h1(u + 7u);
    return true;
  }
`;

// --- perspective view ---
const pieceVert = /* glsl */`${PIECE}
  varying vec3 vW; varying float vShade;
  void main() {
    vec3 C, W; float sh;
    if (!piece(gl_InstanceID, C, W, sh)) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    vW = W; vShade = sh;
    gl_Position = projectionMatrix * viewMatrix * vec4(W, 1.0);
  }`;
const pieceFrag = /* glsl */`
  uniform vec3 uColor, uLightDir;
  varying vec3 vW; varying float vShade;
  vec3 lit(vec3 W, vec3 toEye, vec3 L, float shade, vec3 col) {
    vec3 n = normalize(cross(dFdx(W), dFdy(W)));
    if (dot(n, toEye) < 0.0) n = -n;
    return col * shade * (0.35 + 0.65 * max(dot(n, L), 0.0));
  }
  void main() { gl_FragColor = vec4(lit(vW, cameraPosition - vW, uLightDir, vShade, uColor), 1.0); }`;

// --- the LED sphere's 360 frame: each pixel is a point on the sphere seen straight from above (outside). The Earth
// image is the background; each piece's vertices are placed by their direction from Earth's centre, and the piece
// higher up (nearer the viewer outside) wins. ---
const eqVert = /* glsl */`${PIECE}
  uniform mat3 uRotT; uniform float uShift;
  varying vec3 vW; varying float vShade;
  void main() {
    vec3 C, W; float sh;
    if (!piece(gl_InstanceID, C, W, sh)) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    vec3 d0 = uRotT * normalize(C), d = uRotT * normalize(W);
    float lo0 = atan(-d0.z, d0.x), lo = atan(-d.z, d.x), la = asin(clamp(d.y, -1.0, 1.0));
    lo = lo0 + mod(lo - lo0 + 3.1415927, 6.2831853) - 3.1415927; // keep the piece in one piece across the seam
    vW = W; vShade = sh;
    gl_Position = vec4(lo / 3.1415927 + uShift * 2.0, la / 1.5707963, clamp(1.0 - 2.0 * (length(W) - 6000.0) / 5.0e5, -1.0, 1.0), 1.0);
  }`;
const eqFrag = /* glsl */`
  uniform vec3 uColor;
  varying vec3 vW; varying float vShade;
  void main() {
    vec3 up = normalize(vW);
    vec3 n = normalize(cross(dFdx(vW), dFdy(vW)));
    if (dot(n, up) < 0.0) n = -n;
    vec3 L = normalize(up + 0.6 * normalize(cross(up, vec3(0.3, 1.0, 0.2))));
    gl_FragColor = vec4(uColor * vShade * (0.35 + 0.65 * max(dot(n, L), 0.0)), 1.0);
  }`;
const eqEarthFrag = /* glsl */`${EARTH}
  uniform mat3 uRotM; uniform vec2 uRes;
  void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    float lo = (uv.x - 0.5) * 6.2831853, la = (uv.y - 0.5) * 3.1415927;
    gl_FragColor = vec4(surface(uRotM * vec3(cos(la) * cos(lo), sin(la), -cos(la) * sin(lo))), 1.0);
  }`;

const mk = (v, f, extra = {}) => new THREE.ShaderMaterial({ uniforms: { ...U, ...extra }, vertexShader: v, fragmentShader: f });
const pieceMat = mk(pieceVert, pieceFrag);
const eqMats = [-1, 0, 1].map((k) => mk(eqVert, eqFrag, { uShift: { value: k } }));

// Earth (the image under the debris)
const earth = new THREE.Mesh(new THREE.SphereGeometry(RE, 128, 64), mk(
  `varying vec3 vN; void main(){ vN = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  `${EARTH} varying vec3 vN; void main(){ gl_FragColor = vec4(surface(normalize(vN)), 1.0); }`));
scene.add(earth);

// the 360 frame is drawn into its own image (1920 × 1080), then shown flat or wrapped back onto a ball
const eqRT = new THREE.WebGLRenderTarget(1920, 1080, { depthBuffer: true, samples: 4 });
const eqScene = new THREE.Scene(), eqCam = new THREE.Camera();
const eqEarth = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ uniforms: U, depthTest: false, depthWrite: false,
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 1.0, 1.0); }`, fragmentShader: eqEarthFrag }));
eqEarth.frustumCulled = false; eqEarth.renderOrder = -1; eqScene.add(eqEarth);
const blitScene = new THREE.Scene(), ballScene = new THREE.Scene();
const blit = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ uniforms: { tFrame: { value: eqRT.texture } }, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `uniform sampler2D tFrame; varying vec2 vUv; void main(){ gl_FragColor = texture2D(tFrame, vUv); }` }));
blit.frustumCulled = false; blitScene.add(blit);
const ballCam = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
ballScene.add(new THREE.Mesh(new THREE.SphereGeometry(1, 192, 96), new THREE.ShaderMaterial({ uniforms: { tFrame: { value: eqRT.texture } },
  vertexShader: `varying vec3 vN; void main(){ vN = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tFrame; varying vec3 vN;
    void main(){ vec3 n = normalize(vN); float lo = atan(-n.z, n.x), la = asin(clamp(n.y, -1.0, 1.0));
      gl_FragColor = texture2D(tFrame, vec2(lo / 6.2831853 + 0.5, la / 3.1415927 + 0.5)); }` })));

// the shard: an icosahedron with its corners pushed in and out (the same shape for every piece; each piece is
// turned and squashed differently)
const shard = (() => {
  const g = new THREE.IcosahedronGeometry(1, 0), p = g.attributes.position, seen = new Map();
  let s = 7;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < p.count; i++) {
    const k = [p.getX(i), p.getY(i), p.getZ(i)].map((v) => v.toFixed(3)).join();
    if (!seen.has(k)) seen.set(k, 0.55 + 0.45 * rnd());
    const f = seen.get(k); p.setXYZ(i, p.getX(i) * f, p.getY(i) * f, p.getZ(i) * f);
  }
  return g;
})();

// ---------- catalogue: debris only ----------
let objs = [], catQ = [], T0 = Date.now(), simT = Date.now();
let meta = { fetched: null, errors: [] }, loaded = false, medRcs = 0.05;
let geo = null, meshes = {};
const BASE = Date.UTC(2026, 0, 1);
const wallS = () => (Date.now() - BASE) / 1000;
// cleaned pieces stay gone. A reset starts a new round (gen); everyone in the room keeps the union of what was cleaned.
let gen = 0; const cleaned = new Map(); // norad → wall s when it was cleaned

function weight(o) {
  if (S.rcs !== '1' || !(o.rcs > 0)) return 1;
  return Math.min(3, Math.max(0.5, Math.sqrt(o.rcs / medRcs)));
}
const elW = NOBJ_W;
let elTex = [], stArr = null, stTex = null, posRT = null, nRows = 1, weights = null;
const dataTex = (arr, w, ch, fmt) => { const t = new THREE.DataTexture(arr, w, arr.length / w / ch, fmt, THREE.FloatType); t.needsUpdate = true; return t; };
const posMat = new THREE.ShaderMaterial({
  uniforms: { tE0: { value: null }, tE1: { value: null }, tE2: { value: null }, tSt: { value: null }, uDt: { value: 0 }, uRot: { value: 0 }, uSize: { value: 50 }, uMaxAlt: { value: 1e9 }, uNow: { value: 0 }, uN: { value: 0 } },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
  uniform highp sampler2D tE0, tE1, tE2, tSt; uniform float uDt, uRot, uSize, uMaxAlt, uNow; uniform int uN;
  void main() {
    ivec2 px = ivec2(gl_FragCoord.xy); int id = px.y * ${elW} + px.x;
    if (id >= uN) { gl_FragColor = vec4(0.0); return; }
    vec4 e0 = texelFetch(tE0, px, 0), e1 = texelFetch(tE1, px, 0), e2 = texelFetch(tE2, px, 0), st = texelFetch(tSt, px, 0);
    float e = e0.y;
    float M = mod(e1.z + e2.z * uDt + e1.w * uDt * uDt, 6.2831853);
    float O = e1.x + e2.x * uDt, w = e1.y + e2.y * uDt;
    float E = M + e * sin(M);
    for (int k = 0; k < 4; k++) E -= (E - e * sin(E) - M) / (1.0 - e * cos(E));
    float x = e0.x * (cos(E) - e), y = e0.x * sqrt(max(0.0, 1.0 - e * e)) * sin(E);
    float cO = cos(O), sO = sin(O), ci = cos(e0.z), si = sin(e0.z), cw = cos(w), sw = sin(w);
    vec3 p = vec3((cO*cw - sO*sw*ci) * x + (-cO*sw - sO*cw*ci) * y, (sO*cw + cO*sw*ci) * x + (-sO*sw + cO*cw*ci) * y, (sw*si) * x + (cw*si) * y);
    float cr = cos(uRot), sr = sin(uRot);
    p.xy = vec2(cr * p.x - sr * p.y, sr * p.x + cr * p.y);
    float r = uSize * e2.w;
    if (length(p) - 6378.137 > uMaxAlt) r = 0.0;
    else if (st.x > 0.0) { float k = clamp((uNow - st.x) / 0.35, 0.0, 1.0); r *= 1.0 - k * k; } // cleaned: shrinks away
    gl_FragColor = vec4(p.x, p.z, -p.y, r);
  }`, depthTest: false, depthWrite: false });
const posScene = new THREE.Scene(), posQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), posMat); posQuad.frustumCulled = false; posScene.add(posQuad);

function build() {
  const n = objs.length; nRows = Math.max(1, Math.ceil(n / elW));
  catQ = objs.map((o) => ORB.prep(o, T0));
  weights = Float32Array.from(objs, weight);
  const e0 = new Float32Array(nRows * elW * 4), e1 = new Float32Array(nRows * elW * 4), e2 = new Float32Array(nRows * elW * 4);
  catQ.forEach((q, j) => { e0.set([q.a, q.e, q.i, 2], j * 4); e1.set([q.O, q.w, q.M, q.nd], j * 4); e2.set([q.dO, q.dw, q.dM, weights[j]], j * 4); });
  elTex.forEach((t) => t.dispose()); elTex = [e0, e1, e2].map((a) => dataTex(a, elW, 4, THREE.RGBAFormat));
  stTex?.dispose(); stArr = new Float32Array(nRows * elW * 4); stTex = dataTex(stArr, elW, 4, THREE.RGBAFormat);
  objs.forEach((o, j) => { stArr[j * 4] = cleaned.get(o.norad) || 0; });
  const pu = posMat.uniforms; pu.tE0.value = elTex[0]; pu.tE1.value = elTex[1]; pu.tE2.value = elTex[2]; pu.tSt.value = stTex; pu.uN.value = n;
  posRT?.dispose(); posRT = new THREE.WebGLRenderTarget(elW, nRows, { type: THREE.FloatType, format: THREE.RGBAFormat, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: false, generateMipmaps: false });
  U.tObj.value = posRT.texture;
  if (!geo) {
    geo = new THREE.InstancedBufferGeometry();
    geo.setAttribute('position', shard.attributes.position);
    const M = (mat) => { const m = new THREE.Mesh(geo, mat); m.frustumCulled = false; return m; };
    meshes = { piece: M(pieceMat), eq: eqMats.map(M) };
    scene.add(meshes.piece); eqScene.add(...meshes.eq);
  }
  geo.instanceCount = n;
}
function reweight() {
  if (!weights) return;
  objs.forEach((o, j) => { weights[j] = weight(o); });
  const e2 = elTex[2].image.data; weights.forEach((w, j) => { e2[j * 4 + 3] = w; }); elTex[2].needsUpdate = true;
}
function update() {
  const pu = posMat.uniforms;
  pu.uDt.value = (simT - T0) / 1000; pu.uRot.value = -ORB.gmst(simT); pu.uSize.value = SIZE_KM(); pu.uMaxAlt.value = S.range === 'leo' ? 2000 : 1e9; pu.uNow.value = wallS();
  renderer.setRenderTarget(posRT); renderer.render(posScene, eqCam);
}
const idx = new Map();
function markCleaned(norad, t) {
  if (cleaned.has(norad)) return false;
  cleaned.set(norad, t);
  const j = idx.get(norad);
  if (stArr && j != null) { stArr[j * 4] = t; stTex.needsUpdate = true; }
  return true;
}
function resetRound(g) {
  gen = g; cleaned.clear();
  if (stArr) { stArr.fill(0); stTex.needsUpdate = true; }
}
function ingest(parts) {
  // debris only: SATCAT says DEB (an object in the debris query that SATCAT doesn't know yet counts as debris)
  objs = ORB.parseCatalogue({ debris: parts.debris, satcat: parts.satcat }).filter((o) => o.type === 2);
  const r = objs.map((o) => o.rcs).filter((x) => x > 0).sort((a, b) => a - b);
  if (r.length) medRcs = r[Math.floor(r.length / 2)];
  idx.clear(); objs.forEach((o, j) => idx.set(o.norad, j));
  T0 = simT; build(); loaded = true; panelSync();
}
const good = {};
async function load() {
  const names = ['debris', 'satcat'];
  const res = await Promise.all(names.map((p) => fetch('/api/space-objects?part=' + p).then((r) => r.json()).catch((e) => ({ rows: [], errors: [String(e)] }))));
  const failed = [];
  names.forEach((p, i) => { if (res[i].rows?.length) good[p] = res[i]; else failed.push(p); });
  meta = { fetched: Object.values(good).map((r) => r.fetched).filter(Boolean).sort()[0] ?? null, errors: failed };
  if (good.debris) ingest(good);
  if (failed.length) setTimeout(load, 10 * 60e3);
}

function sunEci(ms) {
  const n = ms / 864e5 + 2440587.5 - 2451545, L = (280.46 + 0.9856474 * n) * D2R, g = (357.528 + 0.9856003 * n) * D2R;
  const lam = L + (1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * D2R, eps = 23.439 * D2R;
  return [Math.cos(lam), Math.cos(eps) * Math.sin(lam), Math.sin(eps) * Math.sin(lam)];
}
let clock = null;

// ---------- picking: tap → which piece (same orbit model on the CPU) ----------
const tmpP = [0, 0, 0], tmpS = [0, 0, 0];
function pick(ro, rd, pxAt) {
  const dt = (simT - T0) / 1000, rot = -ORB.gmst(simT), size = SIZE_KM(), maxAlt = S.range === 'leo' ? 2000 : 1e9;
  const eb = ro[0] * rd[0] + ro[1] * rd[1] + ro[2] * rd[2], ec = ro[0] ** 2 + ro[1] ** 2 + ro[2] ** 2 - RE * RE, eh = eb * eb - ec;
  const tEarth = eh > 0 ? -eb - Math.sqrt(eh) : Infinity;
  let best = -1, bestT = Infinity, near = -1, nearK = Infinity;
  for (let j = 0; j < objs.length; j++) {
    if (cleaned.has(objs[j].norad)) continue;
    ORB.eciToScene(ORB.posEci(catQ[j], dt, tmpP), rot, tmpS);
    if (Math.hypot(tmpS[0], tmpS[1], tmpS[2]) - RE > maxAlt) continue;
    const ox = tmpS[0] - ro[0], oy = tmpS[1] - ro[1], oz = tmpS[2] - ro[2];
    const t = ox * rd[0] + oy * rd[1] + oz * rd[2];
    if (t <= 0 || t > tEarth + size * 3) continue;
    const dm = Math.sqrt(Math.max(0, ox * ox + oy * oy + oz * oz - t * t));
    const r = size * weights[j] * 0.8, tol = pxAt(t) * 12;
    if (dm < r && t - r < bestT) { best = j; bestT = t - r; }
    else if (dm < r + tol && dm / (r + tol) < nearK) { near = j; nearK = dm / (r + tol); }
  }
  return best >= 0 ? best : near;
}
function rayFromTap(x, y) {
  const v = S.view;
  if (v === '3d') {
    const ndc = new THREE.Vector3(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1, 0.5).unproject(camera);
    const rd = ndc.sub(camera.position).normalize();
    const k = 2 * Math.tan(camera.fov / 2 * D2R) / innerHeight;
    return { ro: camera.position.toArray(), rd: rd.toArray(), pxAt: (t) => k * t };
  }
  let n;
  if (v === '360') { const lo = (x / innerWidth - 0.5) * TAU, la = (0.5 - y / innerHeight) * Math.PI; n = new THREE.Vector3(Math.cos(la) * Math.cos(lo), Math.sin(la), -Math.cos(la) * Math.sin(lo)); }
  else {
    const p = new THREE.Vector3(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1, 0.5).unproject(ballCam), o = ballCam.position, d = p.sub(o).normalize();
    const b = o.dot(d), h = b * b - (o.lengthSq() - 1); if (h < 0) return null;
    n = o.clone().addScaledVector(d, -b - Math.sqrt(h)).normalize();
  }
  const d = n.applyMatrix3(rot360M);
  return { ro: d.clone().multiplyScalar(1e6).toArray(), rd: d.clone().negate().toArray(), pxAt: (t) => Math.PI / 1080 * (1e6 - t) };
}
function tap(x, y) {
  if (!loaded) return;
  const r = rayFromTap(x, y); if (!r) return;
  const j = pick(r.ro, r.rd, r.pxAt);
  if (j < 0) return;
  const n = objs[j].norad, t = wallS();
  if (markCleaned(n, t)) sendClean(n, t);
}

// ---------- touch: one finger turns, two fingers zoom, a tap cleans ----------
const ptrs = new Map(); let gesture = null, pinch0 = null;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) gesture = { t0: performance.now(), moved: 0, multi: false };
  else if (gesture) gesture.multi = true;
  pinch0 = null;
});
canvas.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (gesture) gesture.moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0) zoom(pinch0 / Math.max(d, 1));
    pinch0 = d; return;
  }
  turn(dx, dy);
});
const up = (e) => {
  ptrs.delete(e.pointerId); pinch0 = null;
  if (ptrs.size === 0 && gesture) { if (!gesture.multi && gesture.moved < 10 && performance.now() - gesture.t0 < 500) tap(e.clientX, e.clientY); gesture = null; }
};
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', (e) => { zoom(Math.exp(e.deltaY * 0.0012)); e.preventDefault(); }, { passive: false });
function turn(dx, dy) {
  if (S.view === 'ball') { ball.yaw -= dx * 0.006; ball.pitch = Math.max(-1.45, Math.min(1.45, ball.pitch + dy * 0.006)); return; }
  if (S.view === '360') {
    const k = Math.PI / innerHeight;
    rot360.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -dx * k * 2)).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), dy * k)).normalize();
    sendLook(true); return;
  }
  const k = 0.005 * Math.min(1, (view.dist - RE) / 20000 + 0.15);
  view.yaw -= dx * k; view.pitch = Math.max(-1.5, Math.min(1.5, view.pitch + dy * k));
}
function zoom(f) {
  if (S.view === 'ball') { ball.dist = Math.max(1.4, Math.min(12, ball.dist * f)); return; }
  if (S.view === '360') return;
  view.dist = Math.max(RE + 900, Math.min(260000, RE + (view.dist - RE) * f));
}

// ---------- room: cleaned pieces and the sphere's turn are shared with the LED display (public relay, room code) ----------
const ROOM = ORB.cleanRoom(Q.get('room'));
const TOPIC = 'sampling-sphere/v1/cleanup' + (ROOM ? '/' + ROOM : ''), ME = Math.random().toString(36).slice(2, 10);
let mq = null, relayOk = false, lookT = 0, snapT = null;
const publish = (t, obj, retain = false) => { if (mq && relayOk) mq.publish(TOPIC + t, JSON.stringify(obj), { retain, qos: retain ? 1 : 0 }); };
function sendClean(n, t) { publish('/clean', { n, t, gen, by: ME }); clearTimeout(snapT); snapT = setTimeout(sendSnapshot, 500); }
function sendSnapshot() { publish('/cleaned', { gen, list: [...cleaned].map(([n, t]) => [n, Math.round(t)]), by: ME }, true); }
function sendLook(force) {
  if (ROLE === 'display') return;
  const n = performance.now(); if (!force && n - lookT < 50) return; lookT = n;
  publish('/look', { q: rot360.toArray(), by: ME }, true);
}
function sendClock() { clock = { wall0: Date.now(), sim0: simT, speed: SPEED(), by: ME }; publish('/clock', clock, true); }
function startOver() { resetRound(Date.now()); sendSnapshot(); }
if (!Q.has('solo') && !TEST) import('/sphere-assets/vendor/mqtt.esm.js').then((m) => {
  const mqtt = m.default || m;
  mq = mqtt.connect(Q.get('broker') || 'wss://broker.emqx.io:8084/mqtt', { connectTimeout: 30000, keepalive: 30 });
  mq.on('close', () => { relayOk = false; }); mq.on('offline', () => { relayOk = false; });
  mq.on('connect', () => { relayOk = true; mq.subscribe([TOPIC + '/clean', TOPIC + '/cleaned', TOPIC + '/look', TOPIC + '/clock']); });
  mq.on('message', (t, msg) => {
    let d; try { d = JSON.parse(msg.toString()); } catch { return; }
    if (!d || d.by === ME) return;
    const k = t.slice(TOPIC.length);
    if (k === '/clean') {
      if (Number.isFinite(d.n) && Number.isFinite(d.t) && Number.isFinite(d.gen)) {
        if (d.gen > gen) resetRound(d.gen);
        if (d.gen === gen) markCleaned(d.n, d.t);
      }
    } else if (k === '/cleaned') {
      if (Number.isFinite(d.gen) && Array.isArray(d.list) && d.gen >= gen) {
        const mine = d.gen === gen && cleaned.size > 0; // same round: keep the union
        if (d.gen > gen) resetRound(d.gen);
        for (const e of d.list) if (Array.isArray(e) && e.every(Number.isFinite)) markCleaned(e[0], e[1] - 1); // no shrink animation for old ones
        if (mine && cleaned.size > d.list.length && ROLE !== 'display') { clearTimeout(snapT); snapT = setTimeout(sendSnapshot, 500); }
      }
    } else if (k === '/look') {
      if (Array.isArray(d.q) && d.q.length === 4 && d.q.every(Number.isFinite) && !ptrs.size) rot360.fromArray(d.q).normalize();
    } else if (k === '/clock') {
      if ([d.wall0, d.sim0, d.speed].every(Number.isFinite)) { clock = d; S.spd = Math.log10(Math.max(1, d.speed)) * 25; panelSync(); }
    }
  });
}).catch(() => {});

// the tablet's view sets the LED frame (the point facing the viewer becomes the frame centre)
let camQ = null, lookDirty = false;
function lookFromCamera() {
  const v = camera.position.clone().normalize(), up = camera.up.clone().applyQuaternion(camera.quaternion).normalize(), z = new THREE.Vector3().crossVectors(v, up);
  const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(v, up, z));
  if (!camQ) { camQ = q.clone(); return; }
  if (q.angleTo(camQ) > 1e-4) { camQ.copy(q); rot360.copy(q); lookDirty = true; }
  if (lookDirty && performance.now() - lookT >= 50) { lookDirty = false; sendLook(true); }
}

// ---------- panel (studio) ----------
const SL = [['size', 'Size', 0, 100, () => Math.round(SIZE_KM()) + ' km'], ['tumble', 'Tumble', 0, 100, () => S.tumble + ''], ['spd', 'Speed', 0, 100, () => SPEED().toLocaleString() + '×'], ['q360', '360 detail', 50, 200, () => Math.round(1920 * S.q360 / 100) + ' px']];
const SEG = [['view', 'View', [['3d', '3D'], ['360', '360'], ['ball', 'Sphere']]], ['light', 'Earth', [['day', 'All day'], ['sun', 'Sun now']]],
  ['rcs', 'Size by', [['1', 'Radar size'], ['0', 'Same']]], ['range', 'Debris', [['all', 'All'], ['leo', 'Below 2,000 km']]]];
function panelBuild() {
  $('panel').innerHTML = SEG.map(([k, l, o]) => `<div class="row"><label>${l}</label><div class="seg" data-k="${k}">${o.map(([v, t]) => `<button data-v="${v}">${t}</button>`).join('')}</div></div>`).join('')
    + SL.map(([k, l, a, b]) => `<div class="row"><label>${l}</label><input type="range" data-k="${k}" min="${a}" max="${b}" step="1"><output data-o="${k}"></output></div>`).join('')
    + `<div class="row"><label>Colour</label><input type="color" id="col"></div>
    <div class="row"><label></label><div class="seg"><button id="again">Put all debris back</button></div></div>
    <div class="row"><label></label><div class="seg"><button id="now">Back to now</button><button id="reset">Reset settings</button></div></div>
    <div class="row"><label></label><div class="seg"><button id="copy">Copy display URL</button></div></div>
    <div class="note">Only debris: every object still in orbit that the US Space Force catalogue (via CelesTrak SATCAT) types as debris, at its real position now. Each piece is shown much bigger than it is, so together they cover the Earth. A tap cleans one piece; it stays gone for everyone in the room until "Put all debris back". Radar size: bigger radar cross-section, bigger piece (relative to the median debris, kept between 0.5× and 3×).</div>`;
  $('panel').querySelectorAll('.seg[data-k] button').forEach((b) => b.onclick = () => { const k = b.parentNode.dataset.k; S[k] = b.dataset.v; if (k === 'rcs') reweight(); save(); panelSync(); resize(); });
  $('panel').querySelectorAll('input[data-k]').forEach((r) => r.oninput = () => { const k = r.dataset.k, was = SPEED(); S[k] = +r.value; if (k === 'spd' && SPEED() !== was) { simT = simNow(); clock = null; sendClock(); } save(); panelSync(); });
  $('col').oninput = (e) => { S.color = e.target.value; save(); };
  $('again').onclick = startOver;
  $('now').onclick = () => { simT = Date.now(); S.spd = 0; clock = null; sendClock(); save(); panelSync(); };
  $('copy').onclick = () => {
    const q = new URLSearchParams(); for (const k of Object.keys(DEF)) if (k !== 'view' && String(S[k]) !== String(DEF[k])) q.set(k, S[k]);
    if (ROOM) q.set('room', ROOM);
    const url = location.origin + '/cleanup-display' + (q.toString() ? '?' + q : '');
    navigator.clipboard?.writeText(url).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => { $('copy').textContent = 'Copy display URL'; }, 1500); }, () => { $('copy').textContent = url; });
  };
  $('reset').onclick = () => { S = { ...DEF }; reweight(); save(); panelSync(); resize(); };
}
function panelSync() {
  document.querySelectorAll('.seg[data-k]').forEach((s) => s.querySelectorAll('button').forEach((b) => b.classList.toggle('on', String(S[s.dataset.k]) === b.dataset.v)));
  for (const [k, , , , f] of SL) { const r = document.querySelector(`input[data-k="${k}"]`); if (r) r.value = S[k]; const o = document.querySelector(`output[data-o="${k}"]`); if (o) o.textContent = f(); }
  const c = $('col'); if (c) c.value = S.color;
}
$('toggle').onclick = () => { $('panel').classList.toggle('on'); $('toggle').classList.toggle('on'); };
panelBuild(); panelSync();

// ---------- sizing ----------
const PR_MAX = ROLE === 'display' ? 1 : Math.min(devicePixelRatio || 1, 2);
function resize() {
  renderer.setPixelRatio(PR_MAX); renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  ballCam.aspect = innerWidth / innerHeight; ballCam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- frame ----------
let last = performance.now(), fps = 60;
const simNow = () => clock ? clock.sim0 + (Date.now() - clock.wall0) * clock.speed : simT;
function frame(now) {
  if (!TEST) requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now; fps = fps * 0.95 + 0.05 / Math.max(dt, 1e-3);
  simT = clock ? simNow() : simT + dt * 1000 * SPEED();
  render();
}
function render() {
  if (loaded && Math.abs(simT - T0) > 432e5) { T0 = simT; build(); }
  if (loaded) update();
  const rot = -ORB.gmst(simT);
  U.uLight.value = S.light === 'sun' ? 1 : 0;
  U.uTime.value = performance.now() / 1000; U.uTumble.value = S.tumble / 100;
  U.uColor.value.set(S.color);
  const se = sunEci(simT), cr = Math.cos(rot), sr = Math.sin(rot);
  U.uSun.value.set(cr * se[0] - sr * se[1], se[2], -(sr * se[0] + cr * se[1]));

  const v = S.view;
  if (v === '3d') {
    camera.position.set(Math.cos(view.pitch) * Math.sin(view.yaw), Math.sin(view.pitch), Math.cos(view.pitch) * Math.cos(view.yaw)).multiplyScalar(view.dist);
    camera.lookAt(0, 0, 0);
    camera.near = Math.max(5, (view.dist - RE - 2500) * 0.3); camera.far = view.dist + 60000; camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    // light from over the viewer's shoulder
    U.uLightDir.value.copy(camera.position).normalize().addScaledVector(new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion), 0.6).normalize();
    lookFromCamera();
    renderer.setRenderTarget(null); renderer.render(scene, camera);
  } else {
    rot360M.setFromMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(rot360)); rot360T.copy(rot360M).transpose();
    const qs = S.q360 / 100, ew = Math.round(1920 * qs), eh = Math.round(1080 * qs);
    if (eqRT.width !== ew) eqRT.setSize(ew, eh);
    U.uRes.value.set(ew, eh);
    renderer.setRenderTarget(eqRT); renderer.clear(); renderer.render(eqScene, eqCam);
    renderer.setRenderTarget(null);
    if (v === '360') renderer.render(blitScene, eqCam);
    else {
      ballCam.position.set(Math.cos(ball.pitch) * Math.sin(ball.yaw), Math.sin(ball.pitch), Math.cos(ball.pitch) * Math.cos(ball.yaw)).multiplyScalar(ball.dist);
      ballCam.lookAt(0, 0, 0); renderer.setClearColor(0x050505, 1); renderer.clear(); renderer.render(ballScene, ballCam); renderer.setClearColor(0x000000, 1);
    }
  }
  info();
}
function info() {
  const el = $('info');
  if (!loaded) { el.innerHTML = meta.errors.length ? '<span class="err">Could not load the debris catalogue. Nothing is shown (no stand-in data).</span>' : 'Loading the debris catalogue…'; return; }
  const left = objs.length - cleaned.size, d = new Date(simT), live = Math.abs(simT - Date.now()) < 5000;
  el.textContent = ROLE === 'tablet' ? `${left.toLocaleString()}`
    : `${left.toLocaleString()} pieces of debris · ${cleaned.size.toLocaleString()} cleaned\n${live ? 'now' : d.toISOString().slice(0, 16).replace('T', ' ') + ' UTC'} · ${SPEED().toLocaleString()}× · ${fps.toFixed(0)} fps${ROOM ? ' · room ' + ROOM : ''}`;
}

if (TEST) window.__cl = { ingest, render, tap, S, view, rot360, setSim: (t) => { simT = t; }, pick, objs: () => objs, cleaned, markCleaned, setView: (k) => { S.view = k; resize(); }, startOver };
load();
requestAnimationFrame(frame);
</script>
</body>
</html>
